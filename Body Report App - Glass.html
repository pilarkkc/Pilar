/* Elegant count-up for a metric. Reads target from data-count if present, else from textContent. */
function ahCountUp(el){
  if(!el) return;
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const src=el.getAttribute('data-count')!=null?el.getAttribute('data-count'):el.textContent;
  const target=parseFloat(src); if(isNaN(target)){return;}
  const decimals=(src.split('.')[1]||'').length;
  if(reduce){el.textContent=target.toFixed(decimals);return;}
  const dur=1100, t0=performance.now();
  const ease=t=>1-Math.pow(1-t,3);
  function step(now){
    const p=Math.min(1,(now-t0)/dur);
    el.textContent=(target*ease(p)).toFixed(decimals);
    if(p<1) requestAnimationFrame(step); else el.textContent=target.toFixed(decimals);
  }
  requestAnimationFrame(step);
}

/* Frame-locked ring + number — both driven from one clock so they land together.
   arcEl: .ah-ring-fill path (carries data-arclen / data-target-pct)
   numEl: .ah-hero-num element
   fromPct→toPct: percentage the arc fills (0..100). Number tweens fromVal→toVal in parallel. */
function ahDriveRing(arcEl,numEl,fromPct,toPct,opts){
  opts=opts||{};
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const arcLen=arcEl?parseFloat(arcEl.getAttribute('data-arclen')):0;
  const fromVal=(opts.fromVal!=null)?opts.fromVal:(numEl?parseFloat(numEl.textContent)||0:0);
  const toVal=(opts.toVal!=null)?opts.toVal:(numEl?parseFloat(numEl.textContent)||0:0);
  const dOf=v=>(String(v).split('.')[1]||'').length;
  const decimals=Math.max(dOf(toVal),dOf(fromVal),numEl?dOf(numEl.textContent):0);
  const par=arcEl&&arcEl.parentNode?arcEl.parentNode:null;
  const setFrame=(pct,val)=>{
    if(arcEl){const off=arcLen*(1-Math.min(Math.max(pct,0),100)/100);arcEl.style.strokeDashoffset=off.toFixed(1);}
    if(numEl&&!isNaN(val))numEl.textContent=val.toFixed(decimals);
  };
  if(reduce||!arcEl||opts.instant){ if(numEl)numEl.textContent=toVal.toFixed(decimals); setFrame(toPct,toVal); return; }
  // pin the starting frame immediately so the final value never flashes before the tween begins
  setFrame(fromPct,fromVal);
  const dur=opts.dur||1000, delay=opts.delay||0, t0=performance.now()+delay;
  // quint ease-out — decelerates harder near the end so the value "crawls" into place (premium settle)
  const ease=t=>1-Math.pow(1-t,5);
  function step(now){
    if(now<t0){requestAnimationFrame(step);return;}
    const p=Math.min(1,(now-t0)/dur), e=ease(p);
    setFrame(fromPct+(toPct-fromPct)*e, fromVal+(toVal-fromVal)*e);
    if(p<1) requestAnimationFrame(step); else setFrame(toPct,toVal);
  }
  requestAnimationFrame(step);
}


/* ── Share Camera Overlay ── */
function getShareMetrics(name){
  const all=allBookings.filter(b=>b.contact_name===name&&b.booking_status==='Booked');
  const stats=process(all,null);
  if(!stats) return null;

  const streak=calcStreak(name);
  const total=stats.total;

  // ── 1 week rolling window (7 days) ──
  const now=new Date();
  const weekAgo=new Date(now);weekAgo.setDate(now.getDate()-7);
  const weekSess=all.filter(s=>{const d=new Date(s.event_date);return !isNaN(d)&&d>=weekAgo&&d<=now;});

  // PILAR LOAD — total weekly strain (not per-session avg) ✅
  const weekStrain=weekSess.reduce((a,s)=>a+getStrainWeight(s.event_name||'')*(parseInt(s.duration)||60)/60,0);
  const loadScore=parseFloat(Math.min(21,weekStrain*1.3).toFixed(1));
  const loadPct=Math.min(100,Math.round(loadScore/21*100));
  const loadZone=loadScore>=13?'HIGH LOAD':loadScore>=7?'OPTIMAL':loadScore>=3?'ACTIVE':'LIGHT';
  // Show actual this-week values only — 0 if no sessions
  const loadVal=weekSess.length>0?String(loadScore):'0';
  const loadSub=weekSess.length>0?(total<5?'เพิ่งเริ่ม':loadZone):'THIS WEEK';
  const loadPctFinal=weekSess.length>0?loadPct:0;

  // CONSISTENCY — this week (Mon→now) ✅
  let wc={thisW:0,lastW:0,diff:0};
  try{wc=getWeekComp(name,'thisWeek');}catch(e){}
  const consistVal=wc.thisW>0?`${wc.thisW}x`:'0x';
  const consistPct=weekSess.length>0?Math.min(100,Math.round(wc.thisW/5*100)):0;
  const consistSub=weekSess.length>0?(wc.diff>0?'↑ vs last wk':wc.diff<0?'↓ vs last wk':'/wk avg'):'THIS WEEK';

  // BURN — this week calories ✅
  const AVG=65,KCAL_MULT=1.15;
  const weekKcal=Math.round(weekSess.reduce((a,s)=>{
    const mins=parseInt(s.duration)||60;
    const met=MET[classify(s.event_name||'',s.instructors)]||3.0;
    return a+met*AVG*mins/60;
  },0)*KCAL_MULT);
  const burnPct=Math.min(100,Math.round(weekKcal/1500*100)); // 1500 kcal/wk target
  const burnSub=weekSess.length>0?'this week':'no data';

  // Latest class — most recent booking ✅
  const sortedSess=all.map(s=>{const _bk=s.booking_date?new Date(s.booking_date):null;return {dt:new Date(s.event_date),bookingDt:(_bk&&!isNaN(_bk))?_bk:null,name:s.event_name||'',instructor:(s.instructors||'').split(',')[0].trim(),mins:parseInt(s.duration)||60,type:classify(s.event_name||'',s.instructors)};})
    .filter(s=>!isNaN(s.dt)).sort((a,b)=>b.dt-a.dt);
  const latest=sortedSess[0]||null;
  let latestClass=latest?.name||'';
  // clean: cut at separators like | / – and trim, then cap length
  latestClass=latestClass.split(/[|\/–—]/)[0].trim();
  const shortClass=latestClass.length>20?latestClass.substring(0,19).trim()+'…':latestClass;

  const noActivityThisWeek = weekSess.length === 0;

  // ── Persona (identity) — reuse _persona on member rows (ascending) ──
  const memRows=[...sortedSess].reverse();
  let persona={emoji:'',name:'Building',why:`${total} classes so far`};
  try{ persona=_persona(memRows); }catch(e){}
  const personaWhyEN=_personaWhyEN(persona,memRows,total);

  // ── milestone ladder for total ──
  const ladder=[10,25,50,75,100,150,200,300,500,750,1000];
  const nextMile=ladder.find(m=>m>total)||(Math.ceil(total/250)*250+250);
  const prevMile=[...ladder].reverse().find(m=>m<=total)||0;
  const totalPct=Math.min(100,Math.round((total-prevMile)/(nextMile-prevMile)*100));
  const streakPct=Math.min(100,Math.round(streak/26*100));

  // load ring (shared across layouts)
  const loadRingObj={val:loadVal,label:'LOAD',sub:weekSess.length>0?loadZone:'THIS WEEK',color:'#FFFFFF',pct:loadPctFinal};
  // milestone ring (for achievement layout) — fills toward next milestone, value = total
  const mileRingObj={val:String(total),topLabel:'CLASS',sub:`→ ${nextMile} next`,color:'#FFFFFF',pct:totalPct};

  // ── Activity Score (same studio-calibrated curve as the hero ring) ──
  const _aSpanDays=sortedSess.length>=2?Math.max(7,Math.ceil((sortedSess[0].dt-sortedSess[sortedSess.length-1].dt)/86400000)+1):7;
  const _aWeeks=Math.max(_aSpanDays/7,1);
  const _aCPW=(stats.weeklyStrain!=null?stats.weeklyStrain:weekStrain)/3.0/_aWeeks;
  let _aRest=0;{
    const _allD=new Set(all.map(b=>{const d=new Date(b.event_date);d.setHours(0,0,0,0);return d.getTime();}));
    const _t=new Date();_t.setHours(0,0,0,0);
    for(let i=0;i<180;i++){const d=new Date(_t);d.setDate(_t.getDate()-i);if(_allD.has(d.getTime()))break;_aRest++;}
  }
  const actScore=_activityScore(_aCPW,_aRest);
  const activityRingObj={val:String(actScore),label:'ACTIVITY',sub:_activityTier(actScore),color:'#FFFFFF',pct:actScore};

  // ── This-week classes (always-shareable: celebrates effort, never judges) ──
  const _wcNow=wc.thisW||0, _wcDiff=wc.diff||0;
  let weekClassesObj;
  // When this week is empty BUT the member already has history, auto-switch the
  // card to an All-Time view so there is always something worth sharing.
  if(_wcNow===0 && total>0){
    const _atPct=Math.min(100,Math.round((total-prevMile)/(nextMile-prevMile)*100));
    weekClassesObj={
      count:total,
      diff:0,
      pct:_atPct,
      eyebrow:'All time',
      headline:'Your journey',
      sub:`${total} ${total===1?'class':'classes'} since day one`,
      color:'#FFFFFF'
    };
  } else {
    // ring fills toward a 5-class "full" week, capped 100% — purely visual encouragement
    const _wcPct=Math.min(100,Math.round(_wcNow/5*100));
    // positive headline regardless of count
    const _wcHeadline=
      _wcNow===0 ? 'Your week starts here'
      : _wcNow>=5 ? 'Unstoppable'
      : _wcNow>=3 ? 'On a roll'
      : 'Off the mark';
    // sub line — compare to last week only when it adds something positive
    const _wcSub=
      _wcNow===0 ? 'Book your first class'
      : _wcDiff>0 ? `${_wcDiff} more than last week`
      : _wcDiff===0&&_wcNow>0 ? 'Same strong pace as last week'
      : `${_wcNow} ${_wcNow===1?'class':'classes'} in the books`;
    weekClassesObj={count:_wcNow,diff:_wcDiff,pct:_wcPct,eyebrow:'This week',headline:_wcHeadline,sub:_wcSub,color:'#FFFFFF'};
  }

  // latest class meta (for story layout) — clean, valid coach only
  let storyMeta='', storyMeta2='';
  if(latest){
    const t=latest.dt;
    const hasTime=t.getHours()!==0||t.getMinutes()!==0;
    const timeStr=hasTime?t.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'';
    const day=t.toLocaleDateString('en-US',{weekday:'short'});
    // only show coach if it's a real name (not blank / "Instructor" placeholder)
    const ci=(latest.instructor||'').trim();
    const ciClean=ci.replace(/^\s*(instructor|coach|ครู)\s+/i,'').trim();
    const validCoach=ciClean && !/^(instructor|coach|ครู)$/i.test(ci);
    const coach=validCoach?`with ${ciClean.split(/\s+/)[0]}`:'';
    storyMeta=[day,timeStr].filter(Boolean).join(' · ');   // line 1 (no coach name)
    storyMeta2=`Session #${total}`;                               // line 2
  }

  return{
    // shared
    loadRing:loadRingObj,
    activityRing:activityRingObj,
    weekClasses:weekClassesObj,
    activityScore:actScore,
    className:shortClass,
    total, streak, nextMile,
    noActivityThisWeek,
    // Layout A — Identity Card (persona hero + small ring + 2 stats)
    persona:{emoji:persona.emoji,name:persona.name,why:personaWhyEN},
    statPills:[
      {val:String(total),label:'CLASSES'},
      {val:String(streak),label:'WK STREAK'},
    ],
    // Layout B — Achievement Badge (milestone ring + streak headline)
    mileRing:mileRingObj,
    // Headline describes STATE, never repeats the ring's number (the ring already
    // shows the count + WK). Single line so the export mirror never wraps/overlaps.
    // ห้ามแตะ segment ring / เลข / WK — แก้เฉพาะ headline string นี้
    streakHeadline:_streakHeadline(streak, _longestStreak(all.map(b=>({dt:new Date(b.event_date)})))),
    streakWeeks:streak,
    // Layout C — Story Moment (latest class + ring)
    storyMeta, storyMeta2,
    summaryLine:`${total} classes · ${streak} week streak`,
    // raw sessions (event_date list) for period switcher on layout A
    _periodSess:all.map(s=>s.event_date).filter(Boolean),
    _periodTotal:total,
    _periodPrevMile:prevMile,
    _periodNextMile:nextMile,
  };
}

/* English one-liner reason per persona (share-friendly, avoids Thai) */
function _personaWhyEN(p,rows,total){
  const n=rows.length||1;
  const hrs=rows.map(r=>r.dt.getHours()).filter(h=>!isNaN(h));
  const mornPct=Math.round(hrs.filter(h=>h<10).length/n*100);
  const evePct=Math.round(hrs.filter(h=>h>=17).length/n*100);
  const tc={}; rows.forEach(r=>tc[r.type]=(tc[r.type]||0)+1);
  const te=Object.entries(tc).sort((a,b)=>b[1]-a[1]);
  const topType=te[0]?te[0][0]:'';
  const topTypePct=te[0]?Math.round(te[0][1]/n*100):0;
  const ic={}; rows.forEach(r=>{if(r.instructor)ic[r.instructor]=(ic[r.instructor]||0)+1;});
  const ie=Object.entries(ic).sort((a,b)=>b[1]-a[1]);
  switch(p.name){
    case 'Morning Regular': return `${mornPct}% of your classes start before 10AM`;
    case 'Evening Regular': return `${evePct}% of your classes are after 5PM`;
    case 'Across Formats': return `Spread evenly across ${te.length} formats`;
    case 'Consistent': return `Week after week, without a gap`;
    default:
      if(p.name && p.name.indexOf('Mostly ')===0){
        if(p.name.indexOf(' with ')>-1) return ie[0]?`${Math.round(ie[0][1]/n*100)}% of classes with ${ie[0][0].split(/\s+/)[0]}`:'';
        return `${topTypePct}% of your classes are ${topType}`;
      }
      return `${total} classes so far`;
  }
}

/* Map a flat accent colour to the bold Wrapped gradient that starts with it. */
function _wrGradForColor(c){
  if(!c) return null;

  return null;
}

async function fetchLiveCheckinClass(email){
  if(!email)return null;
  try{
    // เดิมดึง Sheet ทั้งใบผ่าน gviz public (ข้อมูลลูกค้าทุกคนรั่วมาที่ client)
    // เปลี่ยนมาขอผ่าน Apps Script ที่ filter ฝั่ง server แล้วคืนเฉพาะคลาสของ email นี้
    const url=`${API_URL}?action=getCheckin&email=${encodeURIComponent(email)}`;
    const timer=new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),5000));
    const res=await Promise.race([fetch(url),timer]);
    const data=await res.json();
    // Apps Script จริงคืน { status:'ok', checkin:... }
    if(!data||data.status!=='ok'||!data.checkin)return null;
    const cn=String(data.checkin).trim();
    return cn.length>28?cn.substring(0,26)+'…':cn;
  }catch(e){console.warn('checkin:',e.message);return null;}
}

    const weeks=last.map(s=>({on:s.count>0, count:s.count}));
    // pad to 10 cells if member has <10 weeks of history
    while(weeks.length<10) weeks.unshift({on:false,count:0});
    const caption = streak===0 ? 'One class restarts the chain'
      : (streak>=longest && streak>=3) ? 'Your longest run yet'
      : streak>=4 ? 'Building momentum' : 'Building consistency';
    return {streak,longest,weeks,caption};
  }
  if(type==='prime'){
    const timed=rows.filter(r=>r.dt.getHours()!==0||r.dt.getMinutes()!==0);
    if(timed.length<3) return null;
    const cell={}; timed.forEach(r=>{const k=r.dt.getDay()+'-'+r.dt.getHours();cell[k]=(cell[k]||0)+1;});
    const top=Object.entries(cell).sort((a,b)=>b[1]-a[1])[0];
    const [dow,hr]=top[0].split('-').map(Number);
    const dows=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const hrStr=h=>{const ap=h>=12?'PM':'AM';const hh=h%12||12;return hh+' '+ap;};
    // zone counts
    const z={morning:0,afternoon:0,evening:0};
    timed.forEach(r=>{const h=r.dt.getHours();
      if(h<12)z.morning++; else if(h<17)z.afternoon++; else z.evening++;});
    const tot=timed.length;
    const primeZone = hr<12?'morning':hr<17?'afternoon':'evening';
    const evPct=Math.round(z.evening/tot*100);
    const dayPct=Math.round((z.morning+z.afternoon)/tot*100);
    const evLine = evPct>=50?`${evPct}% evenings` : dayPct>=70?`${dayPct}% daytime` : 'mixed hours';
    return {day:dows[dow], time:hrStr(hr), primeZone, evLine,
            hourBuckets:(()=>{const b=new Array(8).fill(0);timed.forEach(r=>{const h=r.dt.getHours();if(h>=6&&h<22)b[Math.floor((h-6)/2)]++;});return b;})(),
            zonePct:{morning:Math.round(z.morning/tot*100),afternoon:Math.round(z.afternoon/tot*100),evening:evPct}};
  }
  return null;
}

/* ── Draw bg image + vignette on canvas ── */
function drawBgCanvas(img){
  const canvas=document.getElementById('shareCanvas');
  const maxW=1080;
  const scale=Math.min(1,maxW/img.width);
  const W=Math.round(img.width*scale);
  const H=Math.round(img.height*scale);
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');
  const s=Math.max(W/img.width,H/img.height);
  const dw=img.width*s,dh=img.height*s;
  ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
  // vignette removed — was leaving a dark halo around the edges of exported images
}

/* ── Period switcher for layout A (This Week dropdown) ──
   Filters the member's sessions into a chosen window and builds the ring object.
   No auto-switch: an empty window shows 0 with an encouraging headline. */
const _PERIODS=[
  {k:'W',  label:'This Week',  days:7},
  {k:'M',  label:'This Month', days:30},
  {k:'All',label:'All Time',   days:null},
];
function _periodLabel(k){const p=_PERIODS.find(x=>x.k===k);return p?p.label:'This Week';}
function _computePeriodObj(metrics,period){
  const def=_PERIODS.find(p=>p.k===period)||_PERIODS[0];
  // Canonical score for this window, identical to the main hero card.
  const act=_periodActivity(currentName, def.days);
  const score=act.score, count=act.count, tier=act.tier, color=act.color;
  const pct=Math.min(100,Math.max(0,score)); // ring fills to the score itself (0-100)
  const cls=count===1?'class':'classes';
  // headline = tier (graded, encouraging) · sub = classes in this window
  let headline,sub;
  if(count===0){
    headline=
      period==='W' ? 'Your week starts here'
      : period==='M' ? 'A fresh month'
      : 'Your journey starts here';
    sub=
      period==='W' ? 'Book your first class'
      : period==='M' ? 'Keep the momentum going'
      : 'Book your first class';
  }else{
    headline=tier; // Excellent / Very Active / Good / Building / Getting Started
    const windowWord=
      period==='W' ? 'this week'
      : period==='M' ? 'this month'
      : 'all time';
    sub=`${count} ${cls} ${windowWord}`;
  }
  return{count,score,pct,label:def.label,headline,sub,color};
}
/* Consistency counterpart of _computePeriodObj — same shape, periwinkle,
   so layout A can render the Consistency Score sticker with the period switcher. */
function _computePeriodConsistency(period){
  const def=_PERIODS.find(p=>p.k===period)||_PERIODS[0];
  const c=_periodConsistency(currentName, def.days);
  const pct=Math.min(100,Math.max(0,c.pct));
  let headline,sub;
  if(!c.count){
    headline = period==='W' ? 'Your week starts here'
      : period==='M' ? 'A fresh month' : 'Your journey starts here';
    sub = period==='W' ? 'Book your first class'
      : period==='M' ? 'Keep the momentum going' : 'Book your first class';
  }else{
    headline=c.state;                        // Perfect / On Track / Building / ...
    const cls=c.count===1?'class':'classes';
    const windowWord = period==='W' ? 'this week' : period==='M' ? 'this month' : 'all time';
    sub=`${c.count} ${cls} ${windowWord} · ${c.streak} week${c.streak!==1?'s':''} streak`;
  }
  return {count:c.count, pct, label:def.label, headline, sub, state:c.state, streak:c.streak};
}

  /* ── DC 1c sticker tile system ── */
  const IC=p=>`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const IC_PULSE=IC('<polyline points="3 14 8 14 11 7 14 18 17 11 21 11"/>');
  const IC_ZAP=IC('<path d="M13 3 6 14h5l-1 7 7-11h-5l1-7z"/>');
  const IC_CLOCK=IC('<circle cx="12" cy="12" r="8.5"/><polyline points="12 7.5 12 12 15 14"/>');
  const IC_GAUGE=IC('<circle cx="12" cy="12" r="8.5"/><line x1="12" y1="12" x2="16.5" y2="8.5"/>');
  const TILEHEAD=(icon,label)=>`<div style="display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;border:1px solid rgba(255,255,255,0.6);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0">${icon}</div><div style="font-family:${SF};font-size:11.5px;line-height:1.3;color:#fff;text-align:left">${label}</div></div>`;
  const TILENUM=(big,unit,chart)=>`<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px"><span style="display:flex;align-items:baseline"><span style="font-family:${SF};font-size:34px;font-weight:500;letter-spacing:-0.02em;line-height:1;color:#fff">${big}</span>${unit?`<span style="font-family:${SF};font-size:11px;color:rgba(255,255,255,0.55);margin-left:3px">${unit}</span>`:''}</span>${chart||''}</div>`;
  const TILE=(c,w,dark)=>`<div style="width:${w||240}px;min-height:136px;box-sizing:border-box;background:${dark?'rgba(10,12,17,0.8)':'rgba(18,22,30,0.42)'};backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-radius:48px;corner-shape:squircle;padding:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.14);display:flex;flex-direction:column;color:#fff;text-align:left">${c}</div>`;
  const TSP='<div style="flex:1;min-height:22px"></div>';
  // week-capsule meter (main-hero logic) sized for stickers: week = 1 capsule · month = 4 capsules
  const CH_CAPS=period=>{
    // 20b · neon tick cells — same 3-level scoring as the dashboard/sheet
    const NEON='rgba(163,255,88,0.95)',SOFT='rgba(163,255,88,0.42)';
    const CHK='<svg width="60%" height="60%" viewBox="0 0 24 24" fill="none" stroke="#17181C" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    const cell=(n,sz,lbl)=>{
      const st=n>=2?'background:'+NEON+';box-shadow:0 0 7px rgba(163,255,88,0.45)'
        :n===1?'background:'+SOFT
        :'background:rgba(10,26,10,0.2);border:1px solid rgba(255,255,255,0.37)';
      return '<div style="display:flex;flex-direction:column;align-items:center;gap:3px">'
        +'<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;'+st+'">'+(n>=2?CHK:'')+'</div>'
        +(lbl?'<div style="font-size:8px;font-weight:600;color:rgba(255,255,255,0.6)">'+lbl+'</div>':'')+'</div>';
    };
    const dts=allBookings.filter(b=>b.contact_name===currentName&&b.booking_status==='Booked').map(b=>new Date(b.event_date));
    const now=new Date();
    const wkk=d=>{const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x.getTime();};
    if(period==='W'){
      const DL=['T','W','T','F','S','S'];   // Monday = studio closed, so it is not shown
      const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));mon.setHours(0,0,0,0);
      const hitDays=[];
      for(let i=1;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);
        if(dts.some(r=>r.toDateString()===d.toDateString()))hitDays.push(DL[i-1]);}
      if(!hitDays.length){
        return '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">'
          +'<span style="width:18px;height:18px;border-radius:50%;box-sizing:border-box;background:rgba(10,26,10,0.2);border:1px solid rgba(255,255,255,0.37)"></span>'

      +'<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:2px">'+out.slice(5).join('')+'</div></div>';
  };
  const CH_LINE='<svg width="52" height="26" viewBox="0 0 62 32" fill="none"><path d="M3 22 Q9 6 15 15 T27 13 T39 21 T51 8 T59 16" stroke="#fff" stroke-width="1.5" fill="none"/><circle cx="51" cy="8" r="2.6" fill="#fff"/></svg>';
  const CH_DOTS=n=>'<svg width="52" height="26" viewBox="0 0 62 30" fill="none">'+[0,1,2,3,4,5,6,7].map(i=>`<circle cx="${6+i*7.4}" cy="19" r="2.1" ${i<n?'fill="#fff"':'fill="none" stroke="#fff" stroke-width="1" opacity="0.45"'}/>`).join('')+'</svg>';
  // 16b rail — same language as the dashboard Weekly Streak tile
  // segmented streak ring for stickers (white on dark glass)
  const CH_RING=(streak)=>{
    const size=64,stroke=5.5,segs=5,gap=16;
    const r=(size-stroke)/2,cx=size/2,cy=size/2,arc=360/segs-gap,start=-90+gap/2;
    const p2=a=>({x:cx+r*Math.cos(a*Math.PI/180),y:cy+r*Math.sin(a*Math.PI/180)});
    const on=Math.min(streak||0,segs);
    let paths='';
    for(let i=0;i<segs;i++){
      const s0=start+i*(360/segs),s1=s0+arc,a=p2(s0),b=p2(s1);
      paths+='<path d="M'+a.x.toFixed(2)+','+a.y.toFixed(2)+' A'+r+','+r+' 0 0,1 '+b.x.toFixed(2)+','+b.y.toFixed(2)+'" fill="none" stroke="'+(i<on?'rgba(163,255,88,0.95)':'rgba(255,255,255,0.2)')+'" stroke-width="'+stroke+'" stroke-linecap="round"/>';
    }
    return '<div style="position:relative;width:'+size+'px;height:'+size+'px;flex-shrink:0;margin:0 auto">'
      +'<svg width="'+size+'" height="'+size+'" style="display:block">'+paths+'</svg>'
      +'<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">'
      +'<span style="font-family:'+SF+';font-size:22px;font-weight:500;letter-spacing:-0.03em;line-height:1;color:#fff">'+(streak||0)+'</span>'
      +'<span style="font-family:'+SF+';font-size:9px;font-weight:600;letter-spacing:0.08em;color:rgba(255,255,255,0.6);margin-top:2px">wks</span></div></div>';
  };
  const CH_RAIL=(dates,streakOn)=>{
    const wk=d=>{const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x.getTime();};
    const nowWk=wk(new Date());
    const v=[0,0,0,0,0,0];
    (dates||[]).forEach(d=>{const back=Math.round((nowWk-wk(d))/(7*86400000));if(back>=0&&back<6)v[5-back]++;});
    const on=Math.min(streakOn||0,6);
    let run=0;for(let i=5;i>=0&&v[i]>0;i--)run++;              // consecutive attended weeks IN VIEW
    const shown=Math.min(on,run);
    const fill=shown>0?((6-shown)/6*100):null;

/* floating segmented streak ring — 5 arcs, amber on translucent white (sticker version of the Streak pill) */
function _floatSegRingHTML(filled,size,stroke){
  const r=(size-stroke)/2, cx=size/2, cy=size/2;
  const segs=5, gap=14, step=360/segs, total=step-gap;
  // Symmetric about the vertical axis: centre the TOP segment at -90°.
  // Each segment spans `total`, so its start is centre - total/2.
  const start=-90-total/2;
  const p2=(a,rad)=>({x:cx+rad*Math.cos(a*Math.PI/180),y:cy+rad*Math.sin(a*Math.PI/180)});
  let paths='';
  for(let i=0;i<segs;i++){
    const s0=start+i*step, s1=s0+total;
    const a=p2(s0,r), b=p2(s1,r);
    const on=i<filled;
    paths+=`<path d="M${a.x.toFixed(2)},${a.y.toFixed(2)} A${r},${r} 0 0,1 ${b.x.toFixed(2)},${b.y.toFixed(2)}" fill="none" stroke="${on?'#FF9F0A':'rgba(255,255,255,0.30)'}" stroke-width="${stroke}" stroke-linecap="round"/>`;
  }
  const SF="var(--ah-font)";
  return `<div style="position:relative;width:${size}px;height:${size}px;margin:0 auto">
    <svg width="${size}" height="${size}" style="overflow:visible">${paths}</svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
      <span style="font-family:${SF};font-size:${Math.round(size*0.3)}px;font-weight:700;color:#fff;line-height:1;letter-spacing:-0.03em;text-shadow:0 1px 12px rgba(0,0,0,0.40)">${filled>=5?'5+':String(Math.min(filled,5))}</span>
      <span style="font-family:${SF};font-size:10px;font-weight:600;letter-spacing:.14em;color:rgba(255,255,255,0.72);text-shadow:0 1px 8px rgba(0,0,0,0.35)">WK</span>
    </div>
  </div>`;
}

/* mini ring (value + sub centered, no label below) — frosted/light: dark text, grey track */
function _miniRingHTML(ring,size,stroke){
  const r=(size-stroke)/2,cx=size/2,cy=size/2,total=348,start=60;
  const pt=a=>({x:cx+r*Math.cos(a*Math.PI/180),y:cy+r*Math.sin(a*Math.PI/180)});
  const arc=(s,e)=>{const a=pt(s),b=pt(e),la=Math.abs(e-s)>180?1:0;return`M${a.x.toFixed(1)},${a.y.toFixed(1)} A${r},${r} 0 ${la},1 ${b.x.toFixed(1)},${b.y.toFixed(1)}`;};
  const fe=start+total*(Math.min(ring.pct,100)/100);
  const SF="var(--ah-font)";
  return`<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">
    <svg width="${size}" height="${size}" style="overflow:visible">
      <path d="${arc(start,start+total)}" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="${stroke}" stroke-linecap="round"/>
      ${ring.pct>0.5?`<path d="${arc(start,fe)}" fill="none" stroke="${ring.color}" stroke-width="${stroke}" stroke-linecap="round"/>`:''}
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <span style="font-family:${SF};font-size:${Math.round(size*0.3)}px;font-weight:800;color:#1E1D1A;line-height:1;letter-spacing:-0.02em">${ring.val}</span>
      ${ring.sub?`<span style="font-family:${SF};font-size:${Math.round(size*0.1)}px;font-weight:600;color:#8A867E">${ring.sub}</span>`:''}
    </div>
  </div>`;
}

/* milestone ring (top label + big value + sub) — frosted/light */
function _milestoneRingHTML(ring,size,stroke){
  const r=(size-stroke)/2,cx=size/2,cy=size/2,total=348,start=60;

  const arc=(s,e)=>{const a=pt(s),b=pt(e),la=Math.abs(e-s)>180?1:0;return`M${a.x.toFixed(1)},${a.y.toFixed(1)} A${r},${r} 0 ${la},1 ${b.x.toFixed(1)},${b.y.toFixed(1)}`;};
  const fe=start+total*(Math.min(ring.pct,100)/100);
  const SF="var(--ah-font)";
  return`<div style="position:relative;width:${size}px;height:${size}px;margin:0 auto">
    <svg width="${size}" height="${size}" style="overflow:visible">
      <path d="${arc(start,start+total)}" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="${stroke}" stroke-linecap="round"/>
      ${ring.pct>0.5?`<path d="${arc(start,fe)}" fill="none" stroke="${ring.color}" stroke-width="${stroke}" stroke-linecap="round"/>`:''}
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <span style="font-family:${SF};font-size:11px;color:#8A867E;font-weight:600">${ring.topLabel||''}</span>
      <span style="font-family:${SF};font-size:${Math.round(size*0.3)}px;font-weight:800;color:#1E1D1A;line-height:1;letter-spacing:-0.02em">${ring.val}</span>
      ${ring.sub?`<span style="font-family:${SF};font-size:9px;color:${ring.color};font-weight:700">${ring.sub}</span>`:''}
    </div>
  </div>`;
}

/* ── Floating ring (Strava/WHOOP style) ──
   White value centered, colour ONLY on the stroke, soft track, text-shadow only (rings are shadow-free since v74).
   milestone=true adds top label + colored sub (for achievement layout). */
function _floatRingHTML(ring,size,stroke,milestone){
  const r=(size-stroke)/2,cx=size/2,cy=size/2,total=348,start=60;
  const pt=a=>({x:cx+r*Math.cos(a*Math.PI/180),y:cy+r*Math.sin(a*Math.PI/180)});
  const arc=(s,e)=>{const a=pt(s),b=pt(e),la=Math.abs(e-s)>180?1:0;return`M${a.x.toFixed(1)},${a.y.toFixed(1)} A${r},${r} 0 ${la},1 ${b.x.toFixed(1)},${b.y.toFixed(1)}`;};
  const fe=start+total*(Math.min(ring.pct,100)/100);

    <div style="position:relative;width:${size}px;height:${size}px">

        ${ring.pct>0.5?`<path d="${arc(start,fe)}" fill="none" stroke="${ring.color}" stroke-width="${stroke}" stroke-linecap="round"/>`:''}

/* ── Single ring HTML (new geometry: ~348°, start 4 o'clock) ── */
function makeRingHTML(ring,size,stroke,dimmed){
  const r=(size-stroke)/2;
  const cx=size/2,cy=size/2;
  const total=348,start=60; // start at 4 o'clock, sweep clockwise
  function pt(a){const rad=a*Math.PI/180;return{x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)};}
  function arc(s,e){const p1=pt(s),p2=pt(e);const la=Math.abs(e-s)>180?1:0;
    return`M${p1.x.toFixed(1)},${p1.y.toFixed(1)} A${r},${r} 0 ${la},1 ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;}
  const fillEnd=start+total*(Math.min(ring.pct,100)/100);
  const ringColor=dimmed?'rgba(255,255,255,0.28)':ring.color;
  const valFs=ring.val.length>4?Math.round(size*0.19):Math.round(size*0.26);
  const wrapOpacity=dimmed?'opacity:0.4;':'';
  return`<div style="display:flex;flex-direction:column;align-items:center;gap:4px;${wrapOpacity}">
    <div style="position:relative;width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}" style="overflow:visible">
        <path d="${arc(start,start+total)}" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="${stroke}" stroke-linecap="round"/>
        ${ring.pct>0.5?`<path d="${arc(start,fillEnd)}" fill="none" stroke="${ringColor}" stroke-width="${stroke}" stroke-linecap="round"/>`:''}
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <span style="font-family:var(--ah-font);font-size:${valFs}px;font-weight:800;color:#fff;line-height:1;letter-spacing:-0.02em">${ring.val}</span>
        ${ring.sub?`<span style="font-family:var(--ah-font);font-size:${Math.round(size*0.085)}px;font-weight:600;color:rgba(255,255,255,0.6)">${ring.sub}</span>`:''}
      </div>
    </div>
    <span style="font-family:var(--ah-font);font-size:${Math.round(size*0.1)}px;font-weight:700;color:rgba(255,255,255,0.85);letter-spacing:.1em;text-transform:uppercase;text-align:center">${ring.label}</span>
  </div>`;

/* ── Update drag position + scale ── */
function updateDragEl(){
  const el=document.getElementById('shareRingsDrag');
  el.style.left=(_ringPos.x*100)+'%';
  el.style.top=(_ringPos.y*100)+'%';
  el.style.transform=`translate(-50%,-50%) scale(${_shareScale})`;
}

/* ── Nudge card scale (+/- buttons) ── */
function nudgeShareScale(d){
  _shareScale=Math.max(0.5,Math.min(2,parseFloat((_shareScale+d).toFixed(2))));
  updateDragEl();
}

/* ── Init touch/mouse drag ── */
function initShareDrag(){
  const el=document.getElementById('shareRingsDrag');
  let sx=0,sy=0,spx=0,spy=0,dragging=false;
  let pinching=false,pinchStartDist=0,pinchStartScale=1;
  function getContainer(){return document.getElementById('shareCameraOverlay');}
  function dist(t1,t2){return Math.hypot(t1.clientX-t2.clientX,t1.clientY-t2.clientY);}
  el.addEventListener('touchstart',e=>{
    // Let the period dropdown (and any UI-only chrome) receive its tap/click:
    // calling preventDefault here would swallow the click on mobile.
    if(e.target.closest&&e.target.closest('[data-share-hide]')) return;
    e.preventDefault();
    if(e.touches.length>=2){
      pinching=true;dragging=false;
      pinchStartDist=dist(e.touches[0],e.touches[1]);
      pinchStartScale=_shareScale;
    } else {
      dragging=true;
      const t=e.touches[0];sx=t.clientX;sy=t.clientY;spx=_ringPos.x;spy=_ringPos.y;
      el.style.cursor='grabbing';
    }
    document.getElementById('shareDragHint').style.display='none';
  },{passive:false});
  el.addEventListener('touchmove',e=>{
    if(e.target.closest&&e.target.closest('[data-share-hide]')) return;
    e.preventDefault();
    if(pinching&&e.touches.length>=2){
      const r=dist(e.touches[0],e.touches[1])/pinchStartDist;
      _shareScale=Math.max(0.5,Math.min(2,pinchStartScale*r));
      updateDragEl();
      return;
    }
    if(!dragging) return;
    const t=e.touches[0];const c=getContainer();
    _ringPos.x=Math.max(0.08,Math.min(0.92,spx+(t.clientX-sx)/c.offsetWidth));
    _ringPos.y=Math.max(0.08,Math.min(0.88,spy+(t.clientY-sy)/c.offsetHeight));
    updateDragEl();
  },{passive:false});
  el.addEventListener('touchend',e=>{
    if(e.touches.length===0){dragging=false;pinching=false;el.style.cursor='grab';}
  });
  el.addEventListener('mousedown',e=>{
    if(e.target.closest&&e.target.closest('[data-share-hide]')) return;
    dragging=true;sx=e.clientX;sy=e.clientY;spx=_ringPos.x;spy=_ringPos.y;
    el.style.cursor='grabbing';
    document.getElementById('shareDragHint').style.display='none';
    const onMove=e=>{
      if(!dragging) return;const c=getContainer();
      _ringPos.x=Math.max(0.08,Math.min(0.92,spx+(e.clientX-sx)/c.offsetWidth));
      _ringPos.y=Math.max(0.08,Math.min(0.88,spy+(e.clientY-sy)/c.offsetHeight));
      updateDragEl();
    };
    const onUp=()=>{dragging=false;el.style.cursor='grab';document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);};
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });
}

/* ── Download: composite final image ── */
/* ══════════════════════════════════════════════════════════════════════
   EXPORT ENGINE v3 — html2canvas(shareCameraOverlay)
   Snapshot the ENTIRE overlay exactly as the user sees it — background,
   sticker, position, scale, fonts, SVG — in one call. No geometry math,
   no coordinate mapping, no scale mismatch. True WYSIWYG for every layout
   and every photo size.
   ══════════════════════════════════════════════════════════════════════ */

/* Superellipse corner path — same silhouette as CSS corner-shape:squircle.
   html2canvas can only draw circular arcs, so we cut the corners ourselves. */
function _sqSub(ctx,x,y,w,h,r){
  // Exact CSS corner-shape:squircle silhouette: superellipse |X/r|^4 + |Y/r|^4 = 1
  // inscribed in each r×r corner box, sampled as a polyline and walked clockwise.
  r=Math.min(r,w/2,h/2);
  const N=20;
  // arc(cx,cy,sx,sy) → points from the HORIZONTAL-edge end (t=0) to the VERTICAL-edge end
  const arc=(cx,cy,sx,sy)=>{
    const out=[];
    for(let k=0;k<=N;k++){
      const t=(k/N)*(Math.PI/2);
      out.push([cx+sx*r*Math.pow(Math.cos(t),0.5), cy+sy*r*Math.pow(Math.sin(t),0.5)]);
    }
    return out;
  };
  const TL=arc(x+r,     y+r,     -1,-1);   // [0]=left edge … [N]=top edge
  const TR=arc(x+w-r,   y+r,      1,-1);   // [0]=right edge … [N]=top edge
  const BR=arc(x+w-r,   y+h-r,    1, 1);   // [0]=right edge … [N]=bottom edge
  const BL=arc(x+r,     y+h-r,   -1, 1);   // [0]=left edge … [N]=bottom edge
  const path=[]
    .concat(TR.slice().reverse())          // top edge → right edge
    .concat(BR)                            // right edge → bottom edge
    .concat(BL.slice().reverse())          // bottom edge → left edge
    .concat(TL);                           // left edge → top edge
  ctx.moveTo(path[0][0],path[0][1]);
  for(let k=1;k<path.length;k++)ctx.lineTo(path[k][0],path[k][1]);
  ctx.closePath();
}
function _sqClip(ctx,x,y,w,h,r){ ctx.beginPath(); _sqSub(ctx,x,y,w,h,r); ctx.clip(); }
/* Erase the area inside the rect but OUTSIDE the squircle (even-odd) */
function _sqCarve(ctx,x,y,w,h,r){
  const pad=2;
  ctx.save();
  ctx.globalCompositeOperation='destination-out';
  ctx.beginPath();
  ctx.rect(x-pad,y-pad,w+pad*2,h+pad*2);
  _sqSub(ctx,x,y,w,h,r);
  ctx.fill('evenodd');
  ctx.restore();
}

/* Snapshot the whole shareCameraOverlay (what the user sees) via html2canvas.
   Scale up to 1080px wide for crisp output. Returns Promise<HTMLCanvasElement>. */
async function _captureOverlay(){
  // Capture a CLONE off-screen. The live overlay is never touched, so the user no longer
  // sees the corners flatten / chrome disappear for a frame while html2canvas works.
  const overlay=document.getElementById('shareCameraOverlay');
  const screenW=window.innerWidth, screenH=window.innerHeight;
  const outputW=1080;
  const exportScale=Math.max(2,outputW/screenW)*Math.min(window.devicePixelRatio||1,2);

  const sandbox=document.createElement('div');
  sandbox.style.cssText='position:fixed;left:-99999px;top:0;pointer-events:none;z-index:-1;overflow:hidden;'+
    'width:'+screenW+'px;height:'+screenH+'px';
  const clone=overlay.cloneNode(true);
  clone.removeAttribute('id');
  clone.style.position='absolute';clone.style.left='0';clone.style.top='0';
  clone.style.width=screenW+'px';clone.style.height=screenH+'px';
  sandbox.appendChild(clone);
  document.body.appendChild(sandbox);

  try{
    // editing chrome never belongs in the saved image
    ['shareTopBar','shareActionBar','shareSizeStepper','sharePickState','shareDragHint','shareBackBtn']
      .forEach(id=>{const el=clone.querySelector('#'+id);if(el)el.style.display='none';});
    // closed dropdowns are hidden by max-height/overflow, which html2canvas ignores
    clone.querySelectorAll('.share-dd-menu,[data-share-hide]').forEach(el=>{
      if(!el.classList.contains('open'))el.style.display='none';
    });

    const cRect=clone.getBoundingClientRect();
    const sqBoxes=[];
    clone.querySelectorAll('*').forEach(el=>{
      const cs=getComputedStyle(el);
      el.style.boxShadow='none';                     // html2canvas stamps shadows as hard rects
      const bf=cs.backdropFilter||cs.webkitBackdropFilter||'';
      if(bf&&bf!=='none'){el.style.backdropFilter='none';el.style.webkitBackdropFilter='none';}
      if((cs.cornerShape||cs.getPropertyValue('corner-shape')||'').indexOf('squircle')<0)return;
      const rad=parseFloat(cs.borderTopLeftRadius)||0;
      if(rad<=0)return;
      const r=el.getBoundingClientRect();
      if(r.width<4||r.height<4)return;
      if(parseFloat(cs.opacity)<0.05||cs.visibility!=='visible'||cs.display==='none')return;
      sqBoxes.push({x:r.left-cRect.left,y:r.top-cRect.top,w:r.width,h:r.height,rad});
      el.style.cornerShape='';
      el.style.borderRadius='0px';                   // we carve the true squircle on canvas
    });

    const opts={
      backgroundColor:'#42505E',
      scale:exportScale,
      useCORS:true,
      logging:false,
      windowWidth:screenW,
      windowHeight:screenH,
      x:0, y:0,
      width:screenW,
      height:screenH,
    };

    // Background pass, cropped to the sticker's own box — a full-screen second capture
    // was what made Save feel slow.
    let bgSnap=null, bgOx=0, bgOy=0;
    const dragC=clone.querySelector('#shareRingsDrag');
    if(sqBoxes.length&&dragC){
      const pad=10;
      let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
      sqBoxes.forEach(B=>{x0=Math.min(x0,B.x);y0=Math.min(y0,B.y);x1=Math.max(x1,B.x+B.w);y1=Math.max(y1,B.y+B.h);});
      bgOx=Math.max(0,Math.floor(x0-pad)); bgOy=Math.max(0,Math.floor(y0-pad));
      const bw=Math.min(screenW-bgOx,Math.ceil(x1-x0+pad*2)), bh=Math.min(screenH-bgOy,Math.ceil(y1-y0+pad*2));
      const prev=dragC.style.display;
      dragC.style.display='none';
      bgSnap=await html2canvas(clone,Object.assign({},opts,{x:bgOx,y:bgOy,width:bw,height:bh}));
      dragC.style.display=prev;
    }
    const raw=await html2canvas(clone,opts);

    if(sqBoxes.length&&bgSnap){
      const kk=raw.width/screenW;
      const rc=raw.getContext('2d');
      rc.setTransform(1,0,0,1,0,0);                 // html2canvas leaves its own scale on the ctx
      sqBoxes.forEach(B=>_sqCarve(rc,B.x*kk,B.y*kk,B.w*kk,B.h*kk,B.rad*kk));
      rc.save();
      rc.globalCompositeOperation='destination-over';
      rc.drawImage(bgSnap,bgOx*kk,bgOy*kk);
      rc.restore();
    }
    return raw;
  } finally {
    document.body.removeChild(sandbox);
  }
}

async function _composeShareCanvas(){
  if(!window._shareMetrics) return null;
  if(_shareImg){
    // ── Photo mode ──
    // IMPORTANT: read all rects BEFORE any await, so the live DOM position
    // is captured at the moment the user pressed Save — not after async work
    // which might happen after a re-render or second save attempt.
    const drag=document.getElementById('shareRingsDrag');
    const onscreen=document.getElementById('shareCanvas');
    // Use the CANVAS element's own rect (not the overlay) as the reference box.
    // The canvas is where the photo actually renders (object-fit:contain inside
    // it), so mapping the sticker relative to the canvas rect is exact regardless
    // of any top/action bars that offset the overlay.
    const cRect=onscreen.getBoundingClientRect(); // snapshot NOW before any await
    const dRect=drag.getBoundingClientRect();     // snapshot NOW before any await
    const captureScale=Math.max(3, window.devicePixelRatio||1);

    const W=onscreen.width, H=onscreen.height;
    const out=document.createElement('canvas');
    out.width=W; out.height=H;
    const ctx=out.getContext('2d');

    // 1) Draw photo background (cover-fit)
    const sc2=Math.max(W/_shareImg.width,H/_shareImg.height);
    const dw=_shareImg.width*sc2, dh=_shareImg.height*sc2;
    ctx.drawImage(_shareImg,(W-dw)/2,(H-dh)/2,dw,dh);

    // 2) Snapshot sticker at full device resolution.
    // html2canvas reads the element's raw LAYOUT box (offsetWidth/Height), which
    // ignores any pinch-zoom transform:scale on the drag wrapper. We need an
    // unscaled (scale 1) capture, then we scale it to dRect when drawing.
    //
    // To avoid the visible "pop" of momentarily resetting scale on the LIVE
    // sticker (which the user sees flash big for ~0.5s while html2canvas works),
    // we clone the sticker into an off-screen sandbox, neutralise the transform
    // there, and capture the CLONE. The on-screen sticker never moves, so the
    // Save feels smooth — no flicker, no jump.
    const glassLayers=[];   // filled from the CLONE below (same space as the snapshot)
    const sqCorners=[];     // squircle boxes to carve out of the snapshot
    const sandbox=document.createElement('div');
    sandbox.style.cssText='position:fixed;left:-99999px;top:0;'+
      'pointer-events:none;opacity:1;z-index:-1';
    const clone=drag.cloneNode(true);
    // Strip the centring translate + pinch scale; capture at natural 1x layout.
    clone.style.position='static';
    clone.style.left='auto';
    clone.style.top='auto';
    clone.style.transform='none';
    sandbox.appendChild(clone);
    document.body.appendChild(sandbox);
    // html2canvas can't rasterise backdrop-filter / corner-shape and ends up
    // repainting the blurred box per stacking context → the tiled "overlapping
    // squares" seen in saved stickers. Strip both on the CLONE only (the live
    // sticker keeps its glass look) and compensate with a slightly denser fill.
    clone.style.boxShadow='none';
    const _cloneRect=clone.getBoundingClientRect();
    clone.querySelectorAll('*').forEach(el=>{
      const cs=getComputedStyle(el);
      el.style.boxShadow='none';
      const bf=cs.backdropFilter||cs.webkitBackdropFilter||'';
      // frosted glass: html2canvas can't do backdrop-filter, so record each glass box
      // (as a FRACTION of the clone — the exact space the snapshot is drawn into) and
      // blur the photo ourselves under it on the output canvas.
      if(bf&&bf!=='none'&&_cloneRect.width>1){
        const vis=parseFloat(cs.opacity)>=0.05&&cs.visibility==='visible'&&cs.display!=='none'
          &&!el.closest('[data-share-hide]')&&!el.classList.contains('share-dd-menu');
        const r=el.getBoundingClientRect();
        if(vis&&r.width>2&&r.height>2){
          const bm=/blur\(([\d.]+)px\)/.exec(bf);
          glassLayers.push({
            fx:(r.left-_cloneRect.left)/_cloneRect.width,
            fy:(r.top-_cloneRect.top)/_cloneRect.height,
            fw:r.width/_cloneRect.width,
            fh:r.height/_cloneRect.height,
            frad:((parseFloat(cs.borderTopLeftRadius)||0)*0.85)/_cloneRect.width,
            fblur:(bm?parseFloat(bm[1]):14)/_cloneRect.width
          });
        }
      }
      el.style.backdropFilter='none';
      el.style.webkitBackdropFilter='none';
      // A squircle reads visually FLATTER than a circular arc of the same radius.
      // html2canvas only draws circular arcs, so shrink the radius to match the
      // preview instead of exporting a rounder blob.
      const _sq=(cs.cornerShape||cs.getPropertyValue('corner-shape')||'').indexOf('squircle')>=0;
      el.style.cornerShape='';
      const _rad=parseFloat(cs.borderTopLeftRadius)||0;
      if(_sq&&_rad>0&&_cloneRect.width>1){
        const rr=el.getBoundingClientRect();
        if(rr.width>4&&rr.height>4){
          sqCorners.push({
            fx:(rr.left-_cloneRect.left)/_cloneRect.width,
            fy:(rr.top-_cloneRect.top)/_cloneRect.height,
            fw:rr.width/_cloneRect.width,
            fh:rr.height/_cloneRect.height,
            frad:_rad/_cloneRect.width
          });
          el.style.borderRadius='0px';   // carved as a true squircle on the canvas
        }
      }
      el.style.boxShadow='none';   // html2canvas can't blur shadows: it stamps hard offset rects → the "double edge" artifact

    });
    void clone.offsetWidth; // force layout of the clone before capture
    let stickerSnap;
    try{
      stickerSnap=await html2canvas(clone,{
        backgroundColor:null,
        scale:captureScale,
        useCORS:true,
        logging:false,
        width:clone.offsetWidth,
        height:clone.offsetHeight,
      });
    } finally {
      document.body.removeChild(sandbox); // always clean up, even on error
    }

    // 3) Map sticker position → output canvas coords
    // The on-screen shareCanvas uses object-fit:contain, so the photo bitmap
    // (W×H) is letterboxed inside the overlay rect. We must map the sticker
    // relative to the CONTAIN rect (where the photo actually shows), not the
    // full overlay — otherwise the sticker drifts off-centre on tall photos.
    const imgAspect=W/H;
    const canvasAspect=cRect.width/cRect.height;
    let shownW, shownH, shownLeft, shownTop;
    if(imgAspect > canvasAspect){
      // photo limited by width → letterbox top/bottom
      shownW=cRect.width;
      shownH=cRect.width/imgAspect;
      shownLeft=cRect.left;
      shownTop=cRect.top+(cRect.height-shownH)/2;
    } else {
      // photo limited by height → letterbox left/right
      shownH=cRect.height;
      shownW=cRect.height*imgAspect;
      shownTop=cRect.top;
      shownLeft=cRect.left+(cRect.width-shownW)/2;
    }
    // ratio: output canvas pixels per CSS pixel of the SHOWN photo area
    const ratio=W/shownW;
    const cx=((dRect.left+dRect.width/2)-shownLeft)*ratio;
    const cy=((dRect.top+dRect.height/2)-shownTop)*ratio;
    // Size the sticker from the ON-SCREEN rect (dRect) — both width AND height.
    // dRect already reflects the user's pinch-zoom, and the snapshot was taken at
    // scale(1) of the SAME element, so snapshot-aspect == dRect-aspect exactly.
    // Using dRect for both axes keeps position AND size matching the preview 1:1.
    const sw=dRect.width*ratio;
    const sh=dRect.height*ratio;
    ctx.imageSmoothingEnabled=true;
    ctx.imageSmoothingQuality='high';
    // frosted pass: blur the photo inside each glass box (fractions of the drawn sticker)
    const originX=cx-sw/2, originY=cy-sh/2;
    glassLayers.forEach(L=>{
      const x=originX+L.fx*sw, y=originY+L.fy*sh;
      const w=L.fw*sw, h=L.fh*sh, rad=Math.min(L.frad*sw,Math.min(w,h)/2);
      ctx.save();
      _sqClip(ctx,x,y,w,h,rad);
      ctx.filter='blur('+Math.max(2,L.fblur*sw).toFixed(1)+'px) saturate(1.3)';
      ctx.drawImage(_shareImg,(W-dw)/2,(H-dh)/2,dw,dh);
      ctx.filter='none';
      ctx.restore();
    });
    if(sqCorners.length){
      // carve the exact squircle silhouette out of the sticker before compositing
      const tmp=document.createElement('canvas');
      tmp.width=Math.max(1,Math.round(sw)); tmp.height=Math.max(1,Math.round(sh));
      const tc=tmp.getContext('2d');
      tc.setTransform(1,0,0,1,0,0);
      tc.imageSmoothingEnabled=true; tc.imageSmoothingQuality='high';
      tc.drawImage(stickerSnap,0,0,tmp.width,tmp.height);
      sqCorners.forEach(S=>_sqCarve(tc,S.fx*tmp.width,S.fy*tmp.height,S.fw*tmp.width,S.fh*tmp.height,S.frad*tmp.width));
      ctx.drawImage(tmp, originX, originY, sw, sh);
    } else {
      ctx.drawImage(stickerSnap, cx-sw/2, cy-sh/2, sw, sh);
    }
    return out;
  } else {
    // Gradient mode: one call captures everything
    return await _captureOverlay();
  }
}

function _shareStamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());}
/* Hand a rendered canvas to the OS.
   1 · Web Share (files) — the only path that reaches the camera roll inside LINE/IG browsers
   2 · <a download> with a Blob URL — normal browsers
   3 · full-screen preview + "press and hold to save" — last resort, never a silent failure */
async function _deliverImage(canvas,filename,mime,quality){
  const blob=await new Promise(res=>canvas.toBlob(res,mime,quality));
  if(!blob){ _glassToast('Could not render the image'); return; }
  const file=new File([blob],filename,{type:mime});

  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); _glassToast('Shared'); return; }
    catch(err){ if(err&&err.name==='AbortError') return; }   // user cancelled: stay quiet
  }

  const inApp=(()=>{ try{ return (typeof liff!=='undefined'&&liff.isInClient&&liff.isInClient())
    || /\bLine\/|FBAN|FBAV|Instagram/i.test(navigator.userAgent||''); }catch(e){ return false; } })();

  if(!inApp&&'download' in document.createElement('a')){
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=filename; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),20000);
    _glassToast('Saved to your photos');
    return;
  }
  // last resort: long-press only saves from a data: URL, never from blob:
  _showSavePreview(canvas.toDataURL(mime,quality),filename);
}

/* Full-screen preview for in-app browsers that block downloads. */

/* ── one-tap save ─────────────────────────────────────────────────────────────
   A file is rendered in the background whenever the sticker changes, so the Save
   tap can hand it straight to the OS share sheet inside the same user gesture. */
let _shareFile={sig:null,file:null,busy:false};
function _shareSig(){
  const drag=document.getElementById('shareRingsDrag');
  return [_shareLayout,_sharePeriod,window._shareCardType,window._shareHL,
          _shareImg?1:0, drag?drag.style.transform:'', drag?drag.offsetWidth:0].join('|');
}
async function _prewarmShareFile(){
  if(_shareFile.busy||!window._shareMetrics) return;
  const sig=_shareSig();
  if(_shareFile.sig===sig&&_shareFile.file) return;
  _shareFile.busy=true;
  try{
    const canvas=await _composeShareCanvas();
    if(canvas){
      const png=!_shareImg;
      const blob=await new Promise(r=>canvas.toBlob(r,png?'image/png':'image/jpeg',png?undefined:0.96));
      if(blob) _shareFile={sig,busy:false,
        file:new File([blob],`pilar-${_shareStamp()}.${png?'png':'jpg'}`,{type:blob.type})};
    }
  }catch(e){ console.warn('prewarm failed:',e&&e.message); }
  _shareFile.busy=false;
}
function _hookSharePrewarm(){
  const d=document.getElementById('shareRingsDrag');
  if(!d) return;
  const kick=()=>{clearTimeout(_hookSharePrewarm._t);
    _hookSharePrewarm._t=setTimeout(()=>{_prewarmShareFile();_prewarmStickerFile();},400);};
  if(!d.dataset.prewarmHooked){
    d.dataset.prewarmHooked='1';
    new MutationObserver(kick).observe(d,{subtree:true,childList:true,attributes:true});
  }
  kick();
}

/* NOTE: not async — awaiting anything before share() loses the user gesture on iOS/LINE. */
function downloadShare(){
  if(!window._shareMetrics) return;
  const f=_shareFile.file;
  if(f&&navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]}))){
    navigator.share({files:[f]})
      .then(()=>_glassToast('Saved'))
      .catch(err=>{ if(!err||err.name!=='AbortError') _slowSaveFallback(); });
    return;
  }
  _slowSaveFallback();
}
/* Cold cache: the gesture is already gone, so skip share() (it would silently no-op in
   LINE) and open the long-press preview, which works everywhere. */
async function _slowSaveFallback(){
  const canvas=await _composeShareCanvas();
  if(!canvas) return;
  const png=!_shareImg;
  _showSavePreview(canvas.toDataURL(png?'image/png':'image/jpeg',png?undefined:0.96),
                   `pilar-${_shareStamp()}.${png?'png':'jpg'}`);
}

/* paint the aurora gradient onto a canvas (story export when no photo) */
function _paintAuroraCanvas(ctx,W,H){
  ctx.fillStyle='#42505E';
  ctx.fillRect(0,0,W,H);
  const blobs=[
    [0.24*W,0.30*H,0.58*W,'#8FA6BC'],
    [0.84*W,0.74*H,0.46*W,'#E07B34'],
    [0.56*W,0.88*H,0.50*W,'#1A222C'],
    [0.46*W,0.22*H,0.48*W,'#9d8ef5']
  ];
  ctx.globalAlpha=0.92;
  blobs.forEach(([x,y,r,col])=>{
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,col);
    g.addColorStop(1,'rgba(14,14,20,0)');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
  });
  ctx.globalAlpha=1;
}

/* ── Native share — Web Share API (files) with LIFF + download fallback ── */
async function shareNative(){
  if(!window._shareMetrics) return;
  const canvas=await _composeShareCanvas();
  if(!canvas) return;
  const _png=!_shareImg;                       // gradient art → PNG, photo → high-quality JPEG
  const _mime=_png?'image/png':'image/jpeg';
  const fname=`pilar-${_shareStamp()}.${_png?'png':'jpg'}`;
  // Preferred: Web Share API Level 2 (shares the actual image file)
  try{
    const blob=await new Promise(res=>_png?canvas.toBlob(res,'image/png'):canvas.toBlob(res,'image/jpeg',0.96));
    if(blob){
      const file=new File([blob],fname,{type:_mime});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:'Pilar'});
        return;
      }
    }
  }catch(e){ if(e&&e.name==='AbortError') return; /* user cancelled */ }
  // Fallback 1: LIFF share picker (text/link — image not supported, so send a note)
  try{
    if(window.liff&&liff.isApiAvailable&&liff.isApiAvailable('shareTargetPicker')){
      await liff.shareTargetPicker([{type:'text',text:'ดูสถิติ Pilar ของฉัน (บันทึกรูปแล้วแชร์ได้เลย)'}]);
      downloadShare();
      return;
    }
  }catch(e){}
  // Fallback 2: just download
  downloadShare();
}

/* ── Mirror the live preview overlay onto the canvas (download + sticker) ──
   Instead of re-deriving fonts/positions with fractions (which never matched the
   preview), we read the actual rendered DOM (#shareRingsInner) and replay each
   text node + ring SVG onto the canvas at the same relative geometry, scaled by
   k = targetWidth / previewBoxWidth. What you see in the preview is exactly what
   gets exported, for every layout. */


/* ── Download sticker: transparent PNG, no background ── */
function mirrorPreviewToCanvas(ctx,cx,cy,targetW,isSticker){
  const inner=document.getElementById('shareRingsInner');
  if(!inner) return;
  const box=inner.getBoundingClientRect();
  if(!box.width){return;}
  // Fit the whole preview inside the target box on BOTH axes. The preview is a tall
  // column (ring + headline + sub + wordmark); scaling by width alone lets the top and
  // bottom overflow and overlap. For stickers (square canvas) we also bound by height.
  let k=targetW/box.width;
  if(isSticker && box.height>0){
    const targetH=targetW;                 // sticker canvas is square; keep content within
    k=Math.min(targetW/box.width, targetH/box.height);
  }
  const boxCX=box.left+box.width/2, boxCY=box.top+box.height/2;
  // map a screen point to canvas coords (box centre → cx,cy)
  const mapX=sx=>cx+(sx-boxCX)*k;
  const mapY=sy=>cy+(sy-boxCY)*k;

  // 0) Highlight/Wrapped card: paint the card's own gradient (and soft glow blob)
  //    as a rounded-rect filling the mapped card box. The text walk below skips
  //    backgrounds, so without this the exported PNG would be transparent.
  const _hlgrad=inner.getAttribute&&inner.getAttribute('data-hlgrad');
  if(_hlgrad){
    const x=mapX(box.left), y=mapY(box.top), w=box.width*k, h=box.height*k;
    const rad=(parseFloat(getComputedStyle(inner).borderTopLeftRadius)||24)*k;
    // parse "linear-gradient(155deg, #.. 0%, #.. 55%, #.. 100%)" → angle + stops
    const cols=_hlgrad.match(/rgba?\([^)]*\)|#[0-9a-fA-F]{3,8}\b/g)||[];
    const angM=/(-?[\d.]+)deg/.exec(_hlgrad);
    const ang=(angM?parseFloat(angM[1]):155)*Math.PI/180;
    // gradient vector across the box for the given angle
    const cxb=x+w/2, cyb=y+h/2, len=(Math.abs(Math.sin(ang))*w+Math.abs(Math.cos(ang))*h)/2;
    const gx0=cxb-Math.sin(ang)*len, gy0=cyb+Math.cos(ang)*len;
    const gx1=cxb+Math.sin(ang)*len, gy1=cyb-Math.cos(ang)*len;
    ctx.save();
    ctx.beginPath();
    if(ctx.roundRect){ ctx.roundRect(x,y,w,h,rad); }
    else { ctx.moveTo(x+rad,y);ctx.arcTo(x+w,y,x+w,y+h,rad);ctx.arcTo(x+w,y+h,x,y+h,rad);ctx.arcTo(x,y+h,x,y,rad);ctx.arcTo(x,y,x+w,y,rad); }
    ctx.closePath();
    ctx.clip();
    if(cols.length>=2){
      const g=ctx.createLinearGradient(gx0,gy0,gx1,gy1);
      cols.forEach((c,i)=>g.addColorStop(i/(cols.length-1),c));
      ctx.fillStyle=g;
    } else { ctx.fillStyle=cols[0]||'#3E5C7A'; }
    ctx.fillRect(x,y,w,h);
    // soft white glow blob, top-right (mirrors .wr-slide::before)
    const gr=ctx.createRadialGradient(x+w*0.9,y+h*0.02,0, x+w*0.9,y+h*0.02, w*0.62);
    gr.addColorStop(0,'rgba(255,255,255,0.16)'); gr.addColorStop(0.68,'rgba(255,255,255,0)');
    ctx.fillStyle=gr; ctx.fillRect(x,y,w,h);
    ctx.restore();
  }

  // soft shadow for legibility on photos (skip for transparent sticker → crisp outline)
  // Same soft shadow for BOTH sticker and photo/gradient export, so the sticker
  // matches the on-screen preview (which always uses a soft text-shadow).
  function applyShadow(){ ctx.shadowColor='rgba(0,0,0,0.42)';ctx.shadowBlur=14*k;ctx.shadowOffsetX=0;ctx.shadowOffsetY=1*k; }

  // 1) draw the ring SVG(s) by reading their geometry from the DOM.
  //    Each preview path is "M x,y A r,r 0 la,sweep x2,y2"; we read the SVG's own
  //    viewBox coords, convert the M/end points to angles about the ring centre, and
  //    redraw that exact arc on the canvas — so partial fills mirror precisely.
  inner.querySelectorAll('svg').forEach(svg=>{
    // The SVG has overflow:visible, so its own getBoundingClientRect() can differ
    // from the ring's layout box — using it tilts/offsets the arc. Use the SVG's
    // layout box from its width/height attrs, anchored at the parent wrapper,
    // to recover the true ring centre.
    const sr=svg.getBoundingClientRect();
    const svgSize=svg.width.baseVal.value||sr.width;     // svg's internal coordinate size
    // The parent wrapper div is sized exactly to the ring box (no shadow, no overflow),
    // so it gives the true centre. Anchor everything to it.
    const host=svg.parentElement;
    const hr=host?host.getBoundingClientRect():sr;
    const ringScreen=Math.min(hr.width,hr.height)||sr.width;
    const rcx=mapX(hr.left+hr.width/2), rcy=mapY(hr.top+hr.height/2);
    const scaleToCanvas=(ringScreen*k)/svgSize;          // svg-unit → canvas-px
    const sCenter=svgSize/2;                              // svg arcs are centred at size/2
    svg.querySelectorAll('path').forEach(p=>{
      const stroke=(parseFloat(getComputedStyle(p).strokeWidth)||6)*scaleToCanvas;
      const col=p.getAttribute('stroke')||'#fff';
      const d=p.getAttribute('d')||'';
      // parse: M sx,sy A r,r 0 la,sw ex,ey
      const m=d.match(/M\s*([-\d.]+)[,\s]+([-\d.]+).*?A\s*([-\d.]+)[,\s]+[-\d.]+\s+[-\d.]+\s+([01])[,\s]+([01])[,\s]+([-\d.]+)[,\s]+([-\d.]+)/i);
      if(!m){return;}
      const sx=+m[1],sy=+m[2], rr=+m[3], ex=+m[6],ey=+m[7];
      const r=rr*scaleToCanvas;
      let a0=Math.atan2(sy-sCenter,sx-sCenter);
      let a1=Math.atan2(ey-sCenter,ex-sCenter);
      // ensure clockwise sweep matching the preview (start 60°, +348°)
      if(a1<a0) a1+=Math.PI*2;
      ctx.save();
      ctx.beginPath();
      ctx.arc(rcx,rcy,r,a0,a1);
      ctx.strokeStyle=col; ctx.lineWidth=stroke; ctx.lineCap='round';
      // v74: NO ring shadow — rings are shadow-free everywhere (preview + save +
      // sticker). The old drop-shadow got square-clipped by html2canvas's SVG
      // rasterisation and produced a dark box frame around the ring in exports.
      ctx.stroke();
      ctx.restore();
    });
  });

  // 1b) draw solid/gradient BARS (bead chain + prime-time zone bars).
  //     These are <div>s with a background + border-radius and NO text inside,
  //     so the text walk below skips them and they vanished from the export.
  //     This pass is purely additive: it only paints short coloured bars and
  //     never touches the ring (svg) or text drawing.
  const _parseLinear=(img)=>{
    // returns array of colour strings for a `linear-gradient(...)`, or null.
    // Note: the gradient string contains nested parens (rgb(...)), so a naive
    // \([^)]*\) capture truncates at the first inner ")". Instead we confirm it's
    // a gradient, then pull every colour token from the whole string directly.
    if(!/linear-gradient/i.test(img||'')) return null;
    const cols=img.match(/rgba?\([^)]*\)|#[0-9a-fA-F]{3,8}\b/g);
    if(!cols||cols.length<2) return null;
    return cols;
  };
  const drawBars=node=>{
    node.childNodes.forEach(n=>{
      if(n.nodeType!==1) return;
      const tag=n.tagName;
      if(tag==='SVG'||tag==='svg'){ return; }
      // does this element contain any visible text? if so it's not a bare bar.
      const hasText=(n.textContent||'').trim().length>0;
      if(hasText){ drawBars(n); return; } // recurse into text-bearing wrappers
      // if it has element children, it's a container (e.g. the flex bead row) —
      // recurse into it and paint the leaves, never the container itself.
      if(n.children && n.children.length){ drawBars(n); return; }
      const cs=getComputedStyle(n);
      const r=n.getBoundingClientRect();
      if(r.width<1||r.height<1){ return; }
      // only short bars/beads — guards against painting a large container box
      if(r.height>24){ return; }
      const bg=cs.backgroundColor||'';
      const bgImg=cs.backgroundImage||'';
      const grad=_parseLinear(n.style.backgroundImage||bgImg);
      const isSolid=bg && bg!=='transparent' && !/rgba?\([^)]*,\s*0\s*\)/.test(bg);
      if(!grad && !isSolid){ return; }
      // geometry on canvas
      const x=mapX(r.left), y=mapY(r.top), w=r.width*k, h=r.height*k;
      const rad=Math.min(h/2,(parseFloat(cs.borderTopLeftRadius)||h/2)*k);
      // glow: mirror the div's box-shadow (e.g. amber bead glow) so it pops like preview
      const shadow=cs.boxShadow||'';
      const sm=/(rgba?\([^)]*\)|#[0-9a-f]+)\s+[-\d.]+px\s+[-\d.]+px\s+([-\d.]+)px/i.exec(shadow);
      ctx.save();
      if(sm){ ctx.shadowColor=sm[1]; ctx.shadowBlur=(parseFloat(sm[2])||0)*k; ctx.shadowOffsetX=0; ctx.shadowOffsetY=0; }
      // fill style
      if(grad){
        const g=ctx.createLinearGradient(x,y,x+w,y); // 90deg = left→right
        grad.forEach((c,i)=>g.addColorStop(grad.length===1?0:i/(grad.length-1),c));
        ctx.fillStyle=g;
      } else { ctx.fillStyle=bg; }
      ctx.beginPath();
      if(ctx.roundRect){ ctx.roundRect(x,y,w,h,rad); }
      else { // fallback rounded rect
        ctx.moveTo(x+rad,y);
        ctx.arcTo(x+w,y,x+w,y+h,rad); ctx.arcTo(x+w,y+h,x,y+h,rad);
        ctx.arcTo(x,y+h,x,y,rad); ctx.arcTo(x,y,x+w,y,rad);
      }
      ctx.fill();
      ctx.restore();
    });
  };
  drawBars(inner);
  ctx.shadowColor='rgba(0,0,0,0)';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;

  // 2) draw every text node at its rendered position/size/colour
  ctx.textBaseline='alphabetic';
  const walk=node=>{
    node.childNodes.forEach(n=>{
      if(n.nodeType===3){ // text node
        const txt=n.textContent.trim();
        if(!txt) return;
        const range=document.createRange(); range.selectNodeContents(n);
        // Use per-line rects so wrapped headlines mirror line-by-line instead of
        // collapsing to one baseline (which caused overlap on long text).
        const rects=Array.from(range.getClientRects()).filter(r=>r.width>0.5);
        if(!rects.length) return;
        const cs=getComputedStyle(n.parentElement);
        const fs=parseFloat(cs.fontSize)*k;
        const fw=cs.fontWeight||'400';
        const ls=parseFloat(cs.letterSpacing)||0;
        // Match the DOM's --ah-font stack exactly so glyph shapes are identical
        // between the live preview and the exported sticker.
        ctx.font=`${fw} ${fs}px -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Roboto",system-ui,sans-serif`;
        ctx.fillStyle=cs.color;
        // Sticker must match the on-screen preview exactly: use the same soft shadow
        // as the photo/gradient path (NOT a heavy outline, which made glyphs look bold).
        applyShadow();
        // Draw each visual line CENTER-anchored on the rect's horizontal midpoint.
        // The preview centres all sticker text, so anchoring to the centre (not the
        // left edge) avoids drift from rect-left rounding and asymmetric stroke.
        const drawLine=(lineTxt,R)=>{
          if(!lineTxt) return;
          const baseY=mapY(R.top)+fs*0.80;
          const cxLine=mapX(R.left+R.width/2);
          if(ls){
            // measure total advance incl. letter-spacing, then start from centre - half
            let total=0; for(const ch of lineTxt) total+=ctx.measureText(ch).width+ls*k;
            total-=ls*k; // no trailing space after last glyph
            ctx.textAlign='left';
            let penX=cxLine-total/2;
            for(const ch of lineTxt){
              ctx.fillText(ch,penX,baseY);
              penX+=ctx.measureText(ch).width+ls*k;
            }
          } else {
            ctx.textAlign='center';
            ctx.fillText(lineTxt,cxLine,baseY);
          }
        };
        // Fast path: single-line text (the common case)
        if(rects.length===1){
          drawLine(txt,rects[0]);
          return;
        }
        // Multi-line: recover each visual line's substring by char-to-line matching.
        const fullLen=n.textContent.length;
        const lineFor=[];
        for(let i=0;i<fullLen;i++){
          const r2=document.createRange(); r2.setStart(n,i); r2.setEnd(n,i+1);
          const cr=r2.getClientRects()[0]; if(!cr) continue;
          const mid=cr.top+cr.height/2;
          let li=rects.findIndex(R=>mid>=R.top-1 && mid<=R.bottom+1);
          if(li<0) li=0;
          (lineFor[li]=lineFor[li]||[]).push(n.textContent[i]);
        }
        rects.forEach((R,li)=>{
          drawLine((lineFor[li]||[]).join('').trim(),R);
        });
      } else if(n.nodeType===1 && n.tagName!=='SVG' && n.tagName!=='svg'){
        if(n.getAttribute&&n.getAttribute('data-share-hide')) return; // skip UI-only chrome (period dropdown)
        walk(n);
      }
    });
  };
  walk(inner);
  ctx.shadowColor='rgba(0,0,0,0)';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
}

async function _renderStickerCanvas(){
  if(!window._shareMetrics) return;
  // The old exporter hand-painted text onto a canvas, so the glass card behind it never
  // came along. Capture the real sticker DOM instead (off-screen clone → html2canvas),
  // then carve the squircle corners, on a transparent 800×800 canvas.
  const drag=document.getElementById('shareRingsDrag');
  if(!drag) return;

  const sandbox=document.createElement('div');
  sandbox.style.cssText='position:fixed;left:-99999px;top:0;pointer-events:none;z-index:-1';
  const clone=drag.cloneNode(true);
  clone.removeAttribute('id');
  clone.style.position='static';clone.style.left='auto';clone.style.top='auto';clone.style.transform='none';
  sandbox.appendChild(clone);
  document.body.appendChild(sandbox);

  try{
    ['shareDragHint'].forEach(id=>{const el=clone.querySelector('#'+id);if(el)el.style.display='none';});
    clone.querySelectorAll('.share-dd-menu,[data-share-hide]').forEach(el=>{
      if(!el.classList.contains('open'))el.style.display='none';
    });
    const cRect=clone.getBoundingClientRect();
    const sqBoxes=[];
    clone.style.boxShadow='none';
    clone.querySelectorAll('*').forEach(el=>{
      const cs=getComputedStyle(el);
      el.style.boxShadow='none';
      const bf=cs.backdropFilter||cs.webkitBackdropFilter||'';
      if(bf&&bf!=='none'){
        el.style.backdropFilter='none';el.style.webkitBackdropFilter='none';
        // no photo behind a transparent sticker → make the glass fill readable on its own
        const mm=/rgba?\(([^)]+)\)/.exec(cs.backgroundColor||'');
        if(mm){
          const p=mm[1].split(',').map(v=>parseFloat(v));
          const a0=(p[3]===undefined?1:p[3]);
          if(a0>=0.03)el.style.background='rgba('+(p[0]|0)+','+(p[1]|0)+','+(p[2]|0)+','+Math.min(1,a0+0.32).toFixed(2)+')';
        }
      }
      if((cs.cornerShape||cs.getPropertyValue('corner-shape')||'').indexOf('squircle')<0)return;
      const rad=parseFloat(cs.borderTopLeftRadius)||0;
      if(rad<=0)return;
      const r=el.getBoundingClientRect();
      if(r.width<4||r.height<4)return;
      sqBoxes.push({fx:(r.left-cRect.left)/cRect.width,fy:(r.top-cRect.top)/cRect.height,
                    fw:r.width/cRect.width,fh:r.height/cRect.height,frad:rad/cRect.width});
      el.style.cornerShape='';
      el.style.borderRadius='0px';
    });
    void clone.offsetWidth;

    const snap=await html2canvas(clone,{
      backgroundColor:null,
      scale:4,
      useCORS:true,
      logging:false,
      width:clone.offsetWidth,
      height:clone.offsetHeight,
    });

    const S=1600;
    const out=document.createElement('canvas');
    out.width=S; out.height=S;
    const ctx=out.getContext('2d');
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';

    const targetW=S*0.94;   // less dead margin — more real pixels for the card
    const targetH=targetW*(cRect.height/cRect.width);
    const tmp=document.createElement('canvas');
    tmp.width=Math.max(1,Math.round(targetW)); tmp.height=Math.max(1,Math.round(targetH));
    const tc=tmp.getContext('2d');
    tc.setTransform(1,0,0,1,0,0);
    tc.imageSmoothingEnabled=true; tc.imageSmoothingQuality='high';
    tc.drawImage(snap,0,0,tmp.width,tmp.height);
    sqBoxes.forEach(B=>_sqCarve(tc,B.fx*tmp.width,B.fy*tmp.height,B.fw*tmp.width,B.fh*tmp.height,B.frad*tmp.width));
    ctx.drawImage(tmp,(S-targetW)/2,(S-targetH)/2,targetW,targetH);

    return out;
  } finally {
    document.body.removeChild(sandbox);
  }
}

/* ── Draw single ring on canvas (new geometry: ~348°, start 4 o'clock) ── */
function drawCanvasRing(ctx,cx,cy,r,stroke,pct,color,val,label,sub,W,dimmed){
  const totalAngle=348*(Math.PI/180);
  const startAngle=60*(Math.PI/180); // 4 o'clock
  const clamp=Math.min(Math.max(pct,0),1);
  const drawColor=dimmed?'rgba(255,255,255,0.28)':color;
  const prevAlpha=ctx.globalAlpha;
  if(dimmed) ctx.globalAlpha=0.4;

  // bg arc
  ctx.beginPath();
  ctx.arc(cx,cy,r,startAngle,startAngle+totalAngle);
  ctx.strokeStyle='rgba(255,255,255,0.18)';
  ctx.lineWidth=stroke;
  ctx.lineCap='round';
  ctx.stroke();

  // fill arc
  if(clamp>0.01){
    const fillEnd=startAngle+totalAngle*clamp;
    ctx.beginPath();
    ctx.arc(cx,cy,r,startAngle,fillEnd);
    ctx.strokeStyle=drawColor;
    ctx.lineWidth=stroke;
    ctx.lineCap='round';
    ctx.stroke();
  }

  // value (centered) + sub under it + label below ring
  const valFs=Math.round(r*0.62);
  const subFs=Math.round(r*0.2);
  const labelFs=Math.round(r*0.22);
  const SF='-apple-system,"SF Pro Display","Helvetica Neue",Roboto,sans-serif';

  ctx.textAlign='center';
  ctx.font=`800 ${valFs}px ${SF}`;
  ctx.fillStyle='#fff';
  ctx.fillText(val,cx,cy+valFs*0.18);

  if(sub){
    ctx.font=`600 ${subFs}px ${SF}`;
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.fillText(sub,cx,cy+valFs*0.18+subFs*1.5);
  }

  // label below ring
  ctx.font=`700 ${labelFs}px ${SF}`;
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.fillText(label,cx,cy+r+stroke*0.5+labelFs*1.5);

  ctx.globalAlpha=prevAlpha;
}

function calcStreak(name){
  const all=allBookings.filter(b=>b.contact_name===name && b.booking_status==='Booked');
  // Monday-anchored week key (matches _weekKey / _longestStreak)
  const wkKey=d=>{const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x.getTime();};
  const weekSet=new Set();
  all.forEach(s=>{
    const d=new Date(s.event_date);
    if(!isNaN(d)) weekSet.add(wkKey(d));
  });
  const weeks=[...weekSet].sort((a,b)=>b-a); // newest first, ms timestamps
  if(!weeks.length) return 0;
  const WK=86400000*7;
  let streak=1;
  for(let i=0;i<weeks.length-1;i++){
    if(Math.round((weeks[i]-weeks[i+1])/WK)===1) streak++;
    else break;
  }
  // Check if current week (Monday-anchored) has any sessions
  const thisWk=wkKey(new Date());
  const hasThisWeek=weeks.includes(thisWk);
  if(!hasThisWeek){
    // grace: streak still valid only if last week had a session
    const lastWk=thisWk-WK;
    if(!weeks.includes(lastWk)) return 0;
  }
  return streak;
}

/* ── Personal best detection ── */
function isPersonalBest(name,sessions,period){
  if(!period||!sessions.length) return false;
  const all=allBookings.filter(b=>b.contact_name===name&&b.booking_status==='Booked');
  const current=sessions.length;
  // Compare same window historically
  const now=new Date();
  const windows=[];
  for(let w=1;w<=12;w++){
    const end=new Date(now);end.setDate(end.getDate()-(w*period));
    const start=new Date(end);start.setDate(start.getDate()-period);
    const cnt=all.filter(s=>{const d=new Date(s.event_date);return !isNaN(d)&&d>=start&&d<=end;}).length;
    if(cnt>0) windows.push(cnt);
  }
  if(!windows.length) return false;
  return current>0&&current>=Math.max(...windows);
}

/* ── Core Recovery Window (muscle-aware) ── */
function calcReadiness(name){
  const all=allBookings.filter(b=>b.contact_name===name&&b.booking_status==='Booked');
  if(!all.length) return{score:60,status:'READY',color:'#4CAF50',msg:'ยังไม่มีข้อมูล — มาคลาสแรกได้เลยนะคะ',rec:'คลาสเริ่มต้นสำหรับมือใหม่',risk:null};

  const sorted=all.map(s=>({dt:new Date(s.event_date),name:s.event_name||''}))
    .filter(s=>!isNaN(s.dt)).sort((a,b)=>b.dt-a.dt);

  const now=new Date();
  const last=sorted[0];
  const hoursSince=Math.floor((now-last.dt)/3600000);
  const daysSince=Math.floor(hoursSince/24);
  const lastGroups=getMuscleGroups(last.name);
  const lastWeight=getStrainWeight(last.name);

  // Week load
  const weekAgo=new Date(now);weekAgo.setDate(now.getDate()-7);
  const weekSess=sorted.filter(s=>s.dt>=weekAgo).length;
  const weekStrain=sorted.filter(s=>s.dt>=weekAgo).reduce((a,s)=>a+getStrainWeight(s.name),0);

  // Base recovery
  const requiredHours=lastWeight>=3.4?48:lastWeight>=2.8?36:24;
  const baseRecovery=Math.min(100,(hoursSince/requiredHours)*100);

  // Week load penalty — ยิ่งมาหนัก score ลดลง
  const weekLoadPenalty=Math.min(30,Math.round((weekStrain/15)*25));
  const score=Math.max(35,Math.round(baseRecovery-weekLoadPenalty));

  const deconRisk=hoursSince>168; // 7+ days

  let status,color,msg,rec,risk=null;

  if(deconRisk){
    status='หยุดมานาน';color='#FF9500';
    msg=`หยุดมา ${daysSince} วันแล้วนะคะ กล้ามเนื้อเริ่มเคยชินกับการพักแล้ว`;
    rec='แนะนำเริ่มด้วย Barre หรือ Basic Core ก่อนเลยค่ะ';
    risk='decon';
  } else if(score<45){
    status='พักก่อนนะคะ';color='#FF453A';
    msg=`มาหนักสัปดาห์นี้ ${weekSess} คลาสแล้ว ร่างกายต้องการพักค่ะ`;
    rec='วันนี้แนะนำ Yoga หรือ Harmony Hour ค่ะ';
    risk='overstrain';
  } else if(score<70){
    status='ไปได้เลยค่ะ';color='#FF9500';
    msg=`พักมา ${hoursSince<24?`${hoursSince} ชั่วโมง`:`${daysSince} วัน`} แล้ว ร่างกายพร้อมระดับนึงค่ะ`;
    rec='แนะนำ Reformer หรือ Flow class วันนี้ค่ะ';
    risk='moderate';
  } else if(score<85){
    status='ไปได้เลยค่ะ';color='#1BE3A0';
    msg=`พักมา ${daysSince>0?`${daysSince} วัน`:`${hoursSince} ชั่วโมง`} ร่างกายฟื้นตัวดีแล้วค่ะ`;
    rec=weekStrain<8?'ลอง Cardio Barre หรือ Glutes & Legs วันนี้ได้เลยค่ะ':'Reformer หรือ Private Session เหมาะมากค่ะ';
    risk=null;
  } else {
    status='พร้อมมากค่ะ';color='#1BE3A0';
    msg=`พักมา ${daysSince>0?`${daysSince} วัน`:`${hoursSince} ชั่วโมง`} ร่างกายพร้อมเต็มที่เลยค่ะ`;
    rec=weekStrain<8?'ลอง class ที่หนักขึ้นได้เลยนะคะ เช่น Jumpboard หรือ Cardio Barre':'Reformer หรือ Barre เหมาะมากค่ะ';
    risk=null;
  }

  return{score,status,color,msg,rec,risk,hoursSince,weekSess,weekStrain,lastGroups};
}

/* ── Week comparison ── */
function getWeekComp(name, period='thisWeek'){
  const all=allBookings.filter(b=>b.contact_name===name&&b.booking_status==='Booked');
  const now=new Date();
  let curStart,curEnd,prevStart,prevEnd;

  if(period==='thisWeek'){
    const dow=(now.getDay()+6)%7;
    curStart=new Date(now);curStart.setDate(now.getDate()-dow);curStart.setHours(0,0,0,0);
    curEnd=new Date(now);
    prevEnd=new Date(curStart);
    prevStart=new Date(curStart);prevStart.setDate(curStart.getDate()-7);
  } else if(period==='lastWeek'){
    const dow=(now.getDay()+6)%7;
    const thisMonday=new Date(now);thisMonday.setDate(now.getDate()-dow);thisMonday.setHours(0,0,0,0);
    curStart=new Date(thisMonday);curStart.setDate(thisMonday.getDate()-7);
    curEnd=new Date(thisMonday);curEnd.setMilliseconds(-1);
    prevStart=new Date(curStart);prevStart.setDate(curStart.getDate()-7);
    prevEnd=new Date(curStart);prevEnd.setMilliseconds(-1);
  } else if(period===30){
    curEnd=new Date(now);
    curStart=new Date(now);curStart.setDate(now.getDate()-30);curStart.setHours(0,0,0,0);
    prevEnd=new Date(curStart);
    prevStart=new Date(curStart);prevStart.setDate(curStart.getDate()-30);
  } else {
    return{thisW:0,lastW:0,diff:0};
  }

  const thisW=all.filter(s=>{const d=new Date(s.event_date);return d>=curStart&&d<=curEnd;}).length;
  const lastW=all.filter(s=>{const d=new Date(s.event_date);return d>=prevStart&&d<=prevEnd;}).length;
  return{thisW,lastW,diff:thisW-lastW};
}
