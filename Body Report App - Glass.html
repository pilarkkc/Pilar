/* ── Sheets for load / types / coach / monthly — each answers one question ── */
function _sheetChartOther(host,meas){
  const rows=_sheetRowsInRange();
  const k=AH_SHEET.kind;
  const mrow=(lbl,val,unit)=>`<div class="ah-meas-row"><span class="ah-meas-lbl">${lbl}</span><span class="ah-meas-val">${val}${unit?`<span>${unit}</span>`:''}</span></div>`;
  if(!rows.length&&k!=='streak'){host.innerHTML='<div class="ah-empty">No classes in this period</div>';meas.innerHTML='';return;}

  /* ── LOAD: "Where does my score come from?" — anatomy of the ring ── */
  if(k==='load'){
    const days=SHEET_RANGES[AH_SHEET.range].days||null;
    const sess=allBookings.filter(b=>b.contact_name===AH_SHEET.name&&b.booking_status==='Booked');
    const periodSess=days?filterByPeriod(sess,days):sess;
    const stats=process(periodSess,days);
    // ── Consistent weekly-rate formula across all 3 filters ──
    // Use the actual date span of sessions in this period (min 7 days)
    // so 7D/30D/All all measure "how intense per week" on the same scale.
    // This prevents 7D from scoring higher just because its window is smaller.
    const _pSess=periodSess.map(b=>new Date(b.event_date)).filter(d=>!isNaN(d)).sort((a,b)=>a-b);
    // span = first→last class of THIS member in THIS period (min 7 days).
    // For "All", this is from the member's very first class — not when the studio opened.
    const _spanDays=_pSess.length>=2
      ? Math.max(7,Math.ceil((_pSess[_pSess.length-1]-_pSess[0])/86400000)+1)
      : 7;
    const _weeks=Math.max(_spanDays/7,1);
    // effective classes/week: strain-adjusted so heavier formats count a little more.
    // weeklyStrain is the raw strain sum; dividing by ~3 (avg class strain) converts
    // it to "class-equivalents", then by weeks gives the per-week rate.
    const _classEquiv=stats.weeklyStrain/3.0;
    const classesPerWeek=_classEquiv/_weeks;
    const strain=classesPerWeek; // kept name for downstream refs
    // consecutiveRestDays: count back from today until we hit a day with a class.
    // Only applied on time-bounded views (7D/30D). "All" view shows lifetime score
    // so decay doesn't apply — pass null to skip it.
    let _consRest=null;
    if(SHEET_RANGES[AH_SHEET.range].days){
      const _allDates=new Set(
        allBookings.filter(b=>b.contact_name===AH_SHEET.name&&b.booking_status==='Booked')
          .map(b=>{ const d=new Date(b.event_date); d.setHours(0,0,0,0); return d.getTime(); })
      );
      const _today=new Date(); _today.setHours(0,0,0,0);
      _consRest=0;
      for(let i=0;i<180;i++){
        const d=new Date(_today); d.setDate(_today.getDate()-i);
        if(_allDates.has(d.getTime())) break;
        _consRest++;
      }
    }
    const score=_activityScore(strain,_consRest);
    const zone=_activityTier(score);
    // ── anatomy: class count by type — single stacked composition bar
    // Class mix by STRAIN contribution (what actually drives the score), not raw count.
    // strain per class = getStrainWeight(name) * (mins/60); summed per type. Counts kept for context.
    const effStrain={}, effCount={};
    rows.forEach(r=>{
      effStrain[r.type]=(effStrain[r.type]||0)+getStrainWeight(r.name)*((r.mins||60)/60);
      effCount[r.type]=(effCount[r.type]||0)+1;
    });
    const effSorted=Object.entries(effStrain).sort((a,b)=>b[1]-a[1]);
    const effTotal=effSorted.reduce((a,[,v])=>a+v,0)||1;
    const effPct=t=>Math.round(effStrain[t]/effTotal*100);
    // topShare now reflects strain share of the dominant type (used by the nudge too)
    const topShare=effSorted.length?{name:effSorted[0][0],pct:effPct(effSorted[0][0])}:null;
    // ── Driver headline (style C) — sentence-case, never claims beyond the data ──
    const _driverLine=(()=>{
      const nTypes=effSorted.length;
      // Sparse data: don't echo the tier ("Getting Started") again — name the format
      // they've actually started with, so the line adds info instead of repeating.
      if(rows.length<=2) return nTypes===1 ? `Starting with ${effSorted[0][0]}` : 'A fresh start';
      if(nTypes===1) return `All ${effSorted[0][0]} this period`;
      const top=topShare?topShare.pct:0;
      const second=nTypes>=2?effPct(effSorted[1][0]):0;
      if(top>=45 && top-second>=12) return `${effSorted[0][0]} led your training`;
      if(top>=35 && top+second>=70) return `${effSorted[0][0]} and ${effSorted[1][0]} led the way`;
      return 'A balanced mix this period';
    })();
    const _typeWord=days===7?'this week':days===30?'this month':'this period';
    const _subLine=`${rows.length} ${rows.length===1?'class':'classes'} across ${effSorted.length} ${effSorted.length===1?'type':'types'} ${_typeWord}`;
    // tonal ladder off the single load accent — wider contrast so slices don't blur together
    const _tone=i=>[100,72,50,34,22,14][Math.min(i,5)];
    const segCount=effSorted.length;
    const segs=effSorted.map(([t],i)=>{
      const w=effStrain[t]/effTotal*100;
      const first=i===0, last=i===segCount-1;
      const fill=`color-mix(in srgb, var(--ah-c-load) ${_tone(i)}%, #fff)`;
      const radius=first?'4px 0 0 4px':last?'0 4px 4px 0':'0';
      return `<div title="${t}: ${effPct(t)}%" style="flex:0 0 ${w.toFixed(2)}%;min-width:${segCount>1?'4px':'0'};height:100%;background:${fill};border-radius:${radius}"></div>`;
    }).join('');
    const stackBar=`<div style="display:flex;gap:2px;height:10px;border-radius:4px;overflow:hidden;margin-top:2px">${segs}</div>`;
    // legend: tonal dot · type name · raw count (muted context) · strain %
    const legend=effSorted.map(([t],i)=>`
      <div style="display:flex;align-items:center;gap:9px;${i>0?'margin-top:11px':''}">
        <span style="width:9px;height:9px;border-radius:50%;flex-shrink:0;background:color-mix(in srgb, var(--ah-c-load) ${_tone(i)}%, #fff)"></span>
        <span style="flex:1;font-size:var(--ah-f-body);font-weight:500;color:var(--ah-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t} <span style="font-size:var(--ah-f-cap);color:var(--ah-grey-2);font-weight:400">&middot; ${effCount[t]}</span></span>
        <span style="font-size:var(--ah-f-foot);color:var(--ah-grey);min-width:38px;text-align:right;font-weight:600">${effPct(t)}%</span>
      </div>`).join('');
    // sparse mode: <=2 types, the bar reads like a stuck progress bar — drop it, list only
    const _sparse=segCount<=2;
    const effBars=`${_sparse?'':stackBar}<div style="margin-top:${_sparse?'2px':'18px'}">${legend}</div>`;

    // ── INSIGHT / TREND / ACTION triad ──
    // trend: percentile vs the member's own weekly history (converted to the 0–100 activity scale)
    const wkHist=_weeklyStrainHistory(AH_SHEET.name);
    const curWk=_weekKey(new Date());
    const p=_percentileVsSelf(score, wkHist.filter(w=>w.wk!==curWk).map(w=>_activityScore(w.score/3.0)));
    // Neutral, non-judgmental framing vs the member's own usual rhythm (Apple-style).
    // No percentile numbers thrown at the user; just direction relative to "usual".
    const _pWord=days===7?'week':days===30?'month':'period';
    let insightLine;
    if(p.strong && p.pct>=70) insightLine=`A stronger ${_pWord} than usual`;
    else if(p.strong && p.pct<=30) insightLine=`A lighter ${_pWord} than usual`;
    else if(p.strong) insightLine=`Right around your usual`;
    else insightLine=`${zone} this ${_pWord}`;
    const actionLine=_loadRecommendation(score, topShare, rows.length);

    // visual primitive: ring is the only coloured element.
    // hierarchy: ring(number /100) → tier → usual-comparison → driver headline → strain mix → nudge

    host.innerHTML=`
      <div class="ah-sheet-hero" style="border-radius:40px;corner-shape:squircle;padding:20px;margin:2px 0 14px">
        <div style="display:flex;align-items:center;gap:18px">
          <div style="flex-shrink:0">
            ${ahRing(score,96,10,'rgba(163,255,88,0.95)',
              `<span style="font-size:26px;font-weight:500;color:var(--ah-ink);letter-spacing:-0.03em;line-height:1">${score}</span><span style="font-size:10px;font-weight:600;color:var(--ah-grey-2);line-height:1;margin-top:2px">/ 100</span>`)}
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:19px;font-weight:600;color:var(--ah-ink);letter-spacing:-0.02em;line-height:1.15">${zone}</div>
            <div style="font-size:12.5px;font-weight:400;color:var(--ah-grey-2);line-height:1.4;margin-top:5px">${insightLine}</div>
          </div>
        </div>
      </div>

      <div class="ah-con-card">
        <div style="font-size:15px;font-weight:600;color:var(--ah-ink);line-height:1.3">${_driverLine}</div>
        <div style="font-size:13px;color:var(--ah-grey);margin-top:4px;margin-bottom:14px">${_subLine}</div>
        ${effBars||''}
      </div>

      <div style="margin-top:18px;padding-top:16px;border-top:0.5px solid var(--ah-hair-2);display:flex;align-items:center;gap:9px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ah-c-load)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M17 7l1.4-1.4M5.6 18.4L7 17"/><circle cx="12" cy="12" r="3.2"/></svg>
        <span style="font-size:13.5px;font-weight:500;color:color-mix(in srgb, var(--ah-c-load) 78%, #000);line-height:1.3">${actionLine}</span>
      </div>`;
    meas.innerHTML='';
    return;
  }

  /* ── TYPES: "What do I actually love?" — podium (matches the dashboard card) ── */
  if(k==='types'){
    const counts={}; rows.forEach(r=>counts[r.type]=(counts[r.type]||0)+1);
    const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    const total=rows.length, top=sorted[0];

    // ── identity vs trend ──
    // identity = WHO YOU ARE, always derived from lifetime data (every booking, ignoring the tab).
    // trend    = WHAT YOU'VE BEEN DOING this week / month (the selected tab).
    // the tab switches the language between the two; identity never flips on sample noise.
    const _lifeCounts={};
    allBookings.filter(b=>b.contact_name===AH_SHEET.name&&b.booking_status==='Booked')
      .forEach(b=>{const t=classify(b.event_name,b.instructors); _lifeCounts[t]=(_lifeCounts[t]||0)+1;});
    const _lifeSorted=Object.entries(_lifeCounts).sort((a,b)=>b[1]-a[1]);
    const _lifeTotal=_lifeSorted.reduce((a,[,n])=>a+n,0)||1;
    const lifeTop=_lifeSorted[0]||top;
    const lifeName=lifeTop[0];
    const lifePct=Math.round(lifeTop[1]/_lifeTotal*100);

    // current-period leader + whether it's a real lead or a near-tie
    const second=sorted[1]||null;
    const isTie = second && top[1]===second[1];
    const _isAll = SHEET_RANGES[AH_SHEET.range].days===0;

    let typesTitle, typesSub;
    if(_isAll){
      // identity view — speak to who they are, only claim a signature when one format leads
      if(lifePct>=40 && !isTie){
        typesTitle=`You're a ${lifeName} person`;
        typesSub=lifePct>=60 ? `${lifeName} is who you are. ${lifePct}% of everything you do.`
          : `${lifeName} is your home format, with a varied mix around it.`;
      } else if(isTie){
        typesTitle=`A true all-rounder`;
        typesSub=`${top[0]} and ${second[0]}, evenly split. No single format defines you.`;
      } else {
        typesTitle=`A true all-rounder`;
        typesSub=`No single format defines you. Your practice stays balanced.`;
      }
    } else {
      // trend view — "lately / this week", never an identity claim
      const periodWord = SHEET_RANGES[AH_SHEET.range].days===7 ? 'week' : 'month';
      const lead = periodWord==='week' ? 'This week' : 'Lately';
      const tooThin = total<=2;            // sample too small to call a trend
      if(tooThin){
        typesTitle=`A light ${periodWord}`;
        typesSub=`${total} ${total===1?'class':'classes'} so far. Too few to call a trend.`;
      } else if(isTie){
        typesTitle=`An even ${periodWord}`;
        typesSub=`${top[0]} and ${second[0]}, evenly split this ${periodWord}.`;
      } else {
        typesTitle=`${lead}: ${top[0]}`;
        // tie the trend back to identity when the two differ, so the story stays coherent
        typesSub = top[0]===lifeName
          ? `${top[0]} led your ${periodWord}, right in line with who you are.`
          : `You've leaned into ${top[0]} this ${periodWord}, though ${lifeName} is your home format.`;
      }
    }

    // ── podium — same visual language as the By type card, scaled up & full roster ──
    // card uses [2nd,1st,3rd] order, single-hue tonal ladder off --ah-c-class, gradient fill,
    // count above bar / label below. here we render the full podium then list any remainder.
    // heights AND tones are driven by the REAL counts (not fixed slots), so equal counts
    // render as equal bars + equal colour — the chart never contradicts the numbers.
    const top3=sorted.slice(0,3);
    const podium=top3.length===1?[null,top3[0],null]
      :top3.length===2?[top3[1],top3[0],null]
      :[top3[1],top3[0],top3[2]];
    const maxN=top[1]||1;                  // tallest real count anchors 100%
    const BAR_H=110, MIN_FRAC=0.34;        // floor so a tiny bar still has presence
    const cols=podium.map((entry,slot)=>{
      if(!entry) return `<div style="flex:1"></div>`;
      const [t,n]=entry;
      const share=Math.round(n/total*100);
      const frac=MIN_FRAC+(1-MIN_FRAC)*(n/maxN);   // real ratio, floored
      const hPx=Math.round(frac*BAR_H);
      const isTopN=n===maxN;                         // colour by real value, not slot
      const isFirst=slot===1;
      const op=isTopN?0.92:(0.35+0.4*(n/maxN));      // white-glass ladder (same as the dashboard tile)
      const label=t.length>11?t.slice(0,10)+'…':t;
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0">
        <span style="font-size:18px;font-weight:800;color:var(--ah-ink);line-height:1;letter-spacing:-.02em">${n}</span>
        <div style="position:relative;width:100%;max-width:84px;height:${hPx}px;box-sizing:border-box;border-radius:${isFirst?'16px':'14px'};corner-shape:squircle;
          background:rgba(255,255,255,${op.toFixed(2)});border:1px solid rgba(255,255,255,${Math.min(op+0.25,1).toFixed(2)});
          box-shadow:inset 0 1.5px 0 rgba(255,255,255,0.9)${isTopN?',0 8px 20px -10px rgba(60,50,30,0.35)':''}"></div>
        <span style="font-size:12px;font-weight:600;color:var(--ah-ink);text-align:center;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${label}</span>
        <span style="font-size:11px;font-weight:500;color:var(--ah-grey);line-height:1">${share}%</span>
      </div>`;
    }).join('');
    const podiumRow=`<div style="display:flex;align-items:flex-end;gap:14px;width:100%;height:${BAR_H+62}px;padding-top:6px;margin-top:24px">${cols}</div>`;

    // remainder beyond the top-3 podium — quiet rows so nothing is hidden
    const rest=sorted.slice(3);
    const restRows=rest.length?`<div style="margin-top:22px;padding-top:18px;border-top:0.5px solid var(--ah-hair-2)">`+
      rest.map(([t,n],i)=>{
        const share=Math.round(n/total*100);
        return `<div style="display:flex;align-items:center;gap:9px;${i>0?'margin-top:11px':''}">
          <span style="width:8px;height:8px;border-radius:50%;flex-shrink:0;background:color-mix(in srgb, var(--ah-c-class) ${[24,16,12,10][Math.min(i,3)]}%, #fff)"></span>
          <span style="flex:1;font-size:var(--ah-f-body);font-weight:500;color:var(--ah-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t}</span>
          <span style="font-size:var(--ah-f-foot);font-weight:600;color:var(--ah-ink)">${n}</span>
          <span style="font-size:var(--ah-f-cap);color:var(--ah-grey);min-width:34px;text-align:right">${share}%</span>
        </div>`;
      }).join('')+`</div>`:'';

    host.innerHTML=`
      <div style="display:flex;align-items:baseline;gap:8px">
        <span class="ah-sheet-range-num">${typesTitle}</span>
      </div>
      <div class="ah-sheet-range-cap" style="margin-top:var(--ah-s2);line-height:1.45;color:var(--ah-ink)">${typesSub}</div>
      ${podiumRow}
      ${restRows}`;
    host.insertAdjacentHTML('beforeend',
      `<div class="ah-sheet-foot">${sorted.length} formats · ${total} classes this period</div>`);
    meas.innerHTML='';
    return;
  }

  /* ── COACH: "Who do I train with?" ── */
  if(k==='coach'){
    const withI=rows.filter(r=>r.instructor);
    if(!withI.length){host.innerHTML='<div class="ah-empty">No instructor data in this period</div>';meas.innerHTML='';return;}
    const counts={}; withI.forEach(r=>counts[r.instructor]=(counts[r.instructor]||0)+1);
    const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    const total=withI.length, top=sorted[0];
    const initials=n=>n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const clean=n=>n.replace(/^\s*(instructor|coach|ครู)\s+/i,'').trim()||n;
    const pct=Math.round(top[1]/total*100);
    const rest=sorted.slice(1);
    const list=rest.length?rest.map(([n,c],i)=>`
      <div class="ah-instr-row" style="${i>0?'margin-top:12px;padding-top:11px;border-top:0.5px solid var(--ah-hair-2)':''}">
        <div class="ah-instr-av">${initials(clean(n))}</div>
        <div style="flex:1;min-width:0"><div class="ah-instr-name">${clean(n)}</div></div>
        <span class="ah-instr-count" style="color:var(--ah-ink)">${c} · ${Math.round(c/total*100)}%</span>
      </div>`).join(''):'';
    const single=sorted.length===1;
    const tied=sorted.length>1 && sorted[1][1]===top[1];   // top two share the lead
    const tieN=sorted.filter(([,c])=>c===top[1]).length;    // how many share it
    const coachInsight=single?`Your one and only coach so far`
      :tied?`No single coach leads, you spread your training around`
      :pct>=60?`Most of your training is with one coach`
      :pct>=35?`A reliable partnership, ${pct}% of your sessions`
      :`You train across a varied group of coaches`;
    // caption: when tied, describe the balance instead of crowning one
    const coachCap=tied
      ? `An even split across <b>${tieN}</b> coaches`
      : `<b>${top[1]}</b> ${top[1]===1?'class':'classes'} together · <b>${pct}%</b> of your training`;
    host.innerHTML=`
      <div style="display:flex;flex-direction:column;align-items:center;padding:4px 0 0;text-align:center">
        <div style="width:64px;height:64px;border-radius:50%;background:var(--ah-c-instr);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600">${initials(clean(top[0]))}</div>
        <div class="ah-sheet-range-num" style="font-size:24px;margin-top:12px">${clean(top[0])}</div>
        <div class="ah-sheet-range-cap" style="margin-top:4px;line-height:1.45;color:var(--ah-ink)">${coachCap}</div>
        <div style="margin-top:4px;font-size:13px;color:var(--ah-grey);line-height:1.45">${coachInsight}</div>
      </div>
      ${rest.length?`<div style="margin-top:20px;padding-top:16px;border-top:0.5px solid var(--ah-hair-2);--cat:var(--ah-c-instr)">${list}</div>`:''}`;
    host.insertAdjacentHTML('beforeend',
      `<div class="ah-sheet-foot">${sorted.length} coaches · ${total} classes with an instructor</div>`);
    meas.innerHTML='';
    return;
  }

  /* ── STREAK: "Is my chain alive?" — week-by-week truth ── */
  if(k==='streak'){
    const all=AH_SHEET.rows;
    const streak=calcStreak(AH_SHEET.name);
    const longest=_longestStreak(all);
    const _mode=AH_SHEET.streakMode||'current';
    const _isBest=_mode==='best';
    const _allSeries=_weeklySeries(all);
    let _bi=-1,_bl=0,_ci=-1,_cl=0;
    _allSeries.forEach((w,i)=>{if(w.count>0){if(_cl===0)_ci=i;_cl++;if(_cl>_bl){_bl=_cl;_bi=_ci;}}else{_cl=0;}});
    const _folded=AH_SHEET.streakFold!==false;   // best mode: folded to the record run by default
    const series=_isBest
      ? (_folded&&_bl?_allSeries.slice(Math.max(0,_bi-1),_bi+_bl+1):_allSeries)
      : _allSeries.slice(-Math.max(8,streak+2));
    const _shown=_isBest?longest:streak;
    const _runCls=series.reduce((s,w)=>s+(w.count||0),0);
    const _R={lbl:_isBest?'best run':'current run'};
    const dots=series.map((w,i)=>{
      const on=w.count>0;
      const d=new Date(parseInt(w.wk));
      return `<div style="flex:0 0 34px;display:flex;flex-direction:column;align-items:center;gap:4px;scroll-snap-align:end">
        <div style="width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:${on?'rgba(163,255,88,0.95)':'rgba(120,120,128,0.12)'}">${on?'<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#17181C" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>':''}</div>
        <div style="font-size:8px;color:var(--ah-grey-2);white-space:nowrap">${d.getDate()}/${d.getMonth()+1}</div>
      </div>`;
    }).join('');
    const _wkWord=n=>n===1?'week':'weeks';
    const say=_isBest
      ? (_bl?(()=>{const d=new Date(parseInt(_allSeries[_bi].wk));return 'Since '+d.getDate()+'/'+(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2);})():'No run yet')
      : (streak===0?'Start this week'
        :streak>=longest&&streak>=3?'Personal best'
        :`${longest-streak} ${_wkWord(longest-streak)} to your best`);
    const recordLine=longest>0?`Best ${longest} ${longest===1?'week':'weeks'}`:'';
    host.innerHTML=`
      <div id="streakSheetHero">
      <div style="display:flex;align-items:center;gap:16px">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:baseline;gap:8px">
            <span class="ah-sheet-range-num">${_shown}</span>
            <span class="ah-sheet-range-unit">${_shown===1?'week':'weeks'} in a row<span style="color:var(--ah-grey-2)"> · ${_isBest?'best ever':'now'}</span></span>
          </div>
          <div class="ah-sheet-range-cap" style="margin-top:var(--ah-s2);line-height:1.45;color:var(--ah-ink)">${say}</div>
          <div style="margin-top:8px;font-size:12px;color:var(--ah-grey);line-height:1.45">${_runCls} ${_runCls===1?'class':'classes'}${(_isBest||streak>=longest||!recordLine)?'':' · '+recordLine}</div>
        </div>
        ${ahSegRing(_shown,64,6,'rgba(163,255,88,0.95)')}
      </div>
      </div>
      <div style="margin-top:24px;padding-top:16px;border-top:0.5px solid var(--ah-hair-2)">
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px">
          <div style="font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ah-grey);text-transform:uppercase">Weekly history · ${_isBest?(_folded?'record run':'all '+_allSeries.length+' weeks'):_R.lbl}</div>
          ${_isBest?`<button onclick="ahStreakFold()" style="border:none;background:rgba(23,24,28,0.06);color:var(--ah-ink);font-family:var(--ah-font);font-size:10.5px;font-weight:600;padding:5px 11px;border-radius:999px;cursor:pointer">${_folded?'Show all weeks':'Show record only'}</button>`:''}
          
        </div>
        <div id="ahStreakScroll" style="display:flex;${(_isBest&&!_folded)
          ? 'flex-wrap:wrap;row-gap:12px;justify-content:flex-start;margin:0 -2px;padding:2px'
          : 'overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scrollbar-width:none;margin:0 -4px;padding:0 4px'}">${dots}</div>
      </div>`;
    const sc=document.getElementById('ahStreakScroll');
    if(sc){sc.style.setProperty('-ms-overflow-style','none');if(!(_isBest&&!_folded))sc.scrollLeft=sc.scrollWidth;}
    host.insertAdjacentHTML('beforeend',
      `<div style="margin-top:16px;padding-top:12px;border-top:0.5px solid var(--ah-hair-2);font-size:12px;color:var(--ah-grey-2)">${all.filter(r=>_weekKey(r.dt)===_weekKey(new Date())).length} classes this week</div>`);
    meas.innerHTML='';
    return;
  }

  /* ── RECENT TRAINING: time-grouped check-ins + most-practiced top 3 ── */
  if(k==='recent'){
    const all=AH_SHEET.rows.slice().sort((a,b)=>b.dt-a.dt);
    if(!all.length){host.innerHTML='<div class="ah-empty">No classes yet</div>';meas.innerHTML='';return;}
    const now=new Date();
    const thisWk=_weekKey(now);
    const lastWk=thisWk-86400000*7;
    // group the latest 5 check-ins by time bucket: This week / Last week / month name
    const latest5=all.slice(0,5);
    const bucketOf=dt=>{
      const wk=_weekKey(dt);
      if(wk===thisWk) return 'This week';
      if(wk===lastWk) return 'Last week';
      return dt.toLocaleDateString('en-US',{month:'long'});
    };
    const order=[]; const buckets={};
    latest5.forEach(v=>{
      const b=bucketOf(v.dt);
      if(!buckets[b]){buckets[b]=[];order.push(b);}
      buckets[b].push(v);
    });
    // one line per class · the day number is the only date · same day = shown once · no rules
    const rowHtml=(v,sameDay,first)=>{
      const coach=v.instructor?v.instructor.replace(/^\s*(instructor|coach|ครู)\s+/i,'').split(/\s+/)[0]:'';
      return `<div style="display:flex;align-items:baseline;gap:14px;margin-top:${first?0:(sameDay?7:11)}px">
        <div style="flex-shrink:0;width:22px;text-align:right;font-size:12.5px;font-weight:600;color:var(--ah-grey-2);font-variant-numeric:tabular-nums;line-height:1.35">${sameDay?'':v.dt.getDate()}</div>
        <div style="flex:1;min-width:0;font-size:13.5px;color:var(--ah-ink);line-height:1.35;text-wrap:pretty">${v.name||v.type||'Class'}${coach?`<span style="color:var(--ah-grey-2);font-weight:400"> · ${coach}</span>`:''}</div>
      </div>`;
    };
    // one glass card per month/bucket · count on the right of the sticky header
    const groupsHtml=order.map((b,gi)=>{
      let prevDay='';
      const rows=buckets[b].map((v,i)=>{
        const key=v.dt.toDateString();
        const same=key===prevDay; prevDay=key;
        return rowHtml(v,same,i===0);
      }).join('');
      const n=buckets[b].length;
      return `<div class="ah-con-card"${gi>0?' style="margin-top:10px"':''}>
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:11px">
          <span class="ah-con-eyebrow" style="margin:0">${b}</span>
          <span style="font-size:10.5px;font-weight:600;color:var(--ah-grey-2)">${n}${n===1?' class':' classes'}</span>
        </div>
        ${rows}
      </div>`;
    }).join('');

    // Most practiced — top 3 inline; full grid lives behind "See all"
    const byName={}; all.forEach(r=>{const nm=(r.name||r.type||'Class').trim()||'Class';byName[nm]=(byName[nm]||0)+1;});
    const sorted=Object.entries(byName).sort((a,b)=>b[1]-a[1]);
    // 34c · editorial ranking — no chart: mono rank + name + tabular count, top three larger
    const _rank=([cls,n],idx)=>{
      const top=idx<3;
      return `<div onclick="ahOpenSheet('cls',this.dataset.cls)" data-cls="${cls.replace(/"/g,'&quot;')}"
        style="display:flex;align-items:baseline;gap:12px;margin-top:${idx?14:15}px;cursor:pointer;-webkit-tap-highlight-color:transparent${idx?';border-top:1px solid rgba(23,24,28,0.07);padding-top:14px':''}">
        <span style="flex-shrink:0;width:16px;font-family:ui-monospace,Menlo,monospace;font-size:10px;font-weight:600;color:rgba(23,24,28,${top?0.55:0.3})">${String(idx+1).padStart(2,'0')}</span>
        <span style="flex:1;min-width:0;font-size:${top?14:12.5}px;font-weight:${top?500:400};color:var(--ah-ink);line-height:1.3;text-wrap:pretty">${cls}</span>
        <span style="flex-shrink:0;display:flex;align-items:baseline"><span style="font-size:${top?20:15}px;font-weight:500;letter-spacing:-0.02em;color:var(--ah-ink);font-variant-numeric:tabular-nums">${n}</span><span style="font-size:10px;color:var(--ah-grey-2);margin-left:2px">×</span></span>
      </div>`;
    };
    const top3=sorted.slice(0,3).map((e,i)=>_rank(e,i)).join('');
    const allCards=sorted.slice(3).map((e,i)=>_rank(e,i+3)).join('');
    const seeAll=sorted.length>3?`
      <button id="ahTakenMore" onclick="(function(b){var r=document.getElementById('ahTakenRest');var open=r.style.display!=='none';r.style.display=open?'none':'block';b.textContent=open?'See all ${sorted.length} classes':'Show less';})(this)"
        style="margin-top:14px;background:rgba(23,24,28,0.06);border:none;border-radius:999px;corner-shape:squircle;padding:8px 16px;font-family:var(--ah-font);font-size:12px;font-weight:600;color:var(--ah-ink);cursor:pointer;-webkit-tap-highlight-color:transparent">See all ${sorted.length} classes</button>`:'';

    // hero + weekly rhythm (33b)
    const _r0=all[0];
    const _diff=Math.max(0,Math.round((now-_r0.dt)/86400000));
    const _tm=(_r0.dt.getHours()||_r0.dt.getMinutes())?(()=>{const h=_r0.dt.getHours();const ap=h>=12?'PM':'AM';return (h%12||12)+(_r0.dt.getMinutes()?':'+String(_r0.dt.getMinutes()).padStart(2,'0'):'')+' '+ap;})():'';
    const _co=_r0.instructor?_r0.instructor.replace(/^\s*(instructor|coach|ครู)\s+/i,'').split(/\s+/)[0]:'';
    const _wkk=d=>{const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x.getTime();};
    const _thisWkStart=_wkk(now);
    const _dLbl=_r0.dt.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short'});
    const _heroHTML=`<div class="ah-sheet-hero" style="border-radius:34px;corner-shape:squircle;padding:18px;margin:2px 0 14px">
      <div style="font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ah-grey-2)">Session ${all.length} · latest</div>
      <div style="font-size:22px;font-weight:500;letter-spacing:-0.02em;line-height:1.15;margin-top:6px;color:var(--ah-ink)">${_r0.name||_r0.type||'Class'}</div>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,0.2)">
        <span style="font-size:11.5px;color:var(--ah-grey)">${_dLbl}${_tm?' · '+_tm:''}</span>
        ${_co?`<span style="font-size:11.5px;color:var(--ah-grey)">with ${_co}</span>`:''}
        <span style="flex:1"></span>
        <span style="font-size:11.5px;font-weight:600;color:rgba(163,255,88,0.95)">${_diff===0?'today':_diff===1?'1d ago':_diff+'d ago'}</span>
      </div></div>`;
    host.innerHTML=`
      ${_heroHTML}
      ${groupsHtml}
      <div class="ah-con-card" style="margin-top:10px">
        <div class="ah-con-eyebrow">Most practiced</div>
        <div style="margin-top:11px">
        ${top3}
        <div id="ahTakenRest" style="display:none">${allCards}</div>
        ${seeAll}
      </div>`;
    host.insertAdjacentHTML('beforeend',
      `<div class="ah-sheet-foot">${all.length} classes since you joined</div>`);
    meas.innerHTML='';
    return;
  }

  /* ── CLS: one class, every visit — "when did I actually go?" ── */
  if(k==='cls'){
    const visits=AH_SHEET.rows.filter(r=>r.name===AH_SHEET.arg).sort((a,b)=>b.dt-a.dt);
    if(!visits.length){host.innerHTML='<div class="ah-empty">No visits yet</div>';meas.innerHTML='';return;}
    const coaches={};visits.forEach(v=>{if(v.instructor)coaches[v.instructor]=(coaches[v.instructor]||0)+1;});
    const topCoach=Object.entries(coaches).sort((a,b)=>b[1]-a[1])[0];
    const list=visits.slice(0,30).map((v,i)=>`
      <div style="display:flex;align-items:center;gap:12px;${i>0?'margin-top:12px;padding-top:10px;border-top:0.5px solid var(--ah-hair-2)':''}">
        <div style="width:34px;text-align:center;flex-shrink:0">
          <div style="font-size:15px;font-weight:700;color:var(--ah-ink);line-height:1">${v.dt.getDate()}</div>
          <div style="font-size:9px;color:var(--ah-grey);text-transform:uppercase;letter-spacing:.04em">${v.dt.toLocaleDateString('en-US',{month:'short'})}</div>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:var(--ah-f-body);font-weight:500;color:var(--ah-ink)">${v.dt.toLocaleDateString('en-US',{weekday:'long'})}</div>
          ${v.instructor?`<div style="font-size:var(--ah-f-cap);color:var(--ah-grey);margin-top:1px">with ${v.instructor.replace(/^\s*(instructor|coach|ครู)\s+/i,'')}</div>`:''}
        </div>
        <span style="font-size:var(--ah-f-cap);color:var(--ah-grey-2)">${v.mins||60} min</span>
      </div>`).join('');
    host.innerHTML=`
      <div style="display:flex;align-items:baseline;gap:8px">
        <span class="ah-sheet-range-num">${visits.length}</span>
        <span class="ah-sheet-range-unit">${visits.length===1?'visit':'visits'}</span>
      </div>
      <div class="ah-sheet-range-cap" style="margin-top:var(--ah-s2);line-height:1.45;color:var(--ah-ink)">${topCoach?`Usually with <b>${topCoach[0].replace(/^\s*(instructor|coach|ครู)\s+/i,'')}</b> — ${topCoach[1]} of ${visits.length}`:'Your visit history'}</div>
      <div style="margin-top:16px">${list}</div>`;
    const hrs=(visits.reduce((a,v)=>a+(v.mins||60),0)/60).toFixed(1);
    host.insertAdjacentHTML('beforeend',
      `<div class="ah-sheet-foot">Since ${visits[visits.length-1].dt.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})} · ${hrs} hours in this class</div>`);
    meas.innerHTML='';
    return;
  }

  /* ── PRIME: "When am I at the studio?" — weekday rhythm + clock ── */
  if(k==='prime'){
    const timed=rows.filter(r=>r.dt.getHours()!==0||r.dt.getMinutes()!==0);
    if(timed.length<3){host.innerHTML='<div class="ah-empty">Not enough timed check-ins in this period</div>';meas.innerHTML='';return;}
    const dows=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const hrStr=h=>{const ap=h>=12?'PM':'AM';const hh=h%12||12;return hh+' '+ap;};
    const cell={}; timed.forEach(r=>{const kk=r.dt.getDay()+'-'+r.dt.getHours();cell[kk]=(cell[kk]||0)+1;});
    const topCell=Object.entries(cell).sort((a,b)=>b[1]-a[1])[0];
    const [tdow,thr]=topCell[0].split('-').map(Number);
    // weekday distribution — quiet number row, sorted by count desc
    const byDow=[0,0,0,0,0,0,0]; timed.forEach(r=>byDow[r.dt.getDay()]++);
    const dowRow=[1,2,3,4,5,6,0]
      .map(di=>({di,n:byDow[di]}))
      .sort((a,b)=>b.n-a.n || a.di-b.di)
      .map(({di,n})=>{
        const top=di===tdow, zero=n===0;
        return `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;${zero?'opacity:.4':''}">
          <div style="font-size:13px;font-weight:${top?'700':zero?'400':'600'};color:${top?'var(--ah-c-time)':zero?'var(--ah-grey)':'var(--ah-ink)'}">${n}</div>
          <div style="font-size:10px;color:var(--ah-grey)">${dows[di].slice(0,3)}</div>
        </div>`;
      }).join('');
    // by-hour counts + day-as-timeline zones (Morning / Afternoon / Evening)
    const byHr={}; timed.forEach(r=>{const h=r.dt.getHours();byHr[h]=(byHr[h]||0)+1;});
    const H0=6,H1=21,HSPAN=H1-H0;
    const mxH=Math.max(...Object.values(byHr),1);
    const hrStr2=h=>{const ap=h>=12?'PM':'AM';const hh=h%12||12;return hh+' '+ap;};
    const xp=h=>(Math.max(H0,Math.min(H1,h))-H0)/HSPAN*100;
    const ZONES=[
      {key:'morning',label:'Morning',lo:6,hi:12},
      {key:'afternoon',label:'Afternoon',lo:12,hi:17},
      {key:'evening',label:'Evening',lo:17,hi:22},
    ];
    ZONES.forEach(z=>{z.count=Object.entries(byHr).filter(([h])=>+h>=z.lo&&+h<z.hi).reduce((a,[,n])=>a+n,0);});
    const primeZoneKey=(ZONES.find(z=>thr>=z.lo&&thr<z.hi)||ZONES[2]).key;
    // continuous day gradient (cool morning -> warm midday -> periwinkle evening)
    const dayGrad='linear-gradient(90deg,'
      +'rgba(100,210,255,0.10) 0%,'
      +'rgba(140,200,200,0.06) 28%,'
      +'rgba(255,180,40,0.11) 42%,'
      +'rgba(255,170,90,0.09) 62%,'
      +'rgba(108,116,220,0.10) 73%,'
      +'rgba(96,102,214,0.19) 100%)';
    // frequency blocks (data stays periwinkle)
    let hrBlocks='';
    for(let h=H0;h<=H1;h++){
      const n=byHr[h]||0; if(!n) continue;
      const d=(8+Math.round(n/mxH*8));          // 8–16px liquid-glass bead, area = frequency
      const k=n/mxH;
      const fill=(0.4+k*0.5).toFixed(2);         // glass tint: fuller hour = denser white
      const tip=`${hrStr2(h)} &middot; ${n} ${n===1?'class':'classes'}`;
      const peak=n===mxH;
      const delay=(0.42+(h-H0)*0.05).toFixed(2);   // sheet transform lands at ~0.4s
      // 29a bloom (stagger by hour) + peak ring, then 29c breathing on the peak bead
      // level 2: hold the entrance until the sheet has finished sliding (0.42s)
      const anim=peak
        ? `animation:ahBeadPop .5s cubic-bezier(.34,1.42,.64,1) ${delay}s both,ahBreathe 3.4s ease-in-out ${(+delay+1.2).toFixed(2)}s infinite;`
        : `animation:ahBeadPop .48s cubic-bezier(.34,1.42,.64,1) ${delay}s both;`;
      // no per-bead backdrop-filter: at 8–16px the blur is invisible but it nests a third
      // backdrop layer inside the sheet + hero, which is what made this sheet stutter
      hrBlocks+=`<div class="ah-prime-bead" onclick="ahPop(event,'${tip}')" style="position:absolute;left:${xp(h).toFixed(1)}%;top:50%;width:${d}px;height:${d}px;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;${anim}background:radial-gradient(70% 70% at 32% 26%,rgba(255,255,255,0.97),rgba(255,255,255,${Math.min(fill*1.25,0.98).toFixed(2)}) 62%,rgba(255,255,255,${(fill*0.9).toFixed(2)}) 100%);border:1px solid rgba(255,255,255,0.8);box-shadow:inset 0 1px 0 rgba(255,255,255,0.9),0 2px 6px -2px rgba(40,40,50,${(0.2+k*0.25).toFixed(2)})"></div>`;
      if(peak) hrBlocks+=`<div class="ah-prime-bead ah-prime-peak-ring" style="left:${xp(h).toFixed(1)}%;top:50%;width:${d}px;height:${d}px;transform:translate(-50%,-50%);animation:ahPeakRing 1.15s ease-out ${(+delay+0.42).toFixed(2)}s 1 both"></div>`;
    }
    // soft dividers at zone boundaries
    const zDivs=[12,17].map(h=>`<div style="position:absolute;left:${xp(h).toFixed(1)}%;top:10px;bottom:10px;width:1px;background:rgba(60,60,67,0.06)"></div>`).join('');
    // time ticks above the bar (faint)
    const zTicks=[6,12,17].map(h=>`<div style="position:absolute;left:${xp(h).toFixed(1)}%;bottom:0;transform:translateX(${h===6?'0':'-50%'});font-size:9px;color:var(--ah-grey-2)">${hrStr2(h)}</div>`).join('')
      +`<div style="position:absolute;right:0;bottom:0;font-size:9px;color:var(--ah-grey-2)">${hrStr2(21)}</div>`;
    // zone labels below the bar
    const zoneLabelColor={morning:'#8FD8EC',afternoon:'#F2BC5A',evening:'#A6ADF4'};
    const zoneAnim=i=>'animation:ahLabelIn .5s ease '+(1.05+i*0.09).toFixed(2)+'s both;';
    const zLabels=ZONES.map((z,zi)=>{
      const mid=(xp(z.lo)+xp(z.hi))/2, p=z.key===primeZoneKey;
      return `<div class="ah-prime-zone" style="position:absolute;left:${mid.toFixed(1)}%;transform:translateX(-50%);font-size:11px;font-weight:${p?'700':'600'};color:${zoneLabelColor[z.key]};${zoneAnim(zi)}">${z.label}</div>`;
    }).join('');
    const share=Math.round(topCell[1]/timed.length*100);
    const _evn=timed.filter(r=>r.dt.getHours()>=17).length;
    const primeIdentity=_evn/timed.length>=.65?`Evening is your rhythm`
      :_evn/timed.length<=.25?`Mornings are your rhythm`
      :`Your schedule is flexible`;
    host.innerHTML=`
      <div class="ah-sheet-hero" style="position:relative;overflow:hidden;border-radius:40px;corner-shape:squircle;padding:20px;margin:2px 0 14px">
        <span class="ah-prime-aura" style="position:absolute;inset:-25%;pointer-events:none;background:radial-gradient(40% 34% at 22% 12%,rgba(252,186,64,0.2),transparent 70%),radial-gradient(38% 32% at 82% 78%,rgba(74,112,142,0.22),transparent 72%);animation:ahAuroraDrift 9s ease-in-out .6s infinite"></span>
        <div style="position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
          <div style="min-width:0">
            <div style="font-size:22px;font-weight:500;letter-spacing:-0.02em;color:var(--ah-ink);line-height:1.1">${dows[tdow]}s, ${hrStr(thr)}</div>
            <div style="margin-top:6px;font-size:12.5px;color:var(--ah-grey-2);line-height:1.45">${primeIdentity}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:26px;font-weight:500;letter-spacing:-0.02em;line-height:1;color:var(--ah-ink)">${share}<span style="font-size:13px;color:var(--ah-grey-2);margin-left:2px">%</span></div>
            <div style="font-size:9.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ah-grey-2);margin-top:4px;white-space:nowrap">of classes</div>
          </div>
        </div>
        <div style="position:relative;margin-top:20px">
          <div style="position:relative;height:14px;margin-bottom:5px">${zTicks}</div>
          <div style="position:relative;height:50px;border-radius:16px;corner-shape:squircle;background:${dayGrad};overflow:hidden">
            ${zDivs}
            <div style="position:relative;height:100%">${hrBlocks}</div>
          </div>
          <div style="position:relative;height:16px;margin-top:8px">${zLabels}</div>
        </div>
      </div>
      <div class="ah-con-card">
        <div class="ah-con-eyebrow">By day</div>
        <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:flex-end">${dowRow}</div>
      </div>`;
    host.insertAdjacentHTML('beforeend',
      `<div class="ah-sheet-foot">${Math.round(_evn/timed.length*100)}% evening classes · from ${timed.length} timed check-ins</div>`);
    meas.innerHTML='';
    return;
  }

  /* ── FORM: rolling effort vs baseline — "is the engine rising?" ── */
  if(k==='form'){
    const f=_formStats(AH_SHEET.rows);
    if(!f){host.innerHTML='<div class="ah-empty">Need a few more weeks of history</div>';meas.innerHTML='';return;}
    // rolling 4-week curve plotted as % vs YOUR USUAL — above the line = doing more than usual
    const roll=f.eff.map((_,i)=>{const a=f.eff.slice(Math.max(0,i-3),i+1);return a.reduce((x,y)=>x+y,0)/a.length;});
    const pcts=roll.map(v=>Math.max(-60,Math.min(60,(v/f.baseline-1)*100)));
    const show=pcts.slice(-20), showWk=f.series.slice(-20);
    const W=320,H=140,MID=H/2;
    const X=i=>show.length>1?i/(show.length-1)*(W-34):W/2;   // leave room for "now" tag
    const Y=p=>MID-(p/60)*(MID-12);
    let dPath=`M${X(0).toFixed(1)},${Y(show[0]).toFixed(1)}`;
    for(let i=1;i<show.length;i++){
      const x0=X(i-1),y0=Y(show[i-1]),x1=X(i),y1=Y(show[i]);
      dPath+=` Q${x0.toFixed(1)},${y0.toFixed(1)} ${((x0+x1)/2).toFixed(1)},${((y0+y1)/2).toFixed(1)}`;
    }
    dPath+=` L${X(show.length-1).toFixed(1)},${Y(show[show.length-1]).toFixed(1)}`;
    const lastX=X(show.length-1),lastY=Y(show[show.length-1]),lastP=Math.round(show[show.length-1]);
    const arrow=f.status==='Rising'?'↗':f.status==='Resting'?'↘':'→';
    const say=f.status==='Rising'?`You're doing <b>${f.pct>=0?'+':''}${f.pct}%</b> more than usual`
      :f.status==='Resting'?`<b>${f.pct}%</b> vs your usual right now`
      :`Right on your usual rhythm`;
    host.innerHTML=`
      <div style="display:flex;align-items:baseline;gap:8px">
        <span class="ah-sheet-range-num">${f.status} ${arrow}</span>
      </div>
      <div class="ah-sheet-range-cap" style="margin-top:var(--ah-s2);line-height:1.45;color:var(--ah-ink)">${say}</div>
      <div style="margin-top:16px">
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;overflow:visible">
          <defs><linearGradient id="formFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(255,55,95,0.16)"/><stop offset="50%" stop-color="rgba(255,55,95,0)"/>
          </linearGradient></defs>
          <rect x="0" y="0" width="${W}" height="${MID}" fill="rgba(255,55,95,0.04)"/>
          <text x="${W-2}" y="13" text-anchor="end" font-size="9" font-weight="600" fill="rgba(255,55,95,0.55)" font-family="var(--ah-font)" letter-spacing="0.06em">MORE THAN USUAL</text>
          <text x="${W-2}" y="${H-6}" text-anchor="end" font-size="9" font-weight="600" fill="var(--ah-grey-2)" font-family="var(--ah-font)" letter-spacing="0.06em">LESS THAN USUAL</text>
          <line x1="0" y1="${MID}" x2="${W}" y2="${MID}" stroke="rgba(60,60,67,0.30)" stroke-width="1.2" stroke-dasharray="4 4"/>
          <text x="2" y="${MID-6}" font-size="9" font-weight="600" fill="var(--ah-grey)" font-family="var(--ah-font)" letter-spacing="0.05em">YOUR USUAL</text>
          <path d="${dPath} L${X(show.length-1)},${H} L0,${H} Z" fill="url(#formFill)" stroke="none"/>
          <path d="${dPath}" fill="none" stroke="var(--ah-c-form)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="5" fill="var(--ah-c-form)" stroke="#fff" stroke-width="2.5"/>
          <text x="${(lastX+9).toFixed(1)}" y="${(lastY+3.5).toFixed(1)}" font-size="10" font-weight="700" fill="var(--ah-c-form)" font-family="var(--ah-font)">${lastP>=0?'+':''}${lastP}%</text>
        </svg>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:var(--ah-f-cap);color:var(--ah-grey-2)">
        <span>${new Date(parseInt(showWk[0].wk)).toLocaleDateString('en-US',{month:'short'})}</span>
        <span>4-week average, week by week</span>
        <span>${new Date(parseInt(showWk[showWk.length-1].wk)).toLocaleDateString('en-US',{month:'short'})}</span>
      </div>`;
    host.insertAdjacentHTML('beforeend',
      `<div style="margin-top:16px;padding-top:12px;border-top:0.5px solid var(--ah-hair-2);font-size:12px;color:var(--ah-grey-2)">${f.pct>=0?'+':''}${f.pct}% right now · best +${Math.max(f.bestPct,0)}% in ${f.bestDate.toLocaleDateString('en-US',{month:'short',year:'numeric'})} · ${f.series.length} weeks tracked</div>`);
    meas.innerHTML='';
    return;
  }

  /* ── COACH EFFECT: days-to-return per coach — "who pulls you back?" ── */
  if(k==='coacheffect'){
    const ce=_coachEffect(AH_SHEET.rows);
    if(!ce){host.innerHTML='<div class="ah-empty">Need more classes with named coaches</div>';meas.innerHTML='';return;}
    const initials=n=>n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const maxAvg=Math.max(...ce.per.map(p=>p.avg),ce.overall);
    const rowsHtml=ce.per.map((p,i)=>`
      <div style="display:flex;align-items:center;gap:12px;${i>0?'margin-top:12px':''}">
        <div class="ah-instr-av" style="${i===0?'background:var(--ah-c-instr);color:#fff':''}">${initials(p.name)}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <span style="font-size:var(--ah-f-body);font-weight:500;color:var(--ah-ink)">${p.name}</span>
            <span style="font-size:var(--ah-f-foot);font-weight:600;color:var(--ah-ink)">${p.avg.toFixed(1)}<span style="font-size:10px;color:var(--ah-grey);font-weight:500"> days</span></span>
          </div>
          <div class="ah-tbar-track" style="margin-top:5px"><div class="ah-tbar-fill" style="width:${Math.round(p.avg/maxAvg*100)}%;background:${i===0?'var(--ah-c-instr)':'color-mix(in srgb, var(--ah-c-instr) 30%, transparent)'};animation:none"></div></div>
        </div>
      </div>`).join('');
    host.innerHTML=`
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 0">
        <div style="width:64px;height:64px;border-radius:50%;background:var(--ah-c-instr);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600">${initials(ce.top.name)}</div>
        <div class="ah-sheet-range-num" style="font-size:24px;margin-top:12px">${ce.top.name}</div>
        <div class="ah-sheet-range-cap" style="margin-top:4px;line-height:1.45;color:var(--ah-ink)">${ce.strong?`Back in <b>${ce.top.avg.toFixed(1)} days</b> after their class. <b>${ce.effect.toFixed(1)}×</b> faster than your usual`:`Your fastest return. Back in <b>${ce.top.avg.toFixed(1)} days</b> on average`}</div>
      </div>
      <div style="margin-top:16px;padding-top:14px;border-top:0.5px solid var(--ah-hair-2)">
        <div style="font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ah-grey);text-transform:uppercase;margin-bottom:12px">Average days to your next class</div>
        ${rowsHtml}
      </div>`;
    host.insertAdjacentHTML('beforeend',
      `<div class="ah-sheet-foot">Your usual gap ${ce.overall.toFixed(1)} days · based on ${ce.per.reduce((a,p)=>a+p.n,0)} gaps</div>`);
    meas.innerHTML='';
    return;
  }

  /* ── MILESTONE: the reward ladder — "what do I unlock next?" ── */
  if(k==='milestone'){
    const total=AH_SHEET.rows.length;
    const nextT=PILAR_TIERS.find(t=>t.n>total);
    const curT=[...PILAR_TIERS].reverse().find(t=>total>=t.n);
    const pct=nextT?Math.min(100,Math.round(total/nextT.n*100)):100;
    const tierRows=_milestoneLadderHTML(total);
    host.innerHTML=`
      <div style="display:flex;align-items:baseline;gap:8px">
        <span class="ah-sheet-range-num">${total}</span>
        <span class="ah-sheet-range-unit">classes${curT?` · ${curT.name} tier`:''}</span>
      </div>
      <div class="ah-sheet-range-cap" style="margin-top:var(--ah-s2);line-height:1.45;color:var(--ah-ink)">${nextT?`<b>${nextT.n-total} more</b> to ${nextT.name}`:'Every tier unlocked'}</div>
      ${nextT?`<div style="height:6px;border-radius:3px;background:rgba(120,120,128,0.10);margin-top:16px;overflow:hidden"><div style="height:100%;width:${pct}%;border-radius:3px;background:${nextT.color}"></div></div>`:''}
      <div style="margin-top:24px;padding-top:16px;border-top:0.5px solid var(--ah-hair-2)">${tierRows}</div>
      <div class="ah-sheet-foot">Claim rewards at the front desk</div>`;
    meas.innerHTML='';
    return;
  }

  /* ── MONTHLY ACTIVITIES: "which days did I show up?" + monthly summary ── */
  if(k==='monthly'){
    const all=AH_SHEET.rows;
    const now=new Date();
    const cy=now.getFullYear(), cm=now.getMonth();
    const monthName=now.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    const curMonthLabel=now.toLocaleDateString('en-US',{month:'long'});
    let _y=cy,_m=cm;
    let thisMonth=all.filter(r=>r.dt.getFullYear()===_y&&r.dt.getMonth()===_m);
    let _isCur=true;
    if(!thisMonth.length&&all.length){                       // no classes yet → last active month
      const lastDt=all[all.length-1].dt;
      _y=lastDt.getFullYear(); _m=lastDt.getMonth(); _isCur=false;
      thisMonth=all.filter(r=>r.dt.getFullYear()===_y&&r.dt.getMonth()===_m);
    }
    const count=thisMonth.length;
    // favorite class this month
    const clsCount={}; thisMonth.forEach(r=>{const nm=(r.name||r.type||'Class').trim();clsCount[nm]=(clsCount[nm]||0)+1;});
    const favClass=Object.entries(clsCount).sort((a,b)=>b[1]-a[1])[0];
    // most active week (ISO week within month)
    const weekCount={}; thisMonth.forEach(r=>{const wk=Math.ceil(r.dt.getDate()/7);weekCount[wk]=(weekCount[wk]||0)+1;});
    const shownMonthName=new Date(_y,_m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
    const shownMonthShort=new Date(_y,_m,1).toLocaleDateString('en-US',{month:'long'});
    const topWeek=Object.entries(weekCount).sort((a,b)=>b[1]-a[1])[0];
    const weekOrd=['','1st','2nd','3rd','4th','5th'];
    // active days this month (distinct calendar days attended — a different lens than class count)
    const activeDaySet=new Set(thisMonth.map(r=>r.dt.getDate()));
    const activeDaysCount=activeDaySet.size;
    const daysInMonth=new Date(_y,_m+1,0).getDate();
    const dayOfMonth=_isCur?now.getDate():daysInMonth;
    const monthOver=dayOfMonth>=daysInMonth;
    // the studio is closed on Mondays — "of N" should count open days, not calendar days
    let openDays=0;
    for(let d=1;d<=dayOfMonth;d++){ if(new Date(_y,_m,d).getDay()!==1) openDays++; }
    // stat card helper
    const stat=(label,val,sub)=>`<div style="background:rgba(255,255,255,0.78);border:1px solid rgba(255,255,255,0.9);border-radius:20px;corner-shape:squircle;padding:13px 14px;box-shadow:inset 0 1.5px 0 #fff,0 6px 16px -10px rgba(60,50,30,0.35)">
      <div style="font-size:10.5px;font-weight:600;color:var(--ah-grey);letter-spacing:.01em">${label}</div>
      <div style="font-size:21px;font-weight:500;color:var(--ah-ink);letter-spacing:-.02em;line-height:1.1;margin-top:4px">${val}</div>
      ${sub?`<div style="font-size:11px;color:var(--ah-grey-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sub}</div>`:''}
    </div>`;
    // monthly trend — 12-month bars (kept from before)
    const mc={}; all.forEach(r=>{const kk=`${r.dt.getFullYear()}-${String(r.dt.getMonth()+1).padStart(2,'0')}`;mc[kk]=(mc[kk]||0)+1;});
    const first=all.reduce((a,b)=>a.dt<b.dt?a:b).dt;
    const months=[]; let y=first.getFullYear(),m=first.getMonth();
    while(y<cy||(y===cy&&m<=cm)){ months.push({c:mc[`${y}-${String(m+1).padStart(2,'0')}`]||0,d:new Date(y,m,1)}); m++; if(m>11){m=0;y++;} }
    const show=months.slice(-12);
    const mx=Math.max(...show.map(x=>x.c),1);
    const trendBars=show.map(x=>{
      const full=x.c===mx&&x.c>0;
      const isCur=x.d.getFullYear()===cy&&x.d.getMonth()===cm;
      const mLbl=x.d.toLocaleDateString('en-US',{month:'short',year:'numeric'});
      const pop=`${mLbl} &middot; <b>${x.c} class${x.c===1?'':'es'}</b>`;
      return `<div onclick="ahPop(event,'${pop}')" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;gap:4px;cursor:pointer">
        ${full?`<div style="font-size:10px;font-weight:700;color:var(--ah-c-attend)">${x.c}</div>`:''}
        <div style="height:${x.c>0?Math.max(4,Math.round(x.c/mx*66)):2}px;align-self:stretch;margin:0 0.5px;border-radius:4px;background:color-mix(in srgb,var(--ah-c-attend) ${full?100:isCur?60:x.c>0?26:10}%,transparent)"></div>
        <div style="font-size:9px;color:${isCur?'var(--ah-ink)':'var(--ah-grey-2)'};font-weight:${isCur?700:500}">${x.d.toLocaleDateString('en-US',{month:'short'}).slice(0,1)}</div>
      </div>`;
    }).join('');
    const active=months.filter(x=>x.c>0).length;
    const sectionTitle=t=>`<div style="font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ah-grey);text-transform:uppercase;margin-bottom:12px">${t}</div>`;

    // ── vs last month — find the immediately preceding month in the series ──
    // delta colour lives ONLY on the small text below the headline; the comparison
    // circle stays neutral (periwinkle) so a quieter month never feels like an alarm.
    const _shownIdx=months.findIndex(mm=>mm.d.getFullYear()===_y&&mm.d.getMonth()===_m);
    const prevMonth=(_shownIdx>0?months[_shownIdx-1]:null);   // month right before the SHOWN month
    const prevCount=prevMonth?prevMonth.c:null;
    const prevLabel=prevMonth?prevMonth.d.toLocaleDateString('en-US',{month:'long'}):'';
    const hasPrev=prevMonth!=null && (prevCount>0 || count>0);
    let deltaLine='';
    if(hasPrev && prevCount!=null){
      const d=count-prevCount;
      if(d>0) deltaLine=`<span style="display:inline-flex;align-items:center;gap:3px;font-weight:600;color:var(--green,#34C759)">↑ ${d} more</span> than ${prevLabel}`;
      else if(d<0) deltaLine=`<span style="display:inline-flex;align-items:center;gap:3px;font-weight:600;color:var(--ah-c-attend)">↓ ${Math.abs(d)} fewer</span> than ${prevLabel}`;
      else deltaLine=`<span style="font-weight:600;color:var(--ah-grey)">Same as ${prevLabel}</span>`;
    }
    const capText = count===0 ? 'No classes yet — your next one starts the month'
      : !_isCur ? `Last active in ${shownMonthShort}`+(topWeek?` · ${weekOrd[topWeek[0]]||topWeek[0]} week was busiest`:'')
      : (deltaLine ? deltaLine + (topWeek?`. Most active in your ${weekOrd[topWeek[0]]||topWeek[0]} week.`:'.')
        : (topWeek?`Most active in your ${weekOrd[topWeek[0]]||topWeek[0]} week`:''));

    // ── before → after comparison block ──
    // The circle now takes a soft directional tint (up=green, down=warm, equal=grey)
    // so the trend reads at a glance instead of a flat periwinkle puck. Tints are gentle
    // — a quieter month is informative, never an alarm.
    const _dir = (count>(prevCount||0)) ? 'up' : (count<(prevCount||0)) ? 'down' : 'eq';
    const cmpGlyph = _dir==='up' ? AH_ICON.trend : _dir==='down' ? AH_ICON.trenddown : AH_ICON.steady;
    const _cmpColor = _dir==='up' ? 'var(--green,#34C759)' : _dir==='down' ? 'var(--ah-c-attend)' : 'var(--ah-grey)';
    const comparisonBlock = hasPrev ? `
      <div style="margin-top:24px">${sectionTitle('vs last month')}
        <div style="display:flex;align-items:center;gap:14px">
          <div style="flex:1;text-align:center">
            <div style="font-size:11px;color:var(--ah-grey-2);margin-bottom:4px">${prevLabel}</div>
            <div style="font-size:26px;font-weight:700;color:var(--ah-ink);letter-spacing:-.02em">${prevCount}</div>
            <div style="font-size:12px;color:var(--ah-grey);font-weight:500">classes</div>
          </div>
          <div style="width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,${_cmpColor} 15%,transparent)">
            <span style="width:19px;height:19px;display:flex;align-items:center;justify-content:center;color:${_cmpColor}">${cmpGlyph}</span>
          </div>
          <div style="flex:1;text-align:center">
            <div style="font-size:11px;color:var(--ah-grey-2);margin-bottom:4px">${shownMonthShort}</div>
            <div style="font-size:26px;font-weight:700;letter-spacing:-.02em;color:${_dir==='eq'?'var(--ah-grey)':_cmpColor}">${_dir==='eq'?'—':(count>prevCount?'+':'')+(count-prevCount)}</div>
            <div style="font-size:12px;color:var(--ah-grey);font-weight:500">${_dir==='eq'?'same':'classes'}</div>
          </div>
        </div>
      </div>` : '';

    // ── pace box (current-month only, while the month is still running) ──
    // periwinkle, calm. projects where the month is heading at the current rate.
    let paceBlock='';
    if(!monthOver && count>0){
      const projected=Math.max(Math.round(count/dayOfMonth*daysInMonth),count);
      const daysLeft=daysInMonth-dayOfMonth;
      const paceSpark=_ahTakeoffSpark({
        W:360,H:80,projected,dayFrac:dayOfMonth/daysInMonth,
        color:'rgba(23,24,28,0.72)',faint:'rgba(23,24,28,0.2)',
        w:2.2,halo:'rgba(23,24,28,0.08)',dot:'var(--ah-ink)',dotStroke:'rgba(255,255,255,0.9)'
      });
      const paceAbout='Your pace projects where this month lands if you keep your current rhythm. '
        +'It is your classes so far divided by days elapsed, then stretched across the full month. '
        +'It is a forecast, not a fixed goal.';
      paceBlock=`
      <div style="margin-top:18px;border-radius:26px;corner-shape:squircle;overflow:hidden;position:relative;
        background:rgba(255,255,255,0.78);border:1px solid rgba(255,255,255,0.85);
        box-shadow:inset 0 1.5px 0 rgba(255,255,255,0.9),0 10px 24px -14px rgba(60,50,30,0.28);padding:18px 20px 0">
        <button onclick="ahPop(event,'${paceAbout}')" aria-label="About pace" style="position:absolute;top:13px;right:13px;z-index:3;width:24px;height:24px;border-radius:50%;border:none;background:rgba(23,24,28,0.07);color:var(--ah-ink);font-size:13px;font-weight:700;font-style:italic;font-family:Georgia,serif;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">i</button>
        <div style="position:relative;z-index:2">
          <div style="font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ah-grey-2)">On pace for</div>
          <div style="display:flex;align-items:baseline;margin-top:4px">
            <span style="font-size:36px;font-weight:500;letter-spacing:-.03em;line-height:1;color:var(--ah-ink)">~${projected}</span>
            <span style="font-size:13px;font-weight:500;color:var(--ah-grey-2);margin-left:6px">classes this ${shownMonthShort}</span>
          </div>
          <div style="font-size:12px;color:var(--ah-grey-2);margin-top:4px">${daysLeft} ${daysLeft===1?'day':'days'} left · keep your current rhythm</div>
        </div>
        <div style="position:relative;height:80px;margin:8px -20px 0;width:calc(100% + 40px)">${paceSpark}</div>
      </div>`;
    }

    host.innerHTML=`
      <div style="display:flex;align-items:baseline;gap:8px">
        <span class="ah-sheet-range-num">${count}</span>
        <span class="ah-sheet-range-unit">${count===1?'class':'classes'} in ${shownMonthShort}</span>
      </div>
      <div class="ah-sheet-range-cap" style="margin-top:4px;line-height:1.45;color:var(--ah-ink)">${capText}</div>

      ${comparisonBlock}
      ${paceBlock}

      <div style="margin-top:22px">${sectionTitle(_isCur?'This month':shownMonthShort)}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          ${stat('Favorite class',favClass?favClass[1]+'×':'—',favClass?favClass[0]:'')}
          ${stat('Busiest week',topWeek?topWeek[1]:'—',topWeek?`your ${weekOrd[topWeek[0]]||topWeek[0]} week`:'')}
          ${stat('Active days',activeDaysCount||'—',`of ${openDays} open ${openDays===1?'day':'days'}`)}
          ${stat('Per week',count?(count/Math.max(1,Math.ceil(dayOfMonth/7))).toFixed(1):'—','average')}
        </div>
      </div>

      <div style="margin-top:24px">${sectionTitle('Activity calendar · '+shownMonthName)}
        ${_calHeatmap(all,_y,_m,'var(--ah-c-attend)',false)}
      </div>

      <div style="margin-top:24px">${sectionTitle('Monthly trend · last 12 months')}
        <div style="display:flex;align-items:flex-end;height:88px;gap:1px;padding-top:14px">${trendBars}</div>
      </div>`;
    host.insertAdjacentHTML('beforeend',
      `<div style="margin-top:16px;padding-top:12px;border-top:0.5px solid var(--ah-hair-2);font-size:12px;color:var(--ah-grey-2)">${active} of ${months.length} months active since you joined</div>`);
    meas.innerHTML='';
    return;
  }
}

/* ── Init on load ── */
window.addEventListener('load',()=>{
  showScr('ss');
  initLiff();
});
</script>

<script id="glassThemeCtl">
/* ── Appearance picker: hidden behind a tap on the greeting name in the profile header ── */
(function(){
  var KEY='glassTheme.v2';
  var root=document.documentElement;
  function cur(){return root.getAttribute('data-glass')||'dusk'}
  function apply(t){root.setAttribute('data-glass',t);try{localStorage.setItem(KEY,t)}catch(e){}}
  var saved='dusk';try{saved=localStorage.getItem(KEY)||'dusk'}catch(e){}
  apply(saved);
  function btn(k,label,grad){
    return '<button data-glass-pick="'+k+'" style="display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-family:var(--ah-font);padding:0">'
      +'<span style="width:40px;height:40px;border-radius:50%;background:'+grad+';display:block"></span>'
      +'<span style="font-size:10.5px;font-weight:600;color:var(--ah-ink)">'+label+'</span></button>';
  }
  function paint(){
    var pop=document.getElementById('glassPop');if(!pop)return;
    var c=cur();
    pop.querySelectorAll('[data-glass-pick]').forEach(function(b){
      var s=b.querySelector('span');
      s.style.boxShadow=b.getAttribute('data-glass-pick')===c
        ?'0 0 0 2.5px var(--ah-surface),0 0 0 4.5px var(--ah-ink)':'none';
    });
  }
  function show(anchor){
    var pop=document.createElement('div');
    pop.id='glassPop';
    pop.style.cssText='margin-top:12px;display:flex;gap:18px;align-items:center;background:var(--ah-surface);border-radius:24px;padding:14px 18px;box-shadow:var(--ah-shadow-soft);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);width:max-content;color:var(--ah-ink);text-shadow:none';
    pop.innerHTML='<span style="font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-right:2px;opacity:.55">Appearance</span>'
      +btn('dusk','Dusk','radial-gradient(90% 90% at 30% 22%,#4A709E 0%,#F5B23A 58%,#3A2C1A 100%)')
      +btn('ember','Ember','radial-gradient(90% 90% at 35% 30%,#F67E36 0%,#E08A56 60%,#A03C1A 100%)')
      +'<button data-glass-theme style="margin-left:8px;background:rgba(23,24,28,0.07);border:none;border-radius:999px;padding:9px 14px;font-family:var(--ah-font);font-size:11px;font-weight:600;color:var(--ah-ink);cursor:pointer;white-space:nowrap">Light / Dark</button>';
    if(anchor.closest&&anchor.closest('.w-topbar')){
      pop.style.position='fixed';pop.style.right='14px';pop.style.top='64px';pop.style.zIndex='9998';pop.style.marginTop='0';
      document.body.appendChild(pop);
    } else {
      (anchor.closest('.ah-greet')||anchor.parentNode).appendChild(pop);
    }
    paint();
  }
  window.__glassMenu=function(ev){
    ev.stopPropagation();
    var pop=document.getElementById('glassPop');
    if(pop){pop.remove();return;}
    show(ev.currentTarget||ev.target);
  };
  document.addEventListener('click',function(e){
    var th=e.target.closest('[data-glass-theme]');
    if(th){if(typeof toggleTheme==='function')toggleTheme();return;}
    var pick=e.target.closest('[data-glass-pick]');
    if(pick){apply(pick.getAttribute('data-glass-pick'));paint();return;}
    var pop=document.getElementById('glassPop');
    var name=e.target.closest('.ah-greet-name');
    if(name){if(pop){pop.remove();}else{show(name);}return;}
    if(pop&&!e.target.closest('#glassPop'))pop.remove();
  });
})();
</script>
