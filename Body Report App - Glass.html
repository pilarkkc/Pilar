/* ── PILL 3 → Classes you've taken: count per class name, swipeable 2-up pages ── */
function _pillHeatmap(name,rows){
  if(!rows.length) return '';
  const byName={};
  rows.forEach(r=>{ const k=(r.name||'Class').trim()||'Class'; byName[k]=(byName[k]||0)+1; });
  const sorted=Object.entries(byName).sort((a,b)=>b[1]-a[1]);
  const distinct=sorted.length;
  const card=([cls,n])=>
    `<div class="ah-cls-card" style="cursor:pointer" onclick="ahOpenSheet('cls',this.dataset.cls)" data-cls="${cls.replace(/"/g,'&quot;')}">
      <div class="ah-cls-card-n">${n}<span class="ah-cls-card-x"> ×</span></div>
      <div class="ah-cls-card-name" title="${cls.replace(/"/g,'&quot;')}">${cls}</div>
    </div>`;
  // group into pages of 2 (one row each); pages scroll-snap horizontally
  const pages=[];
  for(let i=0;i<sorted.length;i+=2){
    const pair=sorted.slice(i,i+2).map(card).join('');
    pages.push(`<div class="ah-cls-page">${pair}</div>`);
  }
  return `<section style="--cat:#E0851F;--cat-soft:rgba(224,133,31,0.13)">
    <div class="ah-sec">
      <span class="ah-sec-title">Classes you've taken</span>
      <span class="ah-sec-meta">${distinct} classes</span>
    </div>
    <div class="ah-cls-scroll">${pages.join('')}</div>
  </section>`;
}

/* Small behavioral read of the attendance pattern — one short line, evidence-based */
function _heatmapBehavior(rows,counts){
  const n=rows.length;
  if(n<4) return '';
  // day-of-week concentration
  const dow={}; rows.forEach(r=>{const d=r.dt.getDay();dow[d]=(dow[d]||0)+1;});
  const topDow=Object.entries(dow).sort((a,b)=>b[1]-a[1])[0];
  const dowPct=Math.round(topDow[1]/n*100);
  // weekday vs weekend
  const wend=rows.filter(r=>{const d=r.dt.getDay();return d===0||d===6;}).length;
  const wendPct=Math.round(wend/n*100);
  // active-week ratio (weeks with ≥1 class vs total weeks since first)
  const series=_weeklySeries(rows);
  const activeWks=series.filter(w=>w.count>0).length;
  const activePct=series.length?Math.round(activeWks/series.length*100):0;
  // multi-class days (came twice+ same day)
  const doubles=Object.values(counts).filter(c=>c>=2).length;

  const EN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  // priority: most distinctive read first — quiet declarative, no emoji, numbers woven in
  if(wendPct>=55) return `You're a weekend person — ${wendPct}% of your classes land on Sat–Sun`;
  if(wendPct<=8 && n>=8) return `Strictly weekdays — you almost never touch a weekend class`;
  if(doubles>=2) return `${doubles} days where you took two classes in one day`;
  if(dowPct>=50) return `${EN[topDow[0]]} is your day — ${dowPct}% of all visits land on it`;
  if(activePct>=80 && series.length>=6) return `Remarkably consistent — active ${activePct}% of all weeks since you started`;
  if(activePct<=45 && series.length>=6) return `You train in waves — active ${activePct}% of weeks overall`;
  if(dowPct>=38) return `You tend to come on ${EN[topDow[0]]}s — ${dowPct}% of visits`;
  return `${activeWks} of ${series.length} weeks active since you started`;
}

/* ── PILL 4 → Highlights (horizontal scroll, monoline icons) ── */
/* ── Highlight computation (auto-pick, 16 candidates) ── */
function _computeHighlights(name,rows){
  const out=[];
  if(!rows.length) return out;
  const now=new Date();
  const series=_weeklySeries(rows);
  const total=rows.length;

  const monthKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  const thisMonthK=monthKey(now);
  const lastMonthD=new Date(now.getFullYear(),now.getMonth()-1,1);
  const lastMonthK=monthKey(lastMonthD);
  const monthRows={}; rows.forEach(r=>{const k=monthKey(r.dt);(monthRows[k]=monthRows[k]||[]).push(r);});
  const thisMonth=monthRows[thisMonthK]||[];
  const lastMonth=monthRows[lastMonthK]||[];

  const bestWk=series.length?Math.max(...series.map(s=>s.count)):0;
  const lastWkCount=series.length?series[series.length-1].count:0;
  if(bestWk>=3) out.push({pri:bestWk>=5?8:6,recent:lastWkCount===bestWk&&bestWk>=3,icon:'flame',color:'#FF9500',big:`${bestWk}`,unit:'classes',title:'Best week',sub:`Your busiest week — ${bestWk} classes`});

  const milestones=[10,25,50,75,100,150,200,300,500];
  const lastMile=milestones.filter(m=>total>=m).pop();
  if(lastMile) out.push({pri:total>=100?8:total>=50?6:4,icon:'medal',color:'#F5C842',big:`${total}`,unit:'classes',title:'Total classes',sub:`Past ${lastMile} classes`});

  const allMembers=[...new Set(allBookings.filter(b=>b.booking_status==='Booked').map(b=>b.contact_name).filter(Boolean))];
  if(allMembers.length>=5){
    const memberTotals=allMembers.map(m=>({m,n:allBookings.filter(b=>b.contact_name===m&&b.booking_status==='Booked').length}));
    memberTotals.sort((a,b)=>b.n-a.n);
    const rank=memberTotals.findIndex(x=>x.m===name)+1;
    // Top 3 absolute, OR top 10% when the community is large enough for a percentile to mean something
    const topCut=allMembers.length>=20?Math.ceil(allMembers.length*0.1):3;
    if(rank>0 && rank<=topCut){
      const pct=Math.max(1,Math.round((rank/allMembers.length)*100));
      out.push({pri:rank<=3?10:6,icon:'rank',color:'#BF5AF2',big:`#${rank}`,unit:'',title:'Among the regulars',
        sub:rank<=3?`#${rank} most active`:`Top ${pct}% most active`});
    }
  }

  const streak=calcStreak(name);
  if(streak>=3) out.push({pri:streak>=8?9:6,recent:true,icon:'bolt',color:'#F5C842',big:`${streak}`,unit:'weeks',title:'Current streak',sub:`${streak} weeks in a row`});

  const morning=rows.filter(r=>r.dt.getHours()<10).length;
  if(morning>=5&&morning/total>=0.4) out.push({pri:5,dim:'time',icon:'sun',color:'#FF9500',big:`${morning}`,unit:'classes',title:'Mornings',sub:`${Math.round(morning/total*100)}% of classes before 10am`});

  const monthCounts=Object.entries(monthRows).map(([k,v])=>({k,n:v.length}));
  const peakMonth=monthCounts.sort((a,b)=>b.n-a.n)[0];
  if(peakMonth&&peakMonth.n>=6){
    const pd=new Date(peakMonth.k+'-01');
    const sameYear=pd.getFullYear()===now.getFullYear();
    const md=pd.toLocaleDateString('en-US',{month:'long',...(sameYear?{}:{year:'numeric'})});
    out.push({pri:peakMonth.k===thisMonthK?7:4,icon:'peak',color:'#FF453A',big:`${peakMonth.n}`,unit:'classes',title:'Busiest month',sub:`${md}`});
  }

  if(lastMonth.length>=2&&thisMonth.length>0){
    const diff=thisMonth.length-lastMonth.length;
    if(diff>0) out.push({pri:6,recent:true,icon:'trend',color:'#1BE3A0',big:`+${diff}`,unit:'classes',title:'More than last month',sub:`${diff} more classes than last month`});
  }

  const typeCounts={}; rows.forEach(r=>typeCounts[r.type]=(typeCounts[r.type]||0)+1);
  const topType=Object.entries(typeCounts).sort((a,b)=>b[1]-a[1])[0];
  if(topType&&topType[1]/total>=0.5&&total>=8){
    out.push({pri:5,icon:'target',color:COLORS[topType[0]]||'#00CAFF',big:`${Math.round(topType[1]/total*100)}%`,unit:'',title:`Mostly ${topType[0]}`,sub:`${topType[0]} is most of your classes`});
  }

  const distinctTypes=Object.keys(typeCounts).length;
  if(distinctTypes>=4) out.push({pri:4,icon:'layers',color:'#FF6B9D',big:`${distinctTypes}`,unit:'types',title:'All formats',sub:`Tried all ${distinctTypes} class types`});

  const activeWeeks=series.filter(s=>s.count>0).length;
  const totalWeeks=series.length;
  if(totalWeeks>=6&&activeWeeks/totalWeeks>=0.75){
    out.push({pri:6,icon:'crown',color:'#F5C842',big:`${Math.round(activeWeeks/totalWeeks*100)}%`,unit:'',title:'Steady',sub:`Showed up ${activeWeeks} of ${totalWeeks} weeks`});
  }

  const dowCounts={}; const dowNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  rows.forEach(r=>dowCounts[r.dt.getDay()]=(dowCounts[r.dt.getDay()]||0)+1);
  const favDow=Object.entries(dowCounts).sort((a,b)=>b[1]-a[1])[0];
  if(favDow&&favDow[1]>=5){
    out.push({pri:3,dim:'day',icon:'calendar',color:'#00CAFF',big:dowNames[favDow[0]],unit:'',title:'Your day',sub:`${dowNames[favDow[0]]}, most often (${favDow[1]}x)`});
  }

  const instrCounts={}; rows.forEach(r=>{if(r.instructor)instrCounts[r.instructor]=(instrCounts[r.instructor]||0)+1;});
  const topInstr=Object.entries(instrCounts).sort((a,b)=>b[1]-a[1])[0];
  if(topInstr&&topInstr[1]>=6&&topInstr[1]/total>=0.4){
    const inm=topInstr[0].replace(/^\s*(instructor|coach|ครู)\s+/i,'').trim();
    out.push({pri:5,icon:'handshake',color:'#1BE3A0',big:`${topInstr[1]}`,unit:'classes',title:`Mostly with ${inm}`,sub:`${topInstr[1]} classes together`});
  }

  if(thisMonth.length>=8){
    out.push({pri:8,recent:true,icon:'check',color:'#1BE3A0',big:`${thisMonth.length}`,unit:'classes',title:'Strong month',sub:`${thisMonth.length} classes already this month`});
  }

  let maxGap=0,gapEnd=null;
  for(let i=1;i<series.length;i++){
    if(series[i].count>0){
      let g=0,j=i-1; while(j>=0&&series[j].count===0){g++;j--;}
      if(g>=3&&g>maxGap){maxGap=g;gapEnd=series[i].wk;}
    }
  }
  if(gapEnd&&(now-new Date(parseInt(gapEnd)))/(86400000*7)<=8){
    out.push({pri:7,recent:true,icon:'rocket',color:'#FF6B9D',big:`${maxGap}w`,unit:'',title:'Back at it',sub:`After ${maxGap} weeks away`});
  }

  const stats=process(allBookings.filter(b=>b.contact_name===name&&b.booking_status==='Booked'),null);
  if(stats&&stats.calories>=5000){
    const kRound=Math.floor(stats.calories/1000);
    out.push({pri:4,icon:'battery',color:'#FF9500',big:`${kRound}k`,unit:'kcal',title:'Energy',sub:`Over ${kRound},000 kcal in total`});
  }

  // ── NEW CANDIDATES ──

  // 1 · WEEKEND WARRIOR — most classes fall on Sat/Sun
  const wendN=rows.filter(r=>{const d=r.dt.getDay();return d===0||d===6;}).length;
  if(total>=8 && wendN/total>=0.5){
    out.push({pri:5,dim:'day',icon:'sun',color:'#00CAFF',big:`${Math.round(wendN/total*100)}%`,unit:'',title:'Weekends',sub:`${wendN} classes fall on weekends`});
  }

  // 2 · NIGHT MOVER — evening-dominant (after 5pm)
  const eveN=rows.filter(r=>r.dt.getHours()>=17).length;
  if(total>=8 && eveN/total>=0.5){
    out.push({pri:4,dim:'time',icon:'spark',color:'#BF5AF2',big:`${Math.round(eveN/total*100)}%`,unit:'',title:'Evenings',sub:`${eveN} classes start after 5pm`});
  }

  // 3 · HOURS LIFETIME — total training time crosses a round figure
  const hrsAll=Math.round(rows.reduce((a,r)=>a+r.mins,0)/60);
  if(hrsAll>=20){
    const hMile=[20,50,100,200,300,500,750,1000].filter(m=>hrsAll>=m).pop();
    out.push({pri:hrsAll>=100?7:4,icon:'history',color:'#1BE3A0',big:`${hrsAll}`,unit:'hrs',title:'Hours trained',sub:`Over ${hMile} hours logged`});
  }

  // 4 · MONTHS STRONG — true tenure: months elapsed since first class
  const firstDt=rows[0]?rows[0].dt:null;
  if(firstDt){
    const tenure=Math.max(1,(now.getFullYear()-firstDt.getFullYear())*12+(now.getMonth()-firstDt.getMonth()));
    if(tenure>=3){
      out.push({pri:tenure>=12?6:3,icon:'leaf',color:'#1BE3A0',big:`${tenure}`,unit:'months',title:'With Pilar',sub:`${tenure} months with Pilar`});
    }
  }

  // 5 · BACK-TO-BACK — most classes in consecutive days (burst record)
  (()=>{
    const days=[...new Set(rows.map(r=>{const d=new Date(r.dt);d.setHours(0,0,0,0);return d.getTime();}))].sort((a,b)=>a-b);
    let best=1,cur=1;
    for(let i=1;i<days.length;i++){
      if((days[i]-days[i-1])/86400000===1){cur++;best=Math.max(best,cur);}else cur=1;
    }
    if(best>=3) out.push({pri:5,icon:'trophy',color:'#F5C842',big:`${best}`,unit:'days',title:'Consecutive days',sub:`${best} days in a row`});
  })();

  // 6 · DEDICATED HOUR — favourite time-of-day slot is highly concentrated
  (()=>{
    if(total<10) return;
    const slots={}; rows.forEach(r=>{const h=r.dt.getHours();const s=h<9?'early morning':h<12?'late morning':h<15?'midday':h<18?'afternoon':'evening';slots[s]=(slots[s]||0)+1;});
    const top=Object.entries(slots).sort((a,b)=>b[1]-a[1])[0];
    const pct=Math.round(top[1]/total*100);
    if(pct>=45) out.push({pri:4,dim:'time',icon:'clock',color:'#FF9500',big:`${pct}%`,unit:'',title:'Your usual time',sub:`Mostly trains in the ${top[0]}`});
  })();

  // ── RECENT-MOMENT CANDIDATES (fresh, this-period feeling) ──
  const _norm=s=>(s||'').toLowerCase().replace(/\s+/g,' ').trim();
  const sortedByDate=[...rows].sort((a,b)=>a.dt-b.dt);
  const latest=sortedByDate[sortedByDate.length-1];
  const daysSince=latest?Math.floor((now-latest.dt)/86400000):999;

  // 1 · First-timer — the most recent class is a name never seen before
  if(latest&&daysSince<=14&&latest.name){
    const lname=_norm(latest.name);
    const seenBefore=sortedByDate.slice(0,-1).some(r=>_norm(r.name)===lname);
    if(!seenBefore){
      out.push({pri:7,recent:true,icon:'spark',color:'#BF5AF2',big:'New',unit:'',title:'First time',sub:`Tried ${latest.name} for the first time`});
    }
  }

  // 2 · On a roll with X — most recent classes repeat the same name back-to-back
  if(latest&&daysSince<=30){
    const lname=_norm(latest.name);
    let run=0;
    for(let i=sortedByDate.length-1;i>=0;i--){ if(_norm(sortedByDate[i].name)===lname) run++; else break; }
    if(run>=3){
      out.push({pri:6,recent:true,icon:'flame',color:'#FF9500',big:`${run}`,unit:'in a row',title:'On a roll',sub:`${latest.name} ${run} times in a row`});
    }
  }

  // 3 · Variety — many distinct class names in the last 14 days
  {
    const cutoff=new Date(now); cutoff.setDate(now.getDate()-14);
    const recentNames=new Set(rows.filter(r=>r.dt>=cutoff).map(r=>_norm(r.name)).filter(Boolean));
    if(recentNames.size>=4){
      out.push({pri:5,recent:true,icon:'layers',color:'#00CAFF',big:`${recentNames.size}`,unit:'kinds',title:'Mixing it up',sub:`${recentNames.size} different classes in 2 weeks`});
    }
  }

  return out.sort((a,b)=>b.pri-a.pri);
}


function _pillHighlights(name,rows){
  const all=_computeHighlights(name,rows);
  if(!all.length) return '';
  // Drop near-duplicate dimensions (e.g. multiple time-of-day cards) — keep the strongest of each.
  const seenDim={}; const deduped=[];
  for(const h of all){
    if(h.dim){ if(seenDim[h.dim]) continue; seenDim[h.dim]=true; }
    deduped.push(h);
  }
  // Pin the freshest moment first (recent), then the strongest remaining achievement;
  // rotate the rest daily so repeat visits feel fresh.
  const pinned=[];
  const firstRecent=deduped.find(h=>h.recent);
  if(firstRecent) pinned.push(firstRecent);
  for(const h of deduped){
    if(pinned.includes(h)) continue;
    pinned.push(h);
    if(pinned.length>=2) break;
  }
  const pool=deduped.filter(h=>!pinned.includes(h));
  let rotated=[];
  if(pool.length){
    // deterministic daily rotation: same within a day, shifts across days
    const dayIdx=Math.floor(Date.now()/86400000);
    const seed=(dayIdx+rows.length)%pool.length;
    for(let i=0;i<pool.length;i++) rotated.push(pool[(seed+i)%pool.length]);
  }
  const hl=[...pinned,...rotated].slice(0,5);
  window._shownHighlights=hl;  // stash so the share screen can render the tapped one
  const shareIco=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="9 7 17 7 17 15"/></svg>`;
  const cards=hl.map((h,i)=>`
    <div class="ah-hl">
      <button class="ah-hl-share" onclick="shareHighlight(${i})" aria-label="Share">${shareIco}</button>
      <div class="ah-chrome" style="margin-bottom:var(--ah-s2)">
        <div class="ah-chrome-tile">${AH_ICON[_iconKey(h.icon)]}</div>
        <span class="ah-chrome-name" style="font-size:var(--ah-f-foot)">${_titleCase(h.title)}</span>
      </div>
      <div class="ah-hl-num">${h.big}${h.unit?`<span class="ah-hl-num-unit">${h.unit}</span>`:''}</div>
      <div class="ah-hl-sub">${h.sub}</div>
    </div>`).join('');
  return `<section style="--cat:var(--ah-c-high);--cat-soft:var(--ah-c-high-soft)">
    <div class="ah-sec"><span class="ah-sec-title">Highlights</span><span class="ah-sec-meta">${hl.length} this month</span></div>
    <div class="ah-hl-wrap"><div class="ah-hl-scroll">${cards}</div></div>
  </section>`;
}
function _titleCase(s){return s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());}

/* ── PILL 5 → Class breakdown (single-accent tonal bars) ── */
function _pillClassBreakdown(name,rows){
  if(!rows.length) return '';
  const now=new Date();
  const cutoff=new Date(now); cutoff.setDate(now.getDate()-30);
  const last30=rows.filter(r=>r.dt>=cutoff);
  const src=last30.length>=2?last30:rows;
  const label=last30.length>=2?'Last 30 days':'All time';
  const counts={}; src.forEach(r=>counts[r.type]=(counts[r.type]||0)+1);
  const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const max=sorted[0]?sorted[0][1]:1;
  const total=src.length;
  const moreN=Math.max(0,sorted.length-3);
  // dynamic icon: dominant format → focused (target), spread → varied (shapes)
  const topShare=sorted.length?sorted[0][1]/total:0;
  const typeIcon = topShare>=0.5 ? AH_ICON.target2 : AH_ICON.shapes;
  // Podium layout: reorder top-3 as [2nd, 1st, 3rd] — classic podium
  const top3=sorted.slice(0,3);
  const podium=top3.length===1?[null,top3[0],null]
    :top3.length===2?[top3[1],top3[0],null]
    :[top3[1],top3[0],top3[2]];
  // bar heights: 1st=100%, 2nd=68%, 3rd=46% of max visual area
  const BAR_H=58;
  const heightPct=[68,100,46];
  // single-hue tonal ladder (Apple pattern): #1 full accent, others stepped down — no rainbow
  const toneBySlot=[58,100,38];   // 2nd, 1st, 3rd
  const cols=podium.map((entry,slot)=>{
    if(!entry) return `<div style="flex:1"></div>`;
    const [t,n]=entry;
    const hPx=Math.round(heightPct[slot]/100*BAR_H);
    const isFirst=slot===1;
    const op=[0.5,0.92,0.35][slot];
    const label=t.length>9?t.slice(0,8)+'…':t;
    // count above the bar only — one number per format, no duplicate rank chip
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0">
      <span style="font-size:13px;font-weight:800;color:var(--ah-ink);line-height:1;letter-spacing:-.02em">${n}</span>
      <div style="position:relative;width:100%;height:${hPx}px;border-radius:${isFirst?'12px':'10px'};box-sizing:border-box;
        background:rgba(255,255,255,${op});border:1px solid rgba(255,255,255,${Math.min(op+0.25,1)});
        box-shadow:inset 0 1.5px 0 rgba(255,255,255,0.9)${isFirst?',0 4px 10px -4px rgba(60,50,30,0.3)':''}"></div>
      <span style="font-size:9px;font-weight:600;color:var(--ah-grey);text-align:center;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${label}</span>
    </div>`;
  }).join('');
  return `<section style="--cat:var(--ah-c-class);--cat-soft:var(--ah-c-class-soft)">
    <div class="ah-sq" onclick="ahOpenSheet('types')">
      <div class="ah-chrome">
        <div class="ah-chrome-tile">${typeIcon}</div>
        <span class="ah-chrome-name">By type</span>
        <span class="ah-chrome-meta"></span>
      </div>
      <div class="ah-sq-body" style="justify-content:flex-end">
        <div style="display:flex;align-items:flex-end;gap:7px;width:100%;height:${BAR_H+38}px;padding-top:8px">${cols}</div>
        ${moreN>0?`<div style="font-size:10px;color:var(--ah-grey-2);font-weight:600;margin-top:6px">+${moreN} more</div>`:''}
      </div>
    </div>
  </section>`;
}

/* Longest weekly streak ever (consecutive weeks with ≥1 class) */
function _streakHeadline(streak, longest){
  // ring shows the number; headline speaks to the moment, single line only.
  if(streak<=0)            return 'Your streak starts here';
  if(longest && streak>=longest) return 'Best run yet';   // new personal record
  if(streak<=2)            return 'The chain begins';
  if(streak<=5)            return 'Building the habit';
  if(streak<=9)            return 'Going strong';
  return 'Unstoppable';
}
function _longestStreak(rows){
  if(!rows.length) return 0;
  const wks=[...new Set(rows.map(r=>_weekKey(r.dt)))].sort((a,b)=>a-b);
  const WK=86400000*7; let best=1,cur=1;
  for(let i=1;i<wks.length;i++){
    if(wks[i]-wks[i-1]===WK){cur++;best=Math.max(best,cur);}else cur=1;
  }
  return best;
}

/* ════════════════════════════════════════════════════════════
   INSIGHT ENGINE — turns existing data into behavioral narratives.
   No new metrics. Each insight: {eligible, score, build:{label,text}}.
   Picks the 2-3 strongest, distinct insights per member.
   Tone: Thai + English, social-caption feel. Numbers do the talking.
   ════════════════════════════════════════════════════════════ */
const TH_DOW=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];

function _computeInsights(rows){
  const n=rows.length;
  if(!n) return [];
  const out=[];

  // ── shared signals (all from existing data) ──
  const hours=rows.map(r=>r.dt.getHours()).filter(h=>!isNaN(h));
  const dowCounts={}; rows.forEach(r=>{const d=r.dt.getDay();dowCounts[d]=(dowCounts[d]||0)+1;});
  const tc={}; rows.forEach(r=>tc[r.type]=(tc[r.type]||0)+1);
  const strainByType={}; rows.forEach(r=>{strainByType[r.type]=(strainByType[r.type]||0)+getStrainWeight(r.name)*(r.mins/60);});
  const slot=h=>h<12?'เช้า':h<17?'กลางวัน':'เย็น';

  // ── A1 · THE ANCHOR DAY — one weekday quietly dominates ──
  (()=>{
    const top=Object.entries(dowCounts).sort((a,b)=>b[1]-a[1])[0];
    if(!top) return;
    const pct=Math.round(top[1]/n*100);
    if(n>=12 && pct>=32){
      out.push({key:'anchor',score:pct+10,label:'วันประจำของคุณ',
        text:`วัน${TH_DOW[top[0]]}คือวันของคุณ <b>${pct}%</b> ของทุกคลาสตกวันนี้ ทั้งที่คุณอาจไม่เคยตั้งใจ ร่างกายเลือกจังหวะเองแล้ว`});
    }
  })();

  // ── A2 · THE DRIFT — preferred time-of-day shifted across the timeline ──
  (()=>{
    if(n<14) return;
    const half=Math.floor(n/2);
    const early=rows.slice(0,half), late=rows.slice(half);
    const eveP=arr=>Math.round(arr.filter(r=>r.dt.getHours()>=17).length/arr.length*100);
    const mornP=arr=>Math.round(arr.filter(r=>r.dt.getHours()<12).length/arr.length*100);
    const e0=eveP(early),e1=eveP(late),m0=mornP(early),m1=mornP(late);
    if(e1-e0>=25 && m0>=40){
      out.push({key:'drift',score:(e1-e0)+15,label:'การเปลี่ยนที่เงียบงัน',
        text:`คุณเคยเป็นสายเช้า ช่วงแรกมาเย็นแค่ <b>${e0}%</b> ตอนนี้ <b>${e1}%</b> ชีวิตเปลี่ยน เวลาเทรนก็ขยับตามแบบไม่รู้ตัว`});
    } else if(e1-e0>=25){
      out.push({key:'drift',score:(e1-e0)+12,label:'การเปลี่ยนที่เงียบงัน',
        text:`เวลาเทรนของคุณเลื่อนมาช่วงเย็นชัดขึ้น จาก <b>${e0}%</b> เป็น <b>${e1}%</b> ของคลาสช่วงหลัง บางอย่างในตารางชีวิตเปลี่ยนไป`});
    } else if(m1-m0>=25 && e0>=40){
      out.push({key:'drift',score:(m1-m0)+15,label:'การเปลี่ยนที่เงียบงัน',
        text:`เมื่อก่อนคุณมาเย็น ตอนนี้ขยับมาเช้าขึ้นชัดเจน <b>${m1}%</b> ของคลาสช่วงหลังอยู่ก่อนเที่ยง คุณกลายเป็นคนเช้าโดยไม่ทันสังเกต`});
    } else if(m1-m0>=25){
      out.push({key:'drift',score:(m1-m0)+12,label:'การเปลี่ยนที่เงียบงัน',
        text:`เวลาเทรนของคุณเลื่อนมาช่วงเช้าชัดขึ้น จาก <b>${m0}%</b> เป็น <b>${m1}%</b> ของคลาสช่วงหลัง`});
    }
  })();

  // ── A3 · LOYALTY SIGNATURE — most of your hardest classes are with one coach ──
  (()=>{
    const withI=rows.filter(r=>r.instructor && !/^(instructor|coach|ครู)$/i.test(r.instructor.trim()));
    if(withI.length<8) return;
    const strainByI={}; withI.forEach(r=>{const k=r.instructor;strainByI[k]=(strainByI[k]||0)+getStrainWeight(r.name)*(r.mins/60);});
    const totalStrain=Object.values(strainByI).reduce((a,b)=>a+b,0);
    const top=Object.entries(strainByI).sort((a,b)=>b[1]-a[1])[0];
    if(!top||!totalStrain) return;
    const pct=Math.round(top[1]/totalStrain*100);
    const nm=top[0].replace(/^\s*(instructor|coach|ครู)\s+/i,'').trim();
    if(pct>=50){
      out.push({key:'loyalty',score:pct,label:'แรงของคุณ อยู่กับโค้ชคนเดียว',
        text:`<b>${pct}%</b> ของแรงที่คุณทุ่มไปทั้งหมด อยู่ในคลาสกับ${nm} ความไว้ใจแบบนี้ไม่ได้สร้างกันง่ายๆ`});
    }
  })();

  // ── B1 · THE REAL FAVORITE — most-attended ≠ where you push hardest ──
  (()=>{
    if(n<10) return;
    const favCount=Object.entries(tc).sort((a,b)=>b[1]-a[1])[0];
    const favStrain=Object.entries(strainByType).sort((a,b)=>b[1]-a[1])[0];
    if(!favCount||!favStrain) return;
    if(favCount[0]!==favStrain[0]){
      out.push({key:'realfav',score:42,label:'นิสัย กับ ความตั้งใจ',
        text:`คุณมา <b>${favCount[0]}</b> บ่อยที่สุด แต่ที่ที่คุณเทแรงจริงคือ <b>${favStrain[0]}</b> อันนึงคือนิสัย อีกอันคือความตั้งใจ`});
    }
  })();

  // ── B2 · THE RHYTHM — you train in clusters, not evenly ──
  (()=>{
    if(n<12) return;
    const days=[...new Set(rows.map(r=>{const d=new Date(r.dt);d.setHours(0,0,0,0);return d.getTime();}))].sort((a,b)=>a-b);
    if(days.length<6) return;
    const gaps=[]; for(let i=1;i<days.length;i++) gaps.push(Math.round((days[i]-days[i-1])/86400000));
    const backToBack=gaps.filter(g=>g<=1).length;
    const clusterPct=Math.round(backToBack/gaps.length*100);
    if(clusterPct>=40){
      out.push({key:'rhythm',score:clusterPct-5,label:'จังหวะของคุณ',
        text:`คุณไม่ใช่สาย “มาเรื่อยๆ ทุกวัน” <b>${clusterPct}%</b> ของคลาสมาติดกันเป็นชุดแล้วพัก เทรนเป็น burst คือจังหวะธรรมชาติของคุณ`});
    }
  })();

  // ── B3 · THE CONCENTRATION — narrow focus vs wide explorer ──
  (()=>{
    if(n<10) return;
    const types=Object.keys(tc).length;
    const topPct=Math.round(Math.max(...Object.values(tc))/n*100);
    if(types>=4 && topPct<=40){
      out.push({key:'explorer',score:38,label:'นักสำรวจ',
        text:`คุณลองมาแล้ว <b>${types}</b> ประเภท ไม่มีอันไหนเกิน <b>${topPct}%</b> คุณไม่ได้มาออกกำลังกาย คุณมาสำรวจว่าร่างกายชอบอะไร`});
    }
  })();

  // ── C1 · THE OPENING MOVE — your very first class (works from day 1) ──
  (()=>{
    if(n<1 || n>=10) return;  // only while still early
    const firstName=(rows[0].name||rows[0].type||'').trim();
    if(!firstName) return;
    out.push({key:'opening',score:20,label:'หมัดแรกของคุณ',
      text:`คลาสแรกที่คุณเลือกคือ <b>${firstName}</b> จุดเริ่มต้นบอกอะไรบางอย่างเสมอ ไว้ดูกันว่าเส้นทางจะพาไปไหนต่อ`});
  })();

  // ── C2 · THE FIRST PATTERN — honest early lean (4-9 classes) ──
  (()=>{
    if(n<4 || n>=10) return;
    const eve=hours.filter(h=>h>=17).length, morn=hours.filter(h=>h<12).length;
    let lean=null,cnt=0;
    if(eve>morn && eve>=Math.ceil(n*0.5)){lean='ช่วงเย็น';cnt=eve;}
    else if(morn>eve && morn>=Math.ceil(n*0.5)){lean='ช่วงเช้า';cnt=morn;}
    if(lean){
      out.push({key:'firstpattern',score:18,label:'สัญญาณแรกเริ่ม',
        text:`ยังเร็วเกินจะสรุป แต่ตอนนี้คุณเอียงไปทาง<b>${lean}</b> <b>${cnt}</b> จาก <b>${n}</b> คลาสแรก เงาของนิสัยกำลังก่อตัว`});
    }
  })();

  // ── C3 · MOMENTUM — for newer members with any streak (safety net) ──
  (()=>{
    if(n<3 || n>=12) return;
    const streak=_longestStreak(rows);
    if(streak>=2 && !out.length){
      out.push({key:'momentum',score:12,label:'โมเมนตัมกำลังก่อตัว',
        text:`<b>${streak}</b> สัปดาห์ติดที่คุณกลับมา ช่วงเริ่มต้นคือช่วงที่ยากที่สุด และคุณผ่านมันมาได้แล้ว`});
    }
  })();

  // ── D0a · THE STEADY HAND — consistency-driven (core member, any behaviour) ──
  (()=>{
    if(n<12) return;
    const days=[...new Set(rows.map(r=>{const d=new Date(r.dt);d.setHours(0,0,0,0);return d.getTime();}))].sort((a,b)=>a-b);
    const span=Math.max(1,Math.round((rows[n-1].dt-rows[0].dt)/86400000));
    const wks=Math.max(1,Math.round(span/7));
    const perWk=(n/wks).toFixed(1);
    if(perWk>=1.2){
      out.push({key:'steady',score:30,label:'มือที่นิ่ง',
        text:`คุณมาเฉลี่ย <b>${perWk}</b> คลาสต่อสัปดาห์ แทบไม่เคยพลาด ความสม่ำเสมอแบบนี้คือสิ่งที่หายากที่สุด คนส่วนใหญ่ทำไม่ได้`});
    }
  })();

  // ── D0b · QUIET MILESTONE — cumulative-driven (core member, any behaviour) ──
  (()=>{
    if(n<10) return;
    const totalHrs=Math.round(rows.reduce((a,r)=>a+(r.mins||50)/60,0));
    const milestone=n>=100?100:n>=75?75:n>=50?50:n>=30?30:n>=20?20:10;
    out.push({key:'milestone',score:24,label:'หมุดหมายที่เงียบงัน',
      text:`คุณผ่านคลาสที่ <b>${milestone}</b> ไปแล้ว สะสมเวลาบนเบาะรวม <b>${totalHrs}</b> ชั่วโมง ที่คุณเลือกลงทุนกับตัวเอง`});
  })();

  // ── D1 · SIGNATURE CLASS — established-member safety net (always eligible at scale) ──
  (()=>{
    if(n<10) return;
    const fav=Object.entries(tc).sort((a,b)=>b[1]-a[1])[0];
    if(!fav) return;
    const pct=Math.round(fav[1]/n*100);
    const span=Math.max(1,Math.round((rows[n-1].dt-rows[0].dt)/86400000));
    const wks=Math.max(1,Math.round(span/7));
    const perWk=(n/wks).toFixed(1);
    out.push({key:'signature',score:8,label:'ลายเซ็นของคุณ',
      text:`<b>${perWk}</b> คลาสต่อสัปดาห์ ตลอด <b>${wks}</b> สัปดาห์ และ <b>${fav[0]}</b> คือคลาสที่คุณกลับมาหาเสมอ (<b>${pct}%</b>)`});
  })();

  // pick top 3 distinct, sorted by score; rotate slightly by total to stay fresh
  out.sort((a,b)=>b.score-a.score);
  const seed=n%out.length;
  const picked=out.slice(0,3);
  // gentle rotation so repeat opens vary when scores are close
  if(out.length>3 && seed){ picked[picked.length-1]=out[Math.min(3+(seed-1),out.length-1)]; }
  return picked;
}

/* ════════════════════════════════════════════════════════════
   WRAPPED HERO — Spotify-style swipe slides
   Pool of slides → daily-seeded shuffle → pick 4 (Hours always first).
   Gradient palettes rotate per slide. Each slide shares via _shareHL.
   ════════════════════════════════════════════════════════════ */
const _MET={Reformer:4.0,Private:3.5,Barre:4.5,Yoga:2.5,Pilates:3.0};
const _AVG=65,_KCAL=1.15;
const TH_MONTH_LONG=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

/* deterministic per-day seed (mulberry32) → same set all day, new set next day */
function _wrSeededShuffle(arr,seedNum){
  let s=seedNum>>>0;
  const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* Gradient palettes (Wrapped-style, bold, rotate per slide) */
const _WR_GRAD=[
  'linear-gradient(135deg,#3E5C7A 0%,#5C4A32 55%,#7A4E28 100%)',   // dusk glass
  'linear-gradient(135deg,#E0854E 0%,#C2622F 55%,#8F3E1C 100%)',   // ember
  'linear-gradient(135deg,#2E3A48 0%,#1C222C 60%,#14181F 100%)',   // slate
  'linear-gradient(135deg,#8A6A3C 0%,#6A4A26 55%,#46301A 100%)',   // bronze
  'linear-gradient(135deg,#4A708E 0%,#33506A 55%,#22364A 100%)',   // steel
];

const _WR_SHARE_SVG=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="9 7 17 7 17 15"/></svg>`;

/* Build the candidate slide pool from member rows. Each entry:
   {id, eligible, build()->{eyebrow,bigHTML,headline,say, share:{big,unit,title,sub,color}}} */
function _wrPool(rows){
  const n=rows.length;
  const totalMins=rows.reduce((a,r)=>a+(r.mins||60),0);
  const hours=Math.round(totalMins/60);
  const calories=Math.round(rows.reduce((a,r)=>a+(_MET[r.type]||3)* _AVG*(r.mins||60)/60,0)*_KCAL);

  // monthly map
  const mmap={};
  rows.forEach(r=>{const k=`${r.dt.getFullYear()}-${r.dt.getMonth()}`;(mmap[k]=mmap[k]||{c:0,m:r.dt.getMonth(),y:r.dt.getFullYear()}).c++;});
  const months=Object.values(mmap).sort((a,b)=>b.c-a.c);
  const topMonth=months[0];

  // time-of-day signature (hour buckets)
  const hourCount={};
  rows.forEach(r=>{const h=r.dt.getHours();if(!isNaN(h))hourCount[h]=(hourCount[h]||0)+1;});
  const topHourE=Object.entries(hourCount).sort((a,b)=>b[1]-a[1])[0];
  const topHour=topHourE?parseInt(topHourE[0]):null;
  const topHourPct=topHourE?Math.round(topHourE[1]/n*100):0;
  const fmtHour=h=>{const am=h<12;let hh=h%12;if(hh===0)hh=12;return `${hh}${am?' โมงเช้า':(h<18?' โมงเย็น':' ทุ่ม'.replace('ทุ่ม',(h-18)+' ทุ่ม')) }`.replace('0 ทุ่ม','6 โมงเย็น');};
  const fmtHourEN=h=>{const am=h<12;let hh=h%12;if(hh===0)hh=12;return `${hh}${am?'AM':'PM'}`;};

  // longest weekly streak
  const series=_weeklySeries(rows);
  let best=0,cur=0; series.forEach(w=>{if(w.count>0){cur++;best=Math.max(best,cur);}else cur=0;});

  // most-attended single class (by exact event_name), excluding event/promo/special sessions
  const _isEventClass=nm=>{
    const s=(nm||'').toLowerCase();
    return /exclusive|experience|expirence|event|promo|workshop|pop ?up|popup|challenge|special|trial|intro|open house|วันเด็ก|ปีใหม่|สงกรานต์|อีเวนต์|เวิร์กช็อป/.test(s);
  };
  const classFreq={};
  rows.forEach(r=>{const nm=(r.name||'').trim();if(!nm||_isEventClass(nm))return;classFreq[nm]=(classFreq[nm]||0)+1;});
  const topClassE=Object.entries(classFreq).sort((a,b)=>b[1]-a[1])[0];
  const topClassName=topClassE?topClassE[0]:null;
  const topClassCount=topClassE?topClassE[1]:0;

  // weekend vs weekday
  const wend=rows.filter(r=>{const d=r.dt.getDay();return d===0||d===6;}).length;
  const wendPct=Math.round(wend/n*100);

  // months since first class
  const first=rows[0].dt;
  const monthsSince=Math.max(1,Math.round((Date.now()-first)/(86400000*30)));

  const pool=[];

  // 1 · MINUTES ON THE MAT — always eligible, always first
  pool.push({id:'hours',always:true,build:()=>({
    eyebrow:'TIME ON THE MAT',
    bigHTML:`${totalMins}<span class="wr-unit">min</span>`,
    say:`about <b>${Math.round(totalMins/45)} classes</b> of showing up`,
    share:{big:String(totalMins),unit:'min',title:'MINUTES ON THE MAT',sub:`about ${Math.round(totalMins/45)} classes of showing up`,color:'#1DB954'}
  })});

  // 2 · ENERGY BURNED — always eligible
  pool.push({id:'energy',always:true,build:()=>({
    eyebrow:'ENERGY BURNED',
    bigHTML:`${calories.toLocaleString()}<span class="wr-unit">kcal</span>`,
    say:`across <b>${n} classes</b> — one rep at a time`,
    share:{big:calories.toLocaleString(),unit:'kcal',title:'ENERGY BURNED',sub:`across ${n} classes`,color:'#FF9F0A'}
  })});

  // 3 · SIGNATURE TIME — always (if any hour data)
  if(topHour!==null) pool.push({id:'time',always:true,build:()=>({
    eyebrow:'YOUR SIGNATURE TIME',
    headline:`${fmtHourEN(topHour)} is your hour`,
    say:`<b>${topHourPct}%</b> of your classes land here — you've got a rhythm`,
    share:{big:fmtHourEN(topHour),unit:'',title:'YOUR SIGNATURE TIME',sub:`${topHourPct}% of your classes`,color:'#FFFFFF'}
  })});

  // 4 · TOP MONTH — needs ≥2 months
  if(months.length>=2 && topMonth) pool.push({id:'topmonth',build:()=>({
    eyebrow:'BUSIEST MONTH',
    headline:`${new Date(topMonth.y,topMonth.m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}`,
    bigHTML:`<span class="wr-month-big">${topMonth.c} <span class="wr-sub-num">classes</span></span>`,
    say:`your single busiest month — <b>peak form</b>`,
    share:{big:String(topMonth.c),unit:'classes',title:'BUSIEST MONTH',sub:`${new Date(topMonth.y,topMonth.m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}`,color:'#FF6B9D'}
  })});

  // 5 · LONGEST STREAK — needs ≥2
  if(best>=2) pool.push({id:'streak',build:()=>({
    eyebrow:'LONGEST STREAK',
    bigHTML:`${best}<span class="wr-unit">wks</span>`,
    say:`your longest run yet — <b>lowkey impressive</b>`,
    share:{big:String(best),unit:'weeks',title:'LONGEST STREAK',sub:'your longest run',color:'#9D4EDD'}
  })});

  // 6 · MOST-ATTENDED CLASS — needs ≥5 classes and a repeated class
  if(n>=5 && topClassName && topClassCount>=3) pool.push({id:'topclass',build:()=>({
    eyebrow:'MOST ATTENDED',
    headline:topClassName,
    bigHTML:`${topClassCount}<span class="wr-unit">times</span>`,
    say:`<b>${Math.round(topClassCount/n*100)}%</b> of your classes — a clear favourite`,
    share:{big:String(topClassCount),unit:'times',title:'MOST ATTENDED',sub:topClassName.length>26?topClassName.slice(0,25)+'…':topClassName,color:'#00C2D1'}
  })});

  // 7 · WEEKEND vs WEEKDAY — needs ≥8 classes and a clear lean
  if(n>=8 && (wendPct>=55||wendPct<=20)) pool.push({id:'wkd',build:()=>{
    const warrior=wendPct>=55;
    return {
    eyebrow:warrior?'WEEKEND WARRIOR':'WEEKDAY REGULAR',
    headline:warrior?`Weekends`:`Weekdays`,
    say:warrior
      ?`weekends are where your training lives — <b>your days, your rules</b>`
      :`weekdays are where your training lives — <b>fit into the busy</b>`,
    share:{big:warrior?wendPct+'%':(100-wendPct)+'%',unit:'',title:warrior?'WEEKENDS':'WEEKDAYS',sub:'where your training lives',color:'#00C2D1'}
  };}});

  // 8 · TIME WITH PILAR — needs ≥3 months
  if(monthsSince>=3) pool.push({id:'since',build:()=>({
    eyebrow:'YOUR JOURNEY',
    bigHTML:`${monthsSince}<span class="wr-unit">mo</span>`,
    say:`since your very first class — <b>still showing up</b>`,
    share:{big:String(monthsSince),unit:'months',title:'WITH PILAR',sub:'and counting',color:'#FFFFFF'}
  })});

  // ── COMPARISON SLIDES — tiered, celebrate strength vs community, never put others down ──
  const studio=_wrStudioStats();
  const myType={}; rows.forEach(r=>myType[r.type]=(myType[r.type]||0)+1);
  const topMyType=Object.entries(myType).sort((a,b)=>b[1]-a[1])[0]; // [type,count]
  const myMorn=rows.filter(r=>r.dt.getHours()<12).length;
  const myEve=rows.filter(r=>r.dt.getHours()>=17).length;
  const myThisMonth=rows.filter(r=>r.dt.getMonth()===new Date().getMonth()&&r.dt.getFullYear()===new Date().getFullYear()).length;

  // 9 · TIER BY TOTAL CLASSES
  if(n>=10 && studio.memberCount>=8){
    const tp=_wrTopPct(n,studio.totals); const tier=tp&&_wrTier(tp.topPct);
    if(tier) pool.push({id:'cmp_total',build:()=>({
      eyebrow:'STUDIO STANDING',
      headline:`${tier.name}${tier.emoji?' '+tier.emoji:''}`,
      bigHTML:`Top ${tp.topPct}<span class="wr-unit">%</span>`,
      say:`<b>among all Pilar members</b> — quietly ahead`,
      share:{big:`Top ${tp.topPct}%`,unit:'',title:tier.name.toUpperCase()+' · CLASSES',sub:'among all Pilar members',color:tier.color}
    })});
  }

  // 10 · TIER BY HOURS
  if(hours>=15 && studio.memberCount>=8){
    const tp=_wrTopPct(hours,studio.hoursArr); const tier=tp&&_wrTier(tp.topPct);
    if(tier) pool.push({id:'cmp_hours',build:()=>({
      eyebrow:'HOURS · STUDIO WIDE',
      headline:`${tier.name}${tier.emoji?' '+tier.emoji:''}`,
      bigHTML:`Top ${tp.topPct}<span class="wr-unit">%</span>`,
      say:`your <b>${hours} hours</b> — measured studio-wide`,
      share:{big:`Top ${tp.topPct}%`,unit:'',title:tier.name.toUpperCase()+' · HOURS',sub:'among all members',color:tier.color}
    })});
  }

  // 11 · TIER BY CONSISTENCY
  if(studio.memberCount>=8){
    const myWeeks=(()=>{const wks=new Set(rows.map(r=>{const x=new Date(r.dt);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x.getTime();}));return wks.size;})();
    if(myWeeks>=6){
      const tp=_wrTopPct(myWeeks,studio.consistencyArr); const tier=tp&&_wrTier(tp.topPct);
      if(tier) pool.push({id:'cmp_consistency',build:()=>({
        eyebrow:'CONSISTENCY · STUDIO WIDE',
        headline:`${tier.name}${tier.emoji?' '+tier.emoji:''}`,
        bigHTML:`Top ${tp.topPct}<span class="wr-unit">%</span>`,
        say:`across <b>${myWeeks} different weeks</b> — quietly steady`,
        share:{big:`Top ${tp.topPct}%`,unit:'',title:tier.name.toUpperCase()+' · CONSISTENCY',sub:`${myWeeks} active weeks`,color:tier.color}
      })});
    }
  }

  // 12 · ABOVE COMMUNITY AVERAGE (multiplier, gentle)
  if(n>=8 && studio.totals.length>=8){
    const avg=studio.totals.reduce((a,b)=>a+b,0)/studio.totals.length;
    const ratio=avg>0?(n/avg):1;
    if(ratio>=1.2) pool.push({id:'cmp_avg',build:()=>{
      const x=ratio>=2?'over 2×':`${ratio.toFixed(1)}×`;
      return {
      eyebrow:'VS THE AVERAGE',
      bigHTML:`${ratio.toFixed(1)}<span class="wr-unit">×</span>`,
      say:`ahead of the average member — <b>your pace, your rules</b>`,
      share:{big:`${ratio.toFixed(1)}×`,unit:'',title:'AHEAD OF MOST',sub:'vs the average member',color:'#FF6B9D'}
    };}});
  }

  // 13 · TIER BY CLASS TYPE — specialist spotlight (lets non-overall-leaders shine)
  if(topMyType && topMyType[1]>=6 && studio.memberCount>=8){
    const [t,c]=topMyType; const arr=studio.byType[t]||[];
    if(arr.length>=5){
      const tp=_wrTopPct(c,arr); const tier=tp&&_wrTier(tp.topPct);
      if(tier) pool.push({id:'cmp_type',build:()=>({
        eyebrow:`AMONG ${t.toUpperCase()} REGULARS`,
        headline:`${tier.name}${tier.emoji?' '+tier.emoji:''}`,
        bigHTML:`Top ${tp.topPct}<span class="wr-unit">%</span>`,
        say:`among the <b>${t}</b> regulars — quietly killing it`,
        share:{big:`Top ${tp.topPct}%`,unit:'',title:`TOP ${t.toUpperCase()}`,sub:`among ${t} regulars`,color:tier.color}
      })});
    }
  }

  // 14 · RANK POSITION — leaderboard number, needs ≥10 & top half
  if(n>=10 && studio.totals.length>=10){
    const rank=studio.totals.filter(v=>v>n).length+1; // 1-indexed
    const tp=_wrTopPct(n,studio.totals);
    // only show when genuinely high (top 50%) AND never reveal studio size
    if(rank<=Math.ceil(studio.totals.length*0.5)) pool.push({id:'cmp_rank',build:()=>({
      eyebrow:'STUDIO RANK',
      bigHTML:`#${rank}`,
      headline:tp?`Top ${tp.topPct}% of members`:'',
      say:`${tp?`<b>Top ${tp.topPct}%</b> of members`:`<b>top of the studio</b>`} — ranked by classes`,
      share:{big:`#${rank}`,unit:'',title:'STUDIO RANK',sub:tp?`Top ${tp.topPct}% of members`:'among all members',color:'#F5C842'}
    })});
  }

  // 15 · TIME-OF-DAY TIER — morning or evening crowd
  if(studio.memberCount>=8){
    if(myMorn>=6){
      const tp=_wrTopPct(myMorn,studio.mornArr); const tier=tp&&_wrTier(tp.topPct);
      if(tier) pool.push({id:'cmp_morning',build:()=>({
        eyebrow:'MORNING CROWD',
        headline:`Morning Regular`,
        bigHTML:`Top ${tp.topPct}<span class="wr-unit">%</span>`,
        say:`<b>${myMorn} classes</b> before noon — a true morning regular`,
        share:{big:`Top ${tp.topPct}%`,unit:'',title:'MORNING REGULAR',sub:`${myMorn} morning classes`,color:tier.color}
      })});
    } else if(myEve>=6){
      const tp=_wrTopPct(myEve,studio.eveArr); const tier=tp&&_wrTier(tp.topPct);
      if(tier) pool.push({id:'cmp_evening',build:()=>({
        eyebrow:'EVENING CROWD',
        headline:`Evening Regular`,
        bigHTML:`Top ${tp.topPct}<span class="wr-unit">%</span>`,
        say:`<b>${myEve} classes</b> after 5pm — a true evening regular`,
        share:{big:`Top ${tp.topPct}%`,unit:'',title:'EVENING REGULAR',sub:`${myEve} evening classes`,color:tier.color}
      })});
    }
  }

  // 16 · THIS MONTH'S MOVER — fresh monthly comparison
  if(myThisMonth>=4 && studio.memberCount>=8){
    const tp=_wrTopPct(myThisMonth,studio.thisMonthArr.filter(v=>v>0)); const tier=tp&&_wrTier(tp.topPct);
    if(tier) pool.push({id:'cmp_month',build:()=>({
      eyebrow:'THIS MONTH',
      headline:`${tier.name} this month${tier.emoji?' '+tier.emoji:''}`,
      bigHTML:`Top ${tp.topPct}<span class="wr-unit">%</span>`,
      say:`<b>${myThisMonth} classes</b> this month — on a roll`,
      share:{big:`Top ${tp.topPct}%`,unit:'',title:`THIS MONTH'S MOVER`,sub:`${myThisMonth} classes this month`,color:tier.color}
    })});
  }

  return pool;
}

/* Build the Wrapped hero card. Returns HTML (or '' if no rows). */
function _jWrapped(rows){
  if(!rows.length) return '';
  const pool=_wrPool(rows);
  // daily seed: YYYYMMDD as int
  const d=new Date();
  const seed=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
  // Hours is always first; shuffle the rest, take 3 more
  const first=pool.find(p=>p.id==='hours');
  const rest=pool.filter(p=>p.id!=='hours');
  const shuffled=_wrSeededShuffle(rest,seed);
  const chosen=[first,...shuffled].filter(Boolean).slice(0,7);

  const slidesData=chosen.map(p=>p.build());
  // stash share payloads for the click handler
  window._wrShare=slidesData.map(s=>s.share);

  const slidesHTML=slidesData.map((s,i)=>{
    const grad=_WR_GRAD[i%_WR_GRAD.length];
    const headBlock = s.headline
      ? `<div class="wr-headline">${s.headline}</div>${s.bigHTML?`<div class="wr-big" style="margin-top:12px">${s.bigHTML}</div>`:''}`
      : `<div class="wr-big">${s.bigHTML}</div>`;
    return `<div class="wr-slide" style="background:${grad}">
      <div class="wr-eyebrow">${s.eyebrow}</div>
      <div class="wr-spacer"></div>
      ${headBlock}
      <div class="wr-say">${s.say}</div>
      <div class="wr-foot">
        <div class="wr-mark">PILAR</div>
        <button class="wr-share" onclick="_wrShareSlide(${i})">${_WR_SHARE_SVG}<span>Share</span></button>
      </div>
    </div>`;
  }).join('');

  const dots=slidesData.map((_,i)=>`<button class="wr-dot ${i===0?'on':''}" onclick="_wrGo(${i})" aria-label="slide ${i+1}"></button>`).join('');

  return `<section class="wr-hero">
    <div class="wr-track" id="wrTrack">
      <div class="wr-rail" id="wrRail">${slidesHTML}</div>
    </div>
    <div class="wr-dots" id="wrDots">${dots}</div>
  </section>`;
}

/* Wrapped slider state + controls */
let _wrIdx=0,_wrCount=0;
function _wrGo(i){
  const rail=document.getElementById('wrRail');if(!rail)return;
  _wrCount=rail.children.length;
  _wrIdx=Math.max(0,Math.min(_wrCount-1,i));
  rail.style.transform=`translateX(-${_wrIdx*100}%)`;
  const dots=document.getElementById('wrDots');
  if(dots)[...dots.children].forEach((d,k)=>d.classList.toggle('on',k===_wrIdx));
}
function _wrShareSlide(i){
  const arr=window._wrShare||[];
  const s=arr[i];if(!s)return;
  _shareCardType=null;
  // grad: the same gradient the My Journey card uses, so the sticker reads as
  // that exact card. headline: optional big-title slides (e.g. signature time).
  _shareHL={icon:'spark',color:s.color,grad:(_WR_GRAD[i%_WR_GRAD.length]),
            big:s.big,unit:s.unit,title:s.title,sub:s.sub,headline:s.headline||''};
  _shareLayout='HL';
  openShareCamera();
}
/* swipe / drag binding for the Wrapped rail */
function _bindWrapped(){
  const track=document.getElementById('wrTrack');
  const rail=document.getElementById('wrRail');
  if(!track||!rail)return;
  _wrIdx=0;_wrCount=rail.children.length;
  let sx=0,sy=0,dragging=false,locked=null;
  track.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;dragging=true;locked=null;},{passive:true});
  track.addEventListener('touchmove',e=>{
    if(!dragging)return;const t=e.touches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
    if(locked===null)locked=Math.abs(dx)>Math.abs(dy)?'x':'y';
    if(locked==='x'){e.preventDefault();}
  },{passive:false});
  track.addEventListener('touchend',e=>{
    if(!dragging)return;dragging=false;
    const t=e.changedTouches[0];const dx=t.clientX-sx;
    if(locked==='x'&&Math.abs(dx)>44){_wrGo(_wrIdx+(dx<0?1:-1));}
  });
  // desktop: click left/right half to navigate
  track.addEventListener('click',e=>{
    if(e.target.closest('.wr-share'))return;
    const r=track.getBoundingClientRect();
    _wrGo(_wrIdx+(e.clientX-r.left>r.width/2?1:-1));
  });
}

/* Cross-member studio aggregates for comparison slides.
   Returns per-member totals/hours/streaks so we can place THIS member in a
   positive percentile. Celebratory framing only — never ranks others down.
   Cached on window per data load to avoid recompute across slides. */
function _wrStudioStats(){
  // Prefer backend-provided aggregates (member login only loads own bookings,
  // so we can't compute studio percentiles locally). Backend sends arrays of
  // per-member stats WITHOUT names — privacy-safe.
  if(window._studioStats && window._studioStats.totals && window._studioStats.totals.length){
    const s=window._studioStats;
    return {
      _src:'backend',
      memberCount:s.memberCount||s.totals.length,
      totals:s.totals||[],
      hoursArr:s.hours||s.hoursArr||[],
      consistencyArr:s.consistency||s.consistencyArr||[],
      byType:s.byType||{},
      mornArr:s.morning||s.mornArr||[],
      eveArr:s.evening||s.eveArr||[],
      thisMonthArr:s.thisMonth||s.thisMonthArr||[]
    };
  }
  // Fallback: compute locally (works for staff login where allBookings holds everyone)
  if(window._wrStudioCache && window._wrStudioCache._n===allBookings.length) return window._wrStudioCache;
  const members=[...new Set(allBookings.filter(b=>b.booking_status==='Booked').map(b=>b.contact_name))];
  const totals=[],hoursArr=[],consistencyArr=[];
  const byType={};
  const mornArr=[],eveArr=[];
  const thisMonthArr=[];
  const leadArr=[]; // median lead time (hours) per member, for The Closer baseline
  const now=new Date(), curM=now.getMonth(), curY=now.getFullYear();
  members.forEach(m=>{
    const ms=allBookings.filter(b=>b.contact_name===m && b.booking_status==='Booked');
    const valid=ms.map(s=>{const _bk=s.booking_date?new Date(s.booking_date):null;return {dt:new Date(s.event_date),bookingDt:(_bk&&!isNaN(_bk))?_bk:null,mins:parseInt(s.duration)||60,type:classify(s.event_name||'',s.instructors)};}).filter(r=>!isNaN(r.dt));
    if(!valid.length) return;
    totals.push(valid.length);
    hoursArr.push(valid.reduce((a,r)=>a+r.mins,0)/60);
    const wks=new Set(valid.map(r=>{const x=new Date(r.dt);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x.getTime();}));
    consistencyArr.push(wks.size);
    const tc={}; valid.forEach(r=>tc[r.type]=(tc[r.type]||0)+1);
    Object.entries(tc).forEach(([t,c])=>{(byType[t]=byType[t]||[]).push(c);});
    let morn=0,eve=0; valid.forEach(r=>{const h=r.dt.getHours();if(h<12)morn++;else if(h>=17)eve++;});
    mornArr.push(morn); eveArr.push(eve);
    thisMonthArr.push(valid.filter(r=>r.dt.getMonth()===curM&&r.dt.getFullYear()===curY).length);
    // median lead time (hours between booking and class) for this member
    const leads=valid.map(r=>r.bookingDt?(r.dt-r.bookingDt)/3600000:null).filter(v=>v!=null&&v>=0).sort((a,b)=>a-b);
    if(leads.length){const mid=Math.floor(leads.length/2);leadArr.push(leads.length%2?leads[mid]:(leads[mid-1]+leads[mid])/2);}
  });
  const cache={_n:allBookings.length,_src:'local',memberCount:members.length,totals,hoursArr,consistencyArr,byType,mornArr,eveArr,thisMonthArr,leadArr};
  window._wrStudioCache=cache;
  return cache;
}
/* percentile of `val` within sorted-ascending `arr` → % of members at/below.
   Returns the "top X%" (smaller = more elite). */
function _wrTopPct(val,arr){
  if(!arr.length) return null;
  const atOrBelow=arr.filter(v=>v<=val).length;
  const pctile=Math.round(atOrBelow/arr.length*100);     // e.g. 92 = better than 92%
  const topPct=Math.max(1,100-pctile);                    // top 8%
  return {pctile,topPct,n:arr.length};
}
/* Map a top-percentile to a named tier. Returns null if not above median
   (so below-median members never see a discouraging comparison). */
function _wrTier(topPct){

  if(topPct<=5)  return {name:'Top tier',th:'\u0e1a\u0e19\u0e2a\u0e38\u0e14',emoji:'',color:'#F5C842',rank:'\u0e1a\u0e19\u0e2a\u0e38\u0e14\u0e02\u0e2d\u0e07\u0e2a\u0e15\u0e39\u0e14\u0e34\u0e42\u0e2d'};

/* Persona logic — scoring cascade: pick the axis where member is most distinctive vs studio. */
function _persona(rows){
  const n=rows.length;
  if(!n) return {emoji:'',name:'Getting Started',why:'เริ่มบันทึกหลังคลาสแรกของคุณ',key:'start'};

  const cache=(typeof _wrStudioStats==='function')?_wrStudioStats():null;

  // ---- gather member metrics ----
  const hrs=rows.map(r=>r.dt.getHours()).filter(h=>!isNaN(h));
  const eve=hrs.filter(h=>h>=17).length;
  const evePct=Math.round(eve/n*100);
  const tc={}; rows.forEach(r=>tc[r.type]=(tc[r.type]||0)+1);
  const typeEntries=Object.entries(tc).sort((a,b)=>b[1]-a[1]);
  const topType=typeEntries[0]; const topTypePct=Math.round(topType[1]/n*100);
  const typeCount=typeEntries.length;
  const ic={}; rows.forEach(r=>{if(r.instructor)ic[r.instructor]=(ic[r.instructor]||0)+1;});
  const instrEntries=Object.entries(ic).sort((a,b)=>b[1]-a[1]);
  const topInstr=instrEntries[0]; const topInstrPct=topInstr?Math.round(topInstr[1]/n*100):0;
  const streak=_longestStreak(rows);
  // anchor: most-repeated class name (cleaned)
  const nc={}; rows.forEach(r=>{const nm=(r.name||'').split(/[|\/\u2013\u2014]/)[0].trim();if(nm)nc[nm]=(nc[nm]||0)+1;});
  const nameEntries=Object.entries(nc).sort((a,b)=>b[1]-a[1]);
  const topName=nameEntries[0]; const topNameCount=topName?topName[1]:0;
  const secondNameCount=nameEntries[1]?nameEntries[1][1]:0;
  // closer: member median lead time (hours)
  const leads=rows.map(r=>r.bookingDt?(r.dt-r.bookingDt)/3600000:null).filter(v=>v!=null&&v>=0).sort((a,b)=>a-b);
  let myLead=null;
  if(leads.length){const mid=Math.floor(leads.length/2);myLead=leads.length%2?leads[mid]:(leads[mid-1]+leads[mid])/2;}

  // ---- studio baselines (median of member arrays) ----
  const med=arr=>{if(!arr||!arr.length)return null;const a=[...arr].sort((x,y)=>x-y);const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2;};
  const baseLead=cache?med(cache.leadArr):null;
  const baseStreak=cache?med(cache.consistencyArr):null;

  // ---- score each axis (higher = more distinctive vs studio) ----
  const C=[];
  // The Closer — only if we have lead data for member AND studio baseline
  if(myLead!=null && baseLead!=null && baseLead>0){
    const ratio=myLead/baseLead; // <1 = books closer than typical
    if(ratio<0.6){ // meaningfully shorter
      const sc=Math.min(100,Math.round((1-ratio)*100)+30);
      const hrTxt=myLead<24?`${Math.round(myLead)} ชั่วโมง`:`${(myLead/24).toFixed(myLead/24<10?1:0)} วัน`;
      C.push({key:'closer',score:sc,name:'The Closer',why:`จองล่วงหน้าเฉลี่ย ${hrTxt} สั้นที่สุดในกลุ่ม คุณตัดสินใจไว`});
    }
  }
  // Loyalty — Team [coach]
  if(topInstr && topInstrPct>=55){
    C.push({key:'team',score:Math.round(40+(topInstrPct-55)*1.8),name:`Team ${topInstr[0]}`,why:`${topInstrPct}% ของคลาสคุณเรียนกับครู ${topInstr[0]} คุณมาเพื่อคนสอน`});
  }
  // Anchor — repeated class
  if(topNameCount>=4 && topNameCount>secondNameCount){
    C.push({key:'anchor',score:Math.min(95,topNameCount*9),name:'The Anchor',why:`มีคลาสที่คุณกลับมาเล่นซ้ำมากสุด ${topNameCount} ครั้ง คือ home base ของคุณ`});
  }
  // Metronome — consistency vs baseline
  if(streak>=5 && (baseStreak==null||streak>baseStreak)){
    C.push({key:'metronome',score:Math.min(90,streak*7),name:'The Metronome',why:`ต่อเนื่อง ${streak} สัปดาห์ ความสม่ำเสมอที่ทรงพลัง`});
  }
  // Explorer — breadth
  if(typeCount>=3 && topTypePct<=45){
    C.push({key:'explorer',score:Math.round((100-topTypePct)*0.8),name:'The Explorer',why:`ลองครบ ${typeCount} ประเภท ไม่มีอันไหนเกิน ${topTypePct}% มาเพื่อค้นหา`});
  }
  // Devotee — single format
  if(topTypePct>=70){
    C.push({key:'devotee',score:topTypePct,name:`${topType[0]} Devotee`,why:`${topTypePct}% ของคลาสคุณคือ ${topType[0]} คุณรู้ว่าตัวเองชอบอะไร`});
  }
  // Evening — relative to studio (only if studio eve baseline known and member exceeds it)
  if(cache && cache.eveArr && cache.eveArr.length){
    const studioEveAvg=cache.eveArr.reduce((a,b)=>a+b,0)/cache.eveArr.length;
    const studioTotalAvg=(cache.totals&&cache.totals.length)?cache.totals.reduce((a,b)=>a+b,0)/cache.totals.length:0;
    const studioEvePct=studioTotalAvg>0?Math.round(studioEveAvg/studioTotalAvg*100):0;
    if(evePct>=studioEvePct+15){ // distinctly more evening than typical
      C.push({key:'evening',score:Math.round((evePct-studioEvePct)*0.8),name:'After-Hours Regular',why:`${evePct}% ของคลาสคุณอยู่ช่วงเย็น สูงกว่าสมาชิกทั่วไปที่ ${studioEvePct}%`});
    }
  }

  // ---- pick highest-scoring axis ----
  if(C.length){
    C.sort((a,b)=>b.score-a.score);
    const w=C[0];
    return {emoji:'',name:w.name,why:w.why,key:w.key};
  }
  // ---- fallback that's still true ----
  if(topName && topNameCount>=3) return {emoji:'',name:'The Anchor',why:`คลาสที่คุณกลับมาบ่อยสุดคือ ${topName[0]} (${topNameCount} ครั้ง)`,key:'anchor'};
  if(topInstr) return {emoji:'',name:`Mostly with ${topInstr[0]}`,why:`${topInstrPct}% ของคลาสคุณเรียนกับ ${topInstr[0]}`,key:'team'};
  return {emoji:'',name:'Building',why:`${n} คลาสจนถึงตอนนี้`,key:'building'};
}

function _jTotal(rows){
  const total=rows.length;
  const ladder=[5,25,50,100,150,200,300,500,750,1000];
  const next=ladder.find(m=>m>total)||(Math.ceil(total/250)*250+250);
  const prev=[...ladder].reverse().find(m=>m<=total)||0;
  // 4 visible nodes leading to next milestone
  const marks=ladder.filter(m=>m<=next).slice(-4);
  if(marks[marks.length-1]!==next) marks.push(next);
  const nodes=marks.map((m,i)=>{
    const done=total>=m;
    const isNext=m===next;
    const dot=`<div class="ah-mile-dot ${done?'done':isNext?'next':''}"${!done&&!isNext?' style="background:var(--ah-surface-2)"':''}></div>`;
    const segOn=total>=marks[i+1];
    const seg=i<marks.length-1?`<div class="ah-mile-seg${segOn?' on':''}" style="background:${segOn?'var(--cat)':'var(--ah-surface-2)'};animation-delay:${(i*0.5).toFixed(2)}s"></div>`:'';
    return dot+seg;
  }).join('');
  const lbls=marks.map((m,i)=>`<span${m===next?' style="color:var(--cat);font-weight:600"':''}>${m===next?m+' →':m}</span>`).join('');
  const curTier=[...PILAR_TIERS].reverse().find(t=>total>=t.n);
  return `<section style="--cat:var(--ah-accent);--cat-soft:rgba(107,127,240,0.12)">

/* ── Form math: recency-weighted effort vs lifetime baseline (freq × mins × MET × trend) ── */
function _formStats(rows){
  const series=_weeklySeries(rows);
  if(series.length<6) return null;
  const byWk={}; rows.forEach(r=>{const k=_weekKey(r.dt);byWk[k]=(byWk[k]||0)+(r.mins||60)*(_MET[r.type]||3);});
  const eff=series.map(w=>byWk[w.wk]||0);
  const baseline=eff.reduce((a,b)=>a+b,0)/eff.length;
  if(baseline<=0) return null;
  const last4=eff.slice(-4);
  const current=last4.reduce((a,b)=>a+b,0)/last4.length;
  const ratio=current/baseline;
  const slope=eff.length>=3?(eff[eff.length-1]-eff[eff.length-3]):0;
  const status=ratio>=1.15&&slope>=0?'Rising':ratio<=0.8?'Resting':'Steady';
  const pct=Math.round((ratio-1)*100);
  // best-ever 4-week window
  let bestI=0,bestV=0;
  for(let i=0;i+4<=eff.length;i++){const v=(eff[i]+eff[i+1]+eff[i+2]+eff[i+3])/4;if(v>bestV){bestV=v;bestI=i;}}
  const bestDate=new Date(parseInt(series[Math.min(bestI+3,series.length-1)].wk));
  return {eff,series,baseline,current,ratio,pct,status,bestDate,bestPct:Math.round((bestV/baseline-1)*100)};
}

/* ── Coach Effect math: who makes you come back faster? (coach × return-gap × baseline × n) ── */
function _coachEffect(rows){
  const sorted=[...rows].sort((a,b)=>a.dt-b.dt);
  const clean=n=>n.replace(/^\s*(instructor|coach|ครู)\s+/i,'').trim()||n;
  const gaps=[],byCoach={};
  for(let i=0;i<sorted.length-1;i++){
    const g=(sorted[i+1].dt-sorted[i].dt)/86400000;
    if(g<=0||g>45) continue;            // ignore same-day dupes & long breaks
    gaps.push(g);
    const c=(sorted[i].instructor||'').trim();
    if(c&&!/^(instructor|coach|ครู)$/i.test(c)){(byCoach[clean(c)]=byCoach[clean(c)]||[]).push(g);}
  }
  if(gaps.length<6) return null;
  const overall=gaps.reduce((a,b)=>a+b,0)/gaps.length;
  const per=Object.entries(byCoach).filter(([,arr])=>arr.length>=3)
    .map(([n,arr])=>({name:n,avg:arr.reduce((a,b)=>a+b,0)/arr.length,n:arr.length}))
    .sort((a,b)=>a.avg-b.avg);
  if(!per.length) return null;
  const top=per[0];
  const effect=overall/top.avg;
  return {overall,per,top,effect,strong:effect>=1.15&&per.length>=2};
}

/* ── Take-off sparkline (cumulative-to-projection) ──
   Plots this month's cumulative class count as a plane-style take-off arc:
   a flat runway that climbs steeply toward the projected month-end total.
   Solid line = realised days up to today; dotted = projection to the endpoint.
   The endpoint dot marks where this pace lands by month's end. */
function _ahSmoothPath(pts){
  if(pts.length<2) return '';
  let d=`M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
    d+=` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  return d;
}
/* opts: {W,H,padR,padTop,padBot,color,faint,w,halo,dot,dotStroke,liftoff}
   dayFrac = today's progress through the month (0..1); projected = endpoint value */
function _ahTakeoffSpark(opts){
  const W=opts.W,H=opts.H,padR=opts.padR??28,padTop=opts.padTop??14,padBot=opts.padBot??16;
  const goal=Math.max(opts.projected||1,1);
  const usableW=W-padR, usableH=H-padTop-padBot;
  const liftoff=Math.min(Math.max(opts.dayFrac??0.45,0.18),0.82); // solid run ends at today's progress
  const curveVal=fx=>goal*Math.pow(fx,2.4);   // exponential take-off shape
  const N=22, all=[];
  for(let i=0;i<=N;i++){ const fx=i/N; all.push([fx,curveVal(fx)]); }
  const toXY=([fx,v])=>({x:fx*usableW, y:padTop+(1-v/goal)*usableH});
  const real=all.filter(p=>p[0]<=liftoff).map(toXY);
  const proj=all.filter(p=>p[0]>=liftoff).map(toXY);
  const goalPt=toXY([1,goal]);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" width="100%" height="100%">
    <path d="${_ahSmoothPath(proj)}" fill="none" stroke="${opts.faint}" stroke-width="${opts.w}" stroke-linecap="round" stroke-dasharray="1 7"/>
    <path d="${_ahSmoothPath(real)}" fill="none" stroke="${opts.color}" stroke-width="${opts.w}" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${goalPt.x.toFixed(1)}" cy="${goalPt.y.toFixed(1)}" r="11" fill="${opts.halo}"/>
    <circle cx="${goalPt.x.toFixed(1)}" cy="${goalPt.y.toFixed(1)}" r="5" fill="${opts.dot}" stroke="${opts.dotStroke}" stroke-width="2.2"/>
  </svg>`;
}

/* Floating popover — a single reusable bubble anchored to a tapped element.
   Used by heatmap cells, trend bars (show the count) and the pace info button (about text).
   Tap the same trigger again, or anywhere else, to dismiss. */
function ahPop(ev, html){
  ev.stopPropagation();
  let pop=document.getElementById('ahPop');
  const anchor=ev.currentTarget;
  // toggle off if re-tapping the same anchor
  const wasSame = pop && pop._anchor===anchor;
  if(pop) pop.remove();
  if(wasSame) return;
  pop=document.createElement('div');
  pop.id='ahPop'; pop._anchor=anchor;
  pop.style.cssText='position:fixed;z-index:9999;background:rgba(28,28,30,0.96);color:#fff;'
    +'font-size:12px;line-height:1.45;font-weight:500;padding:9px 12px;border-radius:11px;'
    +'max-width:230px;box-shadow:0 6px 24px rgba(0,0,0,0.28);opacity:0;transform:translateY(4px);'
    +'transition:opacity .16s ease,transform .16s ease;pointer-events:none';
  pop.innerHTML=html;
  document.body.appendChild(pop);
  const r=anchor.getBoundingClientRect();
  const pr=pop.getBoundingClientRect();
  let left=r.left+r.width/2-pr.width/2;
  left=Math.max(10,Math.min(left,window.innerWidth-pr.width-10));
  let top=r.top-pr.height-8;
  if(top<10) top=r.bottom+8;   // flip below if no room above
  pop.style.left=left+'px'; pop.style.top=top+'px';
  requestAnimationFrame(()=>{ pop.style.opacity='1'; pop.style.transform='translateY(0)'; });
  // dismiss on the next tap anywhere (registered after this tap finishes)
  setTimeout(()=>{
    const close=()=>{ const p=document.getElementById('ahPop'); if(p)p.remove(); document.removeEventListener('click',close,true); };
    document.addEventListener('click',close,true);
  },0);
}

/* Build a month calendar heatmap (light theme).
   rows: member sessions; year,month: which month to render; cat: accent css var; compact: bool */
function _calHeatmap(rows,year,month,catVar,compact){
  // count classes per day in the target month
  const dc={};
  rows.forEach(r=>{ if(r.dt.getFullYear()===year&&r.dt.getMonth()===month){ const d=r.dt.getDate(); dc[d]=(dc[d]||0)+1; } });
  const maxC=Math.max(1,...Object.values(dc));
  const firstDow=(new Date(year,month,1).getDay()+6)%7; // Mon=0 — matches the rest of the app
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=new Date();
  const isThisMonth=today.getFullYear()===year&&today.getMonth()===month;
  const dows=['M','T','W','T','F','S','S'];
  const monLbl=new Date(year,month,1).toLocaleDateString('en-US',{month:'short'});
  let cells='';
  for(let i=0;i<firstDow;i++) cells+=`<div class="ah-cal-cell empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const c=dc[d]||0;
    const isToday=isThisMonth&&today.getDate()===d;
    if(c>0){
      // intensity: 0.45 → 1.0 by relative count
      const pop=`${monLbl} ${d} &middot; <b>${c} class${c>1?'es':''}</b>`;
      // 35c — light, not ink: a convex glass bead, denser the more classes that day
      const glass=c>=2
        ? 'background:radial-gradient(120% 120% at 30% 20%,rgba(255,255,255,0.97),rgba(255,255,255,0.58) 55%,rgba(255,255,255,0.32));border:1px solid rgba(255,255,255,0.95);box-shadow:inset 0 1px 0 #fff,0 4px 12px -6px rgba(60,50,30,0.42)'
        : 'background:rgba(255,255,255,0.64);border:1px solid rgba(255,255,255,0.82);box-shadow:inset 0 1px 0 rgba(255,255,255,0.9)';
      cells+=`<div class="ah-cal-cell on${isToday?' today':''}" style="box-sizing:border-box;color:var(--ah-ink);font-weight:600;${glass};cursor:pointer" onclick="ahPop(event,'${pop}')">${compact?'':d}</div>`;
    } else {
      const closed=new Date(year,month,d).getDay()===1;   // studio closed on Mondays
      cells+=`<div class="ah-cal-cell off${isToday?' today':''}" style="box-sizing:border-box;border:1px solid transparent;background:rgba(23,24,28,0.035);color:rgba(23,24,28,${closed?0.2:0.38})">${compact?'':d}</div>`;
    }
  }
  return `<div style="--cat:${catVar}">
    ${compact?'':`<div class="ah-cal-dow">${dows.map(x=>`<span>${x}</span>`).join('')}</div>`}
    <div class="ah-cal-grid${compact?' ah-cal-grid-mini':''}">${cells}</div>
  </div>`;
}

/* CARD: Monthly Activities — "which days did I show up this month?" */
function _jMonthly(rows){
  if(!rows.length) return '';
  const now=new Date();
  let y=now.getFullYear(), m=now.getMonth();
  // always the latest month the member actually trained (no calendar-month gate)
  let thisMonth=rows.filter(r=>r.dt.getFullYear()===y&&r.dt.getMonth()===m);
  let _isCurrentMonth=true;
  if(!thisMonth.length){
    const last=rows[rows.length-1].dt;
    y=last.getFullYear(); m=last.getMonth();
    thisMonth=rows.filter(r=>r.dt.getFullYear()===y&&r.dt.getMonth()===m);
    _isCurrentMonth=false;
  }
  if(!thisMonth.length) return '';
  const count=thisMonth.length;
  const _monthLabel=_isCurrentMonth?'This month':new Date(y,m,1).toLocaleDateString('en-US',{month:'long'});
  // previous month count (for the delta tease)
  const pm=new Date(y,m-1,1); const py=pm.getFullYear(), pmo=pm.getMonth();
  const prevCount=rows.filter(r=>r.dt.getFullYear()===py&&r.dt.getMonth()===pmo).length;
  const prevName=pm.toLocaleDateString('en-US',{month:'long'});
  // delta subline — colour only on the small text, never alarming
  let subline;
  if(count===0){ subline='No classes yet this month'; }
  else if(!_isCurrentMonth){ subline=`Last active in ${_monthLabel}`; }
  else if(prevCount>0){
    const d=count-prevCount;
    if(d>0) subline=`<span style="color:var(--green,#34C759);font-weight:600">↑ ${d} more</span> than ${prevName}`;
    else if(d<0) subline=`<span style="color:var(--ah-c-attend);font-weight:600">↓ ${Math.abs(d)} fewer</span> than ${prevName}`;
    else subline=`Same as ${prevName}`;
  } else {
    const dowNames=['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'];
    const dowCount={}; thisMonth.forEach(r=>{const d=r.dt.getDay();dowCount[d]=(dowCount[d]||0)+1;});
    const topDow=Object.entries(dowCount).sort((a,b)=>b[1]-a[1])[0];
    subline=topDow?`Most active on ${dowNames[topDow[0]]}`:'';
  }
  // dynamic icon: busy month (8+) → calendar-heart, else calendar-days
  const monthIcon = count>=8 ? AH_ICON.calheart : AH_ICON.caldays;
  // take-off sparkline — cumulative pace toward this month's projected total
  const dayOfMonth=now.getDate(), daysInMonth=new Date(y,m+1,0).getDate();
  const projected=count>0?Math.max(Math.round(count/dayOfMonth*daysInMonth),count):0;
  const spark=count>0?_ahTakeoffSpark({
    W:200,H:80,projected,dayFrac:dayOfMonth/daysInMonth,
    color:'var(--ah-c-attend)',faint:'color-mix(in srgb,var(--ah-c-attend) 32%,transparent)',
    w:2.4,halo:'color-mix(in srgb,var(--ah-c-attend) 16%,transparent)',dot:'#fff',dotStroke:'var(--ah-c-attend)'
  }):'';
  return `<section style="--cat:var(--ah-c-attend);--cat-soft:var(--ah-c-attend-soft)">
    <div class="ah-sq" onclick="ahOpenSheet('monthly')">
      <div class="ah-chrome">
        <div class="ah-chrome-tile">${monthIcon}</div>
        <span class="ah-chrome-name">Monthly</span>
        <span class="ah-chrome-meta">${new Date(y,m,1).toLocaleDateString('en-US',{month:'short'})}</span>
      </div>
      <div class="ah-sq-body" style="justify-content:flex-end">
        ${subline?`<div class="ah-sq-sub" style="margin-bottom:8px">${subline}</div>`:''}
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:8px">
          <span class="ah-sq-big" style="font-size:34px">${count}<span class="u">${count===1?'class':'classes'}</span></span>
          ${spark?`<div style="flex-shrink:0;width:72px;height:30px;display:flex;align-items:flex-end;justify-content:flex-end"><div style="transform:scale(0.37);transform-origin:bottom right">${spark}</div></div>`:''}
        </div>
      </div>
    </div>
  </section>`;
}

/* Segmented toggle markup */
function _journeyToggle(active){
  return `<div class="ah-seg" id="ahViewSeg" data-active="${active}">
    <button class="ah-seg-btn ${active==='dash'?'on':''}" data-view="dash">Dashboard</button>
    <button class="ah-seg-btn ${active==='journey'?'on':''}" data-view="journey">My Journey</button>
  </div>`;
}
function _bindToggle(name){
  const seg=document.getElementById('ahViewSeg'); if(!seg) return;
  seg.querySelectorAll('.ah-seg-btn').forEach(btn=>{
    btn.onclick=()=>{
      const v=btn.getAttribute('data-view');
      const curActive=seg.getAttribute('data-active');
      if(v===curActive) return;                 // already here — ignore
      const host=document.getElementById('homeFeed');
      // Slide the indicator pill immediately (independent of content swap)
      seg.setAttribute('data-active',v);
      seg.querySelectorAll('.ah-seg-btn').forEach(b=>b.classList.toggle('on',b===btn));
      const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      _ahSeenView=_ahSeenView||{};
      const seen=!!_ahSeenView[v];
      _ahSeenView[v]=true;
      const doSwap=()=>{
        // Mark whether the incoming view should stagger (first visit) or settle instantly (re-entry)
        _ahSkipStagger=seen;
        if(v==='journey') renderJourney(name); else renderHome(name);
        if(host){ host.scrollTop=0; }
        _ahSkipStagger=false;
        if(host){
          requestAnimationFrame(()=>host.classList.remove('ah-switching'));
        }
      };
      if(reduce||!host){ doSwap(); return; }
      host.classList.add('ah-switching');        // fade current out
      setTimeout(doSwap,180);                     // swap at the bottom of the fade, then fade in
    };
  });
}

function renderHome(name){
  const rows=_memberSessions(name);
  document.getElementById('dName').textContent=name.trim().split(/\s+/)[0];

  const sd=document.getElementById('sd'); if(sd) sd.classList.add('ah');

  const allTimeTotal=rows.length;

    ?`<span style="font-size:11px;font-weight:600;border-radius:var(--ah-r-pill);padding:2px 10px;white-space:nowrap">${allTimeTotal} classes</span>`
    :'';

  const host=document.getElementById('homeFeed');
  if(!rows.length){
    host.innerHTML=_journeyToggle('dash')+`<div class="ah-feed-content"><div class="ah-empty">
      <div style="width:40px;height:40px;color:var(--ah-accent);margin:0 auto 12px">${AH_ICON.leaf}</div>
      <div style="font-size:var(--ah-f-title);font-weight:600;color:var(--ah-ink)">No classes yet</div>

    } else {reveals.forEach(el=>{el.classList.add('in');animateFreq(el);});}
    // settle guard — whatever happens to the animators, every number lands on truth
    setTimeout(()=>{host.querySelectorAll('[data-count]').forEach(el=>{
