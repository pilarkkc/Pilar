<!-- Share Modal -->
<script>


/* ── Muscle Group & Strain Keyword Map ── */
const MUSCLE_KEYWORDS = {
  core:    ['basic core','core','pulse & core','flow & control','pilar flow','endurance full body','full body sculpt','sculpt & curve','strength & balance'],
  lower:   ['booty','glutes','legs','hips','barre','booty lift','glutes & legs','hips & legs'],
  upper:   ['upper body','back','office syndrome','office fix','office synfrome'],
  posture: ['reformer posture','posture','office syndrome','office fix','spine','alignment'],
  flex:    ['yoga','harmony','sound','morning flow','energy awakening','happy back','deep sound','reset'],
};

const STRAIN_WEIGHT = {
  // ── Calibrated for Pilates context (0-21 scale) ──
  // Optimal zone = 3-4 classes/week consistently
  'jumpboard':4.5,'cardio barre':4.0,'cardio':3.8,
  'booty lift':3.6,'glutes & legs':3.6,'endurance':3.6,
  'barre with weight':3.4,'sculpt & curve':3.3,'full body sculpt':3.3,
  'reformer':3.0,'pilar flow':3.0,'pulse & core':3.0,
  'basic core':2.5,'upper body':2.5,'posture':2.5,
  'private':3.6,'duo':3.6,
  'yoga':1.8,'sound':1.4,'harmony':1.4,'reset':1.4,
  'first barre':2.0,'hello pilar':2.0,
};

function getStrainWeight(name){
  const n=name.toLowerCase();
  for(const[k,v] of Object.entries(STRAIN_WEIGHT)){
    if(n.includes(k)) return v;
  }
  return 2.4; // default: moderate pilates class
}

function getMuscleGroups(name){
  const n=name.toLowerCase();
  // Special cases: Reformer and Private contribute to multiple groups
  if(n.includes('private')||n.includes('duo')){
    return['core','lower','upper','posture']; // balanced 25% each
  }
  if(n.includes('reformer')&&!n.includes('posture')){
    return['core','core','lower','posture']; // core 40%, lower 30%, posture 30%
  }
  const groups=[];
  for(const[group,kws] of Object.entries(MUSCLE_KEYWORDS)){
    if(kws.some(k=>n.includes(k))) groups.push(group);
  }
  return groups.length?groups:['core'];
}

/* ── Safe element setter ── */
function setEl(id,html_content){const el=document.getElementById(id);if(el)el.innerHTML=html_content;}

/* ── Constants ── */
const MET={Reformer:4.0,Private:3.5,Barre:4.5,Yoga:2.5,Pilates:3.0};
const COLORS={Reformer:'#00CAFF',Private:'#F5C842',Barre:'#FF6B9D',Yoga:'#1BE3A0',Pilates:'#BF5AF2'};
  /* removed unused CLASS_EMOJI (emoji cleanup) */
let allBookings=[],allCustomers=[],currentName='',currentPeriod=0;

/* ── Classify ── */
function classify(n='',instr=''){
  const s=n.toLowerCase();
  const i=(instr||'').toLowerCase();
  if(i.includes('may')||i.includes('bua')) return 'Yoga';   // Yoga = Kru May / Kru Bua
  if(s.includes('reformer')) return 'Reformer';
  if(s.includes('private')||s.includes('duo')) return 'Private';
  return 'Barre';   // default ของสตู
}

/* ── Filter by period ── */
function getWeekBounds(offset=0){
  // offset 0 = this week, offset 1 = last week
  const now=new Date();
  const dow=(now.getDay()+6)%7; // Mon=0
  const start=new Date(now);
  start.setDate(now.getDate()-dow-(offset*7));
  start.setHours(0,0,0,0);
  const end=offset===0?new Date():new Date(start);
  if(offset>0){end.setDate(start.getDate()+6);end.setHours(23,59,59,999);}
  return{start,end};
}

function filterByPeriod(sessions,days){
  const now=new Date();
  if(days==='thisWeek'){
    const{start,end}=getWeekBounds(0);
    return sessions.filter(s=>{const d=new Date(s.event_date);return !isNaN(d)&&d>=start&&d<=end;});
  }
  if(days==='lastWeek'){
    const{start,end}=getWeekBounds(1);
    return sessions.filter(s=>{const d=new Date(s.event_date);return !isNaN(d)&&d>=start&&d<=end;});
  }
  if(!days) return sessions.filter(s=>{const d=new Date(s.event_date);return !isNaN(d)&&d<=now;});
  const cutoff=new Date(now);
  cutoff.setDate(cutoff.getDate()-days);
  return sessions.filter(s=>{
    const d=new Date(s.event_date);
    return !isNaN(d)&&d>=cutoff&&d<=now;
  });
}

/* ── Process stats ── */
function process(sessions, periodDays=null){
  const AVG=65; // updated avg weight kg
  const KCAL_MULT=1.15; // studio factor (incl. EPOC)
  const rows=sessions.map(s=>({
    dt:new Date(s.event_date),
    type:classify(s.event_name,s.instructors),
    name:s.event_name,
    mins:parseInt(s.duration)||60,
    instructor:s.instructors||'',
  })).filter(r=>!isNaN(r.dt)&&r.dt<=new Date());
  const total=rows.length;
  if(!total) return null;
  const totalMins=rows.reduce((a,r)=>a+r.mins,0);
  const calories=Math.round(rows.reduce((a,r)=>a+MET[r.type]*AVG*r.mins/60,0)*KCAL_MULT);

  const tc={},tCal={};
  rows.forEach(r=>{tc[r.type]=(tc[r.type]||0)+1;tCal[r.type]=(tCal[r.type]||0)+MET[r.type]*AVG*r.mins/60;});

  const favClass=Object.entries(tc).sort((a,b)=>b[1]-a[1])[0]?.[0]||'-';

  const slots={Morning:0,Midday:0,Evening:0};
  rows.forEach(r=>{const h=r.dt.getHours();if(!isNaN(h)){if(h<12)slots.Morning++;else if(h<15)slots.Midday++;else slots.Evening++;}});
  const peakTime=Object.entries(slots).sort((a,b)=>b[1]-a[1])[0]?.[0]||'-';

  // Monthly
  const mmap={};
  rows.forEach(r=>{if(!isNaN(r.dt)){const k=`${r.dt.getFullYear()}-${String(r.dt.getMonth()+1).padStart(2,'0')}`;mmap[k]=(mmap[k]||0)+1;}});
  const monthly=Object.entries(mmap).sort().map(([k,v])=>({label:new Date(k+'-01').toLocaleDateString('th-TH',{month:'short'}),sessions:v}));

  // Dates
  const valid=rows.map(r=>r.dt).filter(d=>!isNaN(d)).sort((a,b)=>a-b);
  const firstDate=valid[0],lastDate=valid[valid.length-1];
  const spanDays=firstDate&&lastDate?Math.max(1,Math.floor((lastDate-firstDate)/86400000)+1):1;
  // Use periodDays if provided (more accurate for filtered views), else use session span
  const days=periodDays?Math.max(periodDays,1):spanDays;
  const avgPerWeek=parseFloat((total/(days/7)).toFixed(1));

  // Consistency score
  const consistency=Math.min(100,Math.round((avgPerWeek/5)*100));

  // Burn score — based on adj kcal/week vs 1500 target
  const weeklyKcal=calories/(days/7);
  const burnScore=Math.min(100,Math.round((weeklyKcal/1500)*100));

  // Pilates Strain Score — total strain in period
  // weeklyStrain = raw sum (used by renderDash for recalculation with proper period)
  const weeklyStrain=rows.reduce((a,r)=>a+getStrainWeight(r.name)*(r.mins/60),0);
  // Normalize: use session span as fallback (renderDash overrides with proper period)
  const strainSpanDays=rows.length>=2
    ? Math.max(7,Math.ceil((Math.max(...rows.map(r=>r.dt))-Math.min(...rows.map(r=>r.dt)))/86400000)+1)
    : 7;
  const weekNorm=Math.max(strainSpanDays/7,1);
  const strainScore=Math.min(21,parseFloat((weeklyStrain/weekNorm).toFixed(1)));

  // Muscle group distribution
  const muscleMap={core:0,lower:0,upper:0,posture:0,flex:0};
  rows.forEach(r=>{
    const w=getStrainWeight(r.name)*(r.mins/60);
    getMuscleGroups(r.name).forEach(g=>{muscleMap[g]=(muscleMap[g]||0)+w;});
  });
  const muscleTotal=Object.values(muscleMap).reduce((a,b)=>a+b,1);
  const musclePct={};
  Object.entries(muscleMap).forEach(([k,v])=>{musclePct[k]=Math.round(v/muscleTotal*100);});

  // Top classes
  const topClasses=Object.entries(tc).sort((a,b)=>b[1]-a[1]).map(([type,count])=>({
    type,count,cals:Math.round(tCal[type]),color:COLORS[type],
  }));

  // Recent 5 sessions
  const recent=rows.sort((a,b)=>b.dt-a.dt).slice(0,5);

  // Progress: logarithmic curve (body improvement naturally plateaus)
  // 30 sessions~30%, 70~45%, 150~60%, 300~75%
  const logScale=(n,cap)=>Math.round(Math.log(n+1)/Math.log(cap+1)*85);
  const core=Math.min(80,Math.max(5,logScale(total,300)));
  const flexInput=(tc.Barre||0)*1.5+(tc.Yoga||0)*2+total*0.3;
  const flex=Math.min(75,Math.max(5,logScale(flexInput,200)));
  const postureInput=(tc.Reformer||0)*1.8+(tc.Private||0)*1.2+total*0.2;
  const posture=Math.min(78,Math.max(5,logScale(postureInput,250)));

  return{total,calories,totalMins,favClass,peakTime,consistency,burnScore,strainScore,
    weeklyStrain,musclePct,
    tc,topClasses,monthly,firstDate,lastDate,days,avgPerWeek,slots,recent,
    progress:{core,flex,posture}};
}

/* ── SVG Ring — WHOOP open-arc style ── */
function svgRing(pct,color,value,unit,label,sub='',size=176,stroke=16){
  const r=(size-stroke)/2;
  const cx=size/2,cy=size/2;
  // Open arc: 240° sweep (gaps at bottom), starting from -210° (bottom-left)
  const totalAngle=240; // degrees of arc shown
  const startAngle=-210; // starts bottom-left, going clockwise
  const endAngle=startAngle+totalAngle;

  function polarToXY(angleDeg,radius){
    const rad=angleDeg*Math.PI/180;
    return{x:cx+radius*Math.cos(rad),y:cy+radius*Math.sin(rad)};
  }

  function describeArc(startDeg,endDeg,radius){
    const start=polarToXY(startDeg,radius);
    const end=polarToXY(endDeg,radius);
    const largeArc=Math.abs(endDeg-startDeg)>180?1:0;
    return`M${start.x.toFixed(2)},${start.y.toFixed(2)} A${radius},${radius} 0 ${largeArc},1 ${end.x.toFixed(2)},${end.y.toFixed(2)}`;
  }

  const clampedPct=Math.min(pct/100,1);
  const fillEnd=startAngle+totalAngle*clampedPct;
  const bgPath=describeArc(startAngle,endAngle,r);
  const fillPath=clampedPct>0?describeArc(startAngle,fillEnd,r):'';
  const gradId='g'+Math.random().toString(36).slice(2,7);

  return`
  <div class="ring-item">
    <div style="position:relative;width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}" style="display:block;overflow:visible">
        <defs>
          <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${color}" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="${color}" stop-opacity="1"/>
          </linearGradient>
        </defs>
        <!-- Background track -->
        <path d="${bgPath}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="${stroke}" stroke-linecap="round"/>
        <!-- Filled arc -->
        ${fillPath?`<path d="${fillPath}" fill="none" stroke="url(#${gradId})" stroke-width="${stroke}" stroke-linecap="round"
          filter="drop-shadow(0 0 ${stroke/2}px ${color}66)"
          style="transition:stroke-dasharray .8s ease"/>`:``}
        <!-- End cap dot -->
        ${clampedPct>0.02?(()=>{const ep=polarToXY(fillEnd,r);return`<circle cx="${ep.x.toFixed(2)}" cy="${ep.y.toFixed(2)}" r="${stroke/2}" fill="${color}" filter="drop-shadow(0 0 6px ${color})"/>`;})():''}
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:12px">
        <span style="font-size:${size>140?42:24}px;font-weight:900;color:#fff;line-height:1;letter-spacing:-.03em">${value}</span>
        ${unit?`<span style="font-size:10px;color:rgba(255,255,255,0.3);margin-top:4px;letter-spacing:.14em;text-transform:uppercase">${unit}</span>`:''}
      </div>
    </div>
    <div class="ring-lbl" style="color:${color};letter-spacing:.22em;font-size:9px;font-weight:800;margin-top:-4px">
      ${label}
    </div>
    ${sub?`<div class="ring-sub">${sub}</div>`:''}
  </div>`;
}


/* ── SVG Ring Small — 3-ring layout ── */
function svgRingSmall(pct,color,centerHTML,label,size=120,stroke=10,pulse=false){
  const r=(size-stroke)/2;
  const cx=size/2,cy=size/2;
  const totalAngle=240;
  const startAngle=-210;
  const endAngle=startAngle+totalAngle;
  function polarToXY(a,radius){const rad=a*Math.PI/180;return{x:cx+radius*Math.cos(rad),y:cy+radius*Math.sin(rad)};}
  function describeArc(s,e,radius){
    const p1=polarToXY(s,radius),p2=polarToXY(e,radius);
    const la=Math.abs(e-s)>180?1:0;
    return`M${p1.x.toFixed(2)},${p1.y.toFixed(2)} A${radius},${radius} 0 ${la},1 ${p2.x.toFixed(2)},${p2.y.toFixed(2)}`;
  }
  const clamped=Math.min(pct/100,1);
  const fillEnd=startAngle+totalAngle*clamped;
  const bgPath=describeArc(startAngle,endAngle,r);
  const fillPath=clamped>0?describeArc(startAngle,fillEnd,r):'';
  const gradId='g'+Math.random().toString(36).slice(2,7);
  const endCap=clamped>0.02?(()=>{const ep=polarToXY(fillEnd,r);return`<circle cx="${ep.x.toFixed(2)}" cy="${ep.y.toFixed(2)}" r="${stroke/2}" fill="${color}" filter="drop-shadow(0 0 5px ${color})"/>`;})():'';
  const glowFilter=pulse?`filter="drop-shadow(0 0 8px ${color})"`:'' ;
  return`
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
    <div style="position:relative;width:${size}px;height:${size}px${pulse?';animation:burnPulse 2s ease-in-out infinite':''}">
      <svg width="${size}" height="${size}" style="display:block;overflow:visible">
        <defs>
          <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${color}" stop-opacity="0.75"/>
            <stop offset="100%" stop-color="${color}" stop-opacity="1"/>
          </linearGradient>
        </defs>
        <path d="${bgPath}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="${stroke}" stroke-linecap="round"/>
        ${fillPath?`<path d="${fillPath}" fill="none" stroke="url(#${gradId})" stroke-width="${stroke}" stroke-linecap="round" ${glowFilter}/>`:``}
        ${endCap}
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:10px;gap:2px">
        ${centerHTML}
      </div>
    </div>
    <div style="font-size:8px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:${color}">${label}</div>
  </div>`;
}

/* ── Burn Zone System ── */

    :consistency>=50

}



/* ── Radar Chart SVG ── */
function drawRadar(data, size=200){
  // data = {core, lower, upper, posture, flex} each 0-100
  const labels = ['CORE','LOWER','UPPER','POSTURE','FLEX'];
  const keys   = ['core','lower','upper','posture','flex'];
  const N = 5;
  const cx = size/2, cy = size/2;
  const maxR = size*0.38;
  const labelR = size*0.47;

  // Angles starting from top, clockwise
  const angles = keys.map((_,i) => (i * 2*Math.PI/N) - Math.PI/2);

  function pt(pct, angleIdx){
    const r = maxR * Math.min(pct/100, 1);
    return {
      x: cx + r * Math.cos(angles[angleIdx]),
      y: cy + r * Math.sin(angles[angleIdx]),
    };
  }

  // Grid rings (20%, 40%, 60%, 80%, 100%)
  const rings = [20,40,60,80,100].map(ring=>{
    const pts = keys.map((_,i)=>{
      const r2 = maxR*(ring/100);
      return `${cx+r2*Math.cos(angles[i])},${cy+r2*Math.sin(angles[i])}`;
    }).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
  }).join('');

  // Axis lines
  const axes = keys.map((_,i)=>{
    const end = pt(100,i);
    return `<line x1="${cx}" y1="${cy}" x2="${end.x}" y2="${end.y}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
  }).join('');

  // Data polygon
  const dataVals = keys.map(k=>Math.max(data[k]||0, 3));
  const dataPts  = dataVals.map((_,i)=>pt(dataVals[i],i));
  const dataPath = dataPts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')+'Z';

  // Detect imbalance — highlight low axes in orange
  const avgVal = dataVals.reduce((a,b)=>a+b,0)/N;
  const dotColors = dataVals.map(v=>v<15?'#FF9500':v===Math.max(...dataVals)?'#00CAFF':'rgba(255,255,255,0.4)');

  // Dots on vertices
  const dots = dataPts.map((p,i)=>`
    <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${dotColors[i]}"/>
  `).join('');

  // Labels
  const labelEls = keys.map((k,i)=>{
    const lx = cx + labelR*Math.cos(angles[i]);
    const ly = cy + labelR*Math.sin(angles[i]);
    const val = data[k]||0;
    const isLow = val < 15;
    return `
    <text x="${lx.toFixed(1)}" y="${(ly-6).toFixed(1)}" text-anchor="middle"
      font-size="9" font-weight="700" letter-spacing="0.06em"
      fill="${isLow?'#FF9500':'rgba(255,255,255,0.5)'}">${labels[i]}</text>
    <text x="${lx.toFixed(1)}" y="${(ly+7).toFixed(1)}" text-anchor="middle"
      font-size="10" font-weight="800"
      fill="${isLow?'#FF9500':'rgba(255,255,255,0.8)'}">${val}%</text>
    `;
  }).join('');

  // Pick fill color based on balance
  const minVal = Math.min(...dataVals);
  const fillColor = minVal >= 15 ? '#00CAFF' : '#FF9500';

  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    ${rings}
    ${axes}
    <path d="${dataPath}" fill="${fillColor}22" stroke="${fillColor}" stroke-width="2" stroke-linejoin="round"/>
    ${dots}
    ${labelEls}
  </svg>`;
}

/* ── Balance analysis ── */
function analyzeBalance(musclePct){
  const {core=0,lower=0,upper=0,posture=0,flex=0} = musclePct||{};
  const all=[];

  if(upper < 15) all.push({msg:'ลอง Upper Body & Back เพิ่มด้วยนะ',priority:2});
  if(flex  < 10) all.push({msg:'เพิ่ม Recovery class จะช่วยได้มาก',priority:1});
  if(lower < 10) all.push({msg:'ลอง Booty Lift หรือ Glutes & Legs บ้างไหม',priority:2});
  if(posture<10) all.push({msg:'Reformer Posture จะช่วย alignment ได้ดี',priority:3});
  if(core  > 55) all.push({msg:'Core หนักมาก ลอง Recovery class บ้างนะ',priority:1});

  // Sort by priority, cap at 2
  all.sort((a,b)=>a.priority-b.priority);
  const issues=all.slice(0,2).map(i=>i.msg);
  const balanced=all.length===0;
  const recs=issues;
  return{issues,recs,balanced};
}


/* ── Unified Recommendation Engine ── */
function getUnifiedRec(rd, musclePct){
  // Priority 1: Recovery state drives what class type
  const {core=0,lower=0,upper=0,posture=0,flex=0} = musclePct||{};
  const lastGroups = rd.lastGroups||[];

  if(rd.risk==='decon'){
    return {
      class: 'Basic Core | Reformer',
      reason: 'หายไปนาน — เริ่มด้วยคลาสเบาๆ เพื่อ re-activate กล้ามเนื้อ',
    };
  }

  if(rd.risk==='overstrain'){
    // Last class was heavy — recommend opposite muscle group or flex
    if(lastGroups.includes('lower')) return {class:'Yoga for Office Syndrome', reason:'Lower body กำลัง recover — เปลี่ยนไป Upper + Flex'};
    if(lastGroups.includes('upper')) return {class:'Booty Lift', reason:'Upper body กำลัง recover — สลับมา Lower body'};
    return {class:'Yoga or Harmony Hour', reason:'ร่างกายต้องการ recovery วันนี้'};
  }

  if(rd.risk==='moderate'){
    // Moderate recovery — recommend lighter version of most needed group
    if(upper < 15) return {class:'Upper Body & Back | Reformer', reason:'Upper body underused + recovery ยังไม่เต็ม'};
    if(flex < 10)  return {class:'Pilar Barre Signature', reason:'เพิ่ม flexibility — ร่างกายพักพอแล้ว'};
    return {class:'Reformer Posture', reason:'Recovery ดี — เน้น posture alignment'};
  }

  // READY — recommend based on imbalance
  if(upper < 15) return {class:'Upper Body & Back | Reformer', reason:'Upper body ขาดการเทรน — วันนี้เหมาะมาก'};
  if(flex < 10)  return {class:'Yoga or Harmony Hour', reason:'ไม่มี recovery class เลย — ร่างกายต้องการ'};
  if(lower < 15) return {class:'Glutes & Legs Power | Reformer', reason:'Lower body ต้องการ attention'};
  if(posture < 10) return {class:'Reformer Posture | Reformer', reason:'Posture training ต่ำ'};
  // Balanced — push intensity
  return {class:'PILAR Flow & Control | Reformer', reason:'ร่างกายสมดุลและพร้อม — push ได้เลย'};
}

/* ── Swipe panel controller ── */
let _mpi=0;
function setMPanel(i,anim=true){
  _mpi=Math.max(0,Math.min(2,i));
  const p=document.getElementById('mainSwipePanels'),wrap=document.getElementById('mainSwipeWrap');
  if(!p)return;
  if(!anim){const ot=p.style.transition;p.style.transition='none';p.style.transform=`translateX(${-_mpi*100}%)`;requestAnimationFrame(()=>{p.style.transition=ot;});}
  else p.style.transform=`translateX(${-_mpi*100}%)`;
  const panels=p.querySelectorAll('.ms-panel');
  if(wrap&&panels[_mpi])setTimeout(()=>{wrap.style.height=panels[_mpi].scrollHeight+'px';},anim?360:0);
  document.querySelectorAll('.sw-dot').forEach((d,j)=>d.classList.toggle('active',j===_mpi));
}
function initSwipeTouch(){
  const wrap=document.getElementById('mainSwipeWrap');if(!wrap)return;
  let sx=0,sy=0,locked=null;
  wrap.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;locked=null;},{passive:true});
  wrap.addEventListener('touchmove',e=>{
    const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    if(!locked)locked=Math.abs(dx)>Math.abs(dy)?'h':'v';
    if(locked==='h')e.preventDefault();
  },{passive:false});
  wrap.addEventListener('touchend',e=>{
    if(locked!=='h')return;
    const dx=sx-e.changedTouches[0].clientX;
    if(Math.abs(dx)>40)setMPanel(dx>0?_mpi+1:_mpi-1);
  });
}

/* ════════════════════════════════════════════════════════════
   NEW HOME DASHBOARD — Training Insight + Home
   6 pills. Reuses: process, calcStreak, isPersonalBest,
   svgRingSmall, classify, getStrainWeight, COLORS, allBookings
   ════════════════════════════════════════════════════════════ */

/* Helper: all booked sessions for a member, sorted oldest→newest */
function _memberSessions(name){
  return allBookings
    .filter(b=>b.contact_name===name && b.booking_status==='Booked')
    .map(b=>({dt:new Date(b.event_date),name:b.event_name||'',type:classify(b.event_name||'',b.instructors),
              mins:parseInt(b.duration)||60,instructor:(b.instructors||'').trim()}))
    .filter(r=>!isNaN(r.dt)&&r.dt<=new Date())
    .sort((a,b)=>a.dt-b.dt);
}

/* Helper: Monday-anchored week key */
/* ════════════════════════════════════════════════════════════
   INSIGHT ENGINE (Phase A) — context turns numbers into meaning.
   _percentileVsSelf: where does `value` rank within `history`?
   _periodScores: rebuild this metric for each comparable past period.
   Confidence gate: percentile only shown when history is long enough.
   ════════════════════════════════════════════════════════════ */
function _percentileVsSelf(value, history){
  // history = array of past comparable values (excluding current). Returns
  // {pct, beat, n, strong} where pct = % of history this value is >= to.
  const clean = history.filter(v=>typeof v==='number'&&!isNaN(v));
  const n = clean.length;
  if(n < 8) return {pct:null, beat:0, n, strong:false};   // gate: need ≥8
  const beat = clean.filter(v=>value > v).length;
  const tie  = clean.filter(v=>Math.abs(value-v)<1e-6).length;
  const pct  = Math.round(((beat + tie*0.5) / n) * 100);
  return {pct, beat, n, strong:true};
}

/* Build weekly strain scores across the member's whole history (for percentile). */
function _weeklyStrainHistory(name){
  const sess = allBookings.filter(b=>b.contact_name===name && b.booking_status==='Booked');
  const byWk = {};
  sess.forEach(b=>{
    const d=new Date(b.event_date); if(isNaN(d)) return;
    const k=_weekKey(d);
    const nm=(b.event_name||''); const mins=parseInt(b.duration)||60;
    byWk[k]=(byWk[k]||0) + getStrainWeight(nm)*(mins/60);
  });
  return Object.entries(byWk).sort((a,b)=>a[0]-b[0]).map(([wk,v])=>({wk:+wk, score:Math.min(21,parseFloat((v*1.3).toFixed(1)))}));
}

/* Build monthly class-count history (for "Top X% of your year"). */
function _monthlyCountHistory(name){
  const sess = allBookings.filter(b=>b.contact_name===name && b.booking_status==='Booked');
  const byMo = {};
  sess.forEach(b=>{
    const d=new Date(b.event_date); if(isNaN(d)) return;
    const k=d.getFullYear()*12+d.getMonth();
    byMo[k]=(byMo[k]||0)+1;
  });
  return Object.entries(byMo).sort((a,b)=>a[0]-b[0]).map(([mo,c])=>({mo:+mo, count:c}));
}

/* Recommendation — derived from data state, never random. Returns one line. */
/* action pill template — no label, no border, just a soft chip */
/* ── Smooth SVG line chart — used by activity/frequency sheets ──
   counts : number[]   (weekly class counts, oldest→newest)
   baseline: number    (lifetime avg, drawn as dashed line)
   W,H: canvas size in px
   color: stroke color
   compact: bool (true = mini card version, false = full sheet)
*/
function _freqLineChart(counts,baseline,W,H,color,compact){
  if(!counts.length) return '';
  const n=counts.length;
  const mx=Math.max(...counts,baseline*1.4,1);
  const pad={t:compact?6:24,r:compact?4:8,b:compact?4:20,l:compact?4:4};
  const cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
  // map value → y (flipped: high value = low y)
  const vy=v=>pad.t+ch-(v/mx*ch);
  // map index → x
  const vx=i=>pad.l+(n===1?cw/2:i/(n-1)*cw);
  // smooth cubic bezier through points
  const pts=counts.map((c,i)=>({x:vx(i),y:vy(c)}));
  let d='';
  if(pts.length===1){
    d=`M${pts[0].x},${pts[0].y} L${pts[0].x},${pts[0].y}`;
  } else {
    d=`M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
    for(let i=1;i<pts.length;i++){
      const prev=pts[i-1],cur=pts[i];
      const cx1=prev.x+(cur.x-prev.x)*0.45;
      const cx2=cur.x-(cur.x-prev.x)*0.45;
      d+=` C${cx1.toFixed(1)},${prev.y.toFixed(1)} ${cx2.toFixed(1)},${cur.y.toFixed(1)} ${cur.x.toFixed(1)},${cur.y.toFixed(1)}`;
    }
  }
  // area path: line path + close to bottom
  const areaD=d+` L${pts[pts.length-1].x.toFixed(1)},${(pad.t+ch).toFixed(1)} L${pts[0].x.toFixed(1)},${(pad.t+ch).toFixed(1)} Z`;
  // baseline y
  const by=vy(baseline);
  const gradId='fg'+Math.random().toString(36).slice(2,7);
  const ep=pts[pts.length-1]; // endpoint
  const dotR=compact?3:4.5;
  const baseLabel=compact?'':'YOUR USUAL';
  const moreLbl=compact?'':baseline>0?`<text x="${(pad.l+cw).toFixed(1)}" y="${(Math.min(by-6,pad.t+8)).toFixed(1)}" text-anchor="end" font-size="8" font-weight="700" letter-spacing=".08em" fill="${color}" opacity=".7">MORE THAN USUAL</text>`:'';
  const lessLbl=compact?'':baseline>0?`<text x="${(pad.l+cw).toFixed(1)}" y="${(pad.t+ch).toFixed(1)}" text-anchor="end" font-size="8" font-weight="700" letter-spacing=".08em" fill="rgba(120,120,128,0.55)">LESS THAN USUAL</text>`:'';
  // x-axis month labels (sheet only, first + last)
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block;overflow:visible">
    <defs>
      <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="${compact?0.18:0.22}"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${baseline>0?`<line x1="${pad.l}" y1="${by.toFixed(1)}" x2="${(pad.l+cw).toFixed(1)}" y2="${by.toFixed(1)}" stroke="rgba(120,120,128,0.35)" stroke-width="1" stroke-dasharray="3,3"/>`:'' }
    ${baseline>0&&!compact?`<text x="${pad.l.toFixed(1)}" y="${(by-4).toFixed(1)}" font-size="8" font-weight="600" letter-spacing=".06em" fill="rgba(120,120,128,0.55)">${baseLabel}</text>`:''}
    ${moreLbl}${lessLbl}
    <path d="${areaD}" fill="url(#${gradId})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="${compact?1.8:2.2}" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${ep.x.toFixed(1)}" cy="${ep.y.toFixed(1)}" r="${dotR}" fill="${color}"/>
  </svg>`;
}
function _actionPill(text, soft, accent){
  return `<div style="margin-top:14px;display:inline-flex;align-items:center;padding:5px 12px;border-radius:8px;background:${soft}">
    <span style="font-size:11px;font-weight:600;color:${accent}">${text}</span>

function _loadRecommendation(score, formatShare, classCount){
  // score is the 0–100 Activity Score; formatShare = {name,pct} of dominant format (or null)
  // classCount = total classes in period; used to hold back format-variety nudges from
  // members who are only just starting (suggesting "try another format" after 1-2 classes
  // reads as a push, not encouragement — off-brand for a calm wellness product).
  const _established = (classCount==null) || classCount >= 4;
  if(score >= 88) return 'Strong effort. Leave room to recover';
  if(score >= 70) return 'A rest day keeps this sustainable';
  if(_established && formatShare && formatShare.pct >= 55) return 'Try another format for balance';
  if(score < 25)  return 'Room to build when you are ready';
  return 'A healthy rhythm. Keep it steady';
}

function _weekKey(d){
  const x=new Date(d); const dow=(x.getDay()+6)%7;
  x.setDate(x.getDate()-dow); x.setHours(0,0,0,0);
  return x.getTime();
}

/* Helper: sessions grouped by week, every week from first→now (gaps=0) */
function _weeklySeries(rows){
  if(!rows.length) return [];
  const counts={};
  rows.forEach(r=>{const k=_weekKey(r.dt); counts[k]=(counts[k]||0)+1;});
  const firstWk=_weekKey(rows[0].dt);
  const nowWk=_weekKey(new Date());
  const out=[]; const WK=86400000*7;
  for(let t=firstWk;t<=nowWk;t+=WK){ out.push({wk:t,count:counts[t]||0}); }
  return out;
}

/* Precision progress ring — single clean butt-cap stroke, subtle gradient (sport style) */
function ahRing(pct,size,stroke,color,centerHTML){
  const r=(size-stroke)/2, cx=size/2, cy=size/2;
  const total=348, start=60; // start at 4 o'clock, sweep clockwise
  const p2x=(a,rad)=>({x:cx+rad*Math.cos(a*Math.PI/180),y:cy+rad*Math.sin(a*Math.PI/180)});
  const arc=(s,e)=>{const a=p2x(s,r),b=p2x(e,r);const la=Math.abs(e-s)>180?1:0;return`M${a.x.toFixed(2)},${a.y.toFixed(2)} A${r},${r} 0 ${la},1 ${b.x.toFixed(2)},${b.y.toFixed(2)}`;};
  const cl=Math.min(pct/100,1);
  const arcLen=2*Math.PI*r*(total/360);     // full track arc length
  const fillLen=arcLen*cl;                    // visible portion
  const gid='ahr'+Math.random().toString(36).slice(2,7);
  const sid='ahs'+Math.random().toString(36).slice(2,7);
  const trackPath=arc(start,start+total);
  // Apple gimmick #1: rounded caps — energy reads as continuous, not a stopped gauge.
  const rs=Math.max(stroke*0.6,6);
  // Apple gimmick #2: directional gradient aligned to the arc's sweep —
  // tail darker, head brighter, so light appears to travel along the ring.
  // Gradient is mapped across the FULL track span (start→end), so the colour
  // stays stable while the stroke is revealed frame-by-frame during the count-up.
  const gA=p2x(start,r), gB=p2x(start+total,r);
  return `<div style="position:relative;width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" style="display:block;overflow:visible">
      <defs>
        <linearGradient id="${gid}" gradientUnits="userSpaceOnUse"
          x1="${gA.x.toFixed(1)}" y1="${gA.y.toFixed(1)}" x2="${gB.x.toFixed(1)}" y2="${gB.y.toFixed(1)}">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.72"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="1"/>
        </linearGradient>
        <filter id="${sid}" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="0.5" stdDeviation="0.6" flood-color="rgba(0,0,0,1)" flood-opacity="0.16"/>
        </filter>
      </defs>
      <path d="${trackPath}" fill="none" stroke="color-mix(in srgb, ${color} 14%, transparent)" stroke-width="${rs}" stroke-linecap="round"/>
      ${cl>0?`<path class="ah-ring-fill" data-ring="hero" d="${trackPath}" fill="none" stroke="url(#${gid})" stroke-width="${rs}" stroke-linecap="round"
          filter="url(#${sid})"
          stroke-dasharray="${arcLen.toFixed(1)}" stroke-dashoffset="${arcLen.toFixed(1)}"
          data-arclen="${arcLen.toFixed(1)}" data-target-offset="${(arcLen-fillLen).toFixed(1)}" data-target-pct="${(cl*100).toFixed(2)}"
          style="--dash:${arcLen.toFixed(1)};--offset:${(arcLen-fillLen).toFixed(1)}"/>`:''}
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px">${centerHTML}</div>
  </div>`;
}

  const diffDays=Math.round((n0-d0)/dayMs);

  if(diffDays<=0) whenWord='Today';
  else if(diffDays===1) whenWord='Yesterday';
  else if(diffDays<7) whenWord=d.toLocaleDateString('en-US',{weekday:'long'});
  else whenWord=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const hasTime=d.getHours()!==0||d.getMinutes()!==0;

  const coach=(_coachName && !_coachBare)?`with ${_coachName.split(/\s+/)[0]}`:'';
  return [whenWord,timeStr,coach].filter(Boolean).join(' · ');
}

/* ── Activity Score model ──
   Converts the internal 0–21 strain into a friendly 0–100 "Activity Score".
   The curve lifts the mid-range a touch so an ordinary-but-real week never
   reads as a near-zero — movement should feel rewarded, not graded harshly.
*/
function _activityScore(classesPerWeek, consecutiveRestDays){
  // Studio-calibrated: score reflects classes/week (strain-adjusted), not a 0-21 cap.
  // Saturating curve hits the anchors the studio cares about:
  //   2/wk → 71 (Very Active), 3/wk → 84, 4/wk → 92, 5/wk → 95.
  // Matches Pilates reality where 2-4 classes/week is a strong, healthy rhythm.
  if(classesPerWeek<=0) return 0;
  const k=0.62;
  const raw=Math.max(1,Math.min(100,Math.round(100*(1-Math.exp(-k*classesPerWeek)))));
  // recency decay on CONSECUTIVE rest days (grace 5 days, gentle sqrt fade, floor 10%).
  const grace=5, fadeWindow=120;
  const gap=consecutiveRestDays!=null?Math.max(0,consecutiveRestDays-grace):0;
  const decay=gap>0?Math.max(0.1,1-Math.sqrt(gap/fadeWindow)):1;
  return Math.max(0,Math.round(raw*decay));
}
/* English assessment tier (Apple-style) — reads as a graded score, not a behaviour description */
function _activityTier(s){
  return s>=90 ? 'Excellent'
    : s>=70 ? 'Very Active'
    : s>=50 ? 'Good'
    : s>=30 ? 'Building'
    : s>=1  ? 'Getting Started'
    :         'Ready to Move';
}
/* Ring colour — WHOOP-recovery-style zones, tuned softer for Pilar (a calm wellness brand,
   not a performance tool). Low scores read as warm AMBER (never red — we don't scold), and
   green starts creeping in early, around 45, so members feel encouraged sooner than WHOOP's
   67 threshold. Continuous blend so there's no hard jump between zones.
   amber #E0A45C  →  green #30D158, eased by score. */
function _activityRingColor(s){
  const GREEN='#30D158', AMBER=[224,164,92], G=[48,209,88];
  if(s>=70) return GREEN;                          // 70+ : vivid green, unchanged
  if(s<=15) return `rgb(${AMBER[0]},${AMBER[1]},${AMBER[2]})`;   // very low : warm amber, not red
  const t=Math.max(0,Math.min(1,(s-15)/(70-15)));  // 0..1 amber to green; green visible from ~45
  const r=Math.round(AMBER[0]+(G[0]-AMBER[0])*t);
  const g=Math.round(AMBER[1]+(G[1]-AMBER[1])*t);
  const b=Math.round(AMBER[2]+(G[2]-AMBER[2])*t);
  return `rgb(${r},${g},${b})`;
}

/* ── Canonical Activity Score for a member over a period (single source of truth) ──
   Both the main hero card and the share sticker call THIS, so the number can never
   diverge between the two surfaces. days=null means all-time.
   Returns {score, count, tier, color, classesPerWeek, restDays}. */
function _periodActivity(name, days){
  const allSess=allBookings.filter(b=>b.contact_name===name&&b.booking_status==='Booked');
  const periodSess=filterByPeriod(allSess, days);
  const stats=process(periodSess, days);
  const count=stats?stats.total:0;
  if(!stats||!count){
    return {score:0,count:0,tier:_activityTier(0),color:_activityRingColor(0),classesPerWeek:0,restDays:null};
  }
  // effective classes/week over the member's actual span in this period (matches sheet logic)
  const _pSess=periodSess.map(b=>new Date(b.event_date)).filter(d=>!isNaN(d)).sort((a,b)=>a-b);
  const _spanDays=_pSess.length>=2?Math.max(7,Math.ceil((_pSess[_pSess.length-1]-_pSess[0])/86400000)+1):7;
  const _weeks=Math.max(_spanDays/7,1);
  const classesPerWeek=(stats.weeklyStrain/3.0)/_weeks;
  let _consRest=null;
  if(days){
    const _allD=new Set(allSess.map(b=>{const d=new Date(b.event_date);d.setHours(0,0,0,0);return d.getTime();}));
    const _t=new Date();_t.setHours(0,0,0,0);_consRest=0;
    for(let i=0;i<180;i++){const d=new Date(_t);d.setDate(_t.getDate()-i);if(_allD.has(d.getTime()))break;_consRest++;}
  }
  const score=_activityScore(classesPerWeek,_consRest);
  return {score,count,tier:_activityTier(score),color:_activityRingColor(score),classesPerWeek,restDays:_consRest};
}

/* ═══════════════════════════════════════════════════════════════════════
   CONSISTENCY SCORE — the hero metric (replaces Activity Score up top).
   A transparent 0-100% built from three parts a member can FEEL:
     • Attendance 60  — did you hit the 2/week target for this period
     • Rhythm     25  — did you space classes out (not cram then vanish)
     • Streak     15  — did you keep the weekly chain alive
   One source of truth: hero card + detail sheet + share sticker all call this,
   so the % can never diverge between surfaces. days=null => all-time.
   ═══════════════════════════════════════════════════════════════════════ */
const CONSISTENCY_TARGET_PER_WEEK = 2;  // studio standard: 2 classes / week = on target

/* State label from % (parallel to _activityTier but consistency-flavoured) */
function _consistencyState(p){
  return p>=90 ? 'Perfect'
    : p>=70 ? 'On Track'
    : p>=50 ? 'Building'
    : p>=30 ? 'Warming Up'
    : p>=1  ? 'Just Started'
    :         'Ready';
}

/* Rhythm sub-score: rewards spacing classes evenly vs cramming them.
   Looks at gaps (in days) between consecutive sessions in the period.
   Ideal gap ~ 7/target = 3.5d. Cramming (gap<1.5d) or long voids drag it down.
   Returns 0..1. */
function _rhythmFactor(dates){
  if(!dates || dates.length<2) return dates && dates.length===1 ? 0.5 : 0;
  const day=86400000;
  const gaps=[];
  for(let i=1;i<dates.length;i++){
    const g=(dates[i]-dates[i-1])/day;
    if(g>=0) gaps.push(g);
  }
  if(!gaps.length) return 0.5;
  const ideal=7/CONSISTENCY_TARGET_PER_WEEK;   // 3.5 days
  // per-gap score: 1.0 at ideal, fades steeply for cram (small) or void (large).
  // Cram uses a squared curve so back-to-back days (gap≈1) score much lower than
  // a genuine ~3-4 day spacing — this is what separates "อัดวัน" from "สม่ำเสมอ".
  let sum=0;
  gaps.forEach(g=>{
    let f;
    if(g<=ideal){ const t=g/ideal; f = t*t; }         // cram: squared → punishes gap≈1 harder
    else { f = Math.max(0, 1-(g-ideal)/(ideal*3)); }  // void: fade over ~3x ideal
    sum += Math.max(0,Math.min(1,f));
  });
  const meanF=sum/gaps.length;
  // consistency-of-gaps: penalise erratic spacing (e.g. 1,6,1,6) vs steady (3,4,3,4).
  const meanGap=gaps.reduce((a,b)=>a+b,0)/gaps.length;
  const variance=gaps.reduce((a,g)=>a+(g-meanGap)*(g-meanGap),0)/gaps.length;
  const cv=meanGap>0?Math.sqrt(variance)/meanGap:0;          // coefficient of variation
  const steadiness=Math.max(0,1-cv*0.6);                     // 1=perfectly even, fades as erratic
  return Math.max(0,Math.min(1, meanF*0.7 + meanF*steadiness*0.3));
}

/* Canonical Consistency for a member over a period.
   Returns {pct, state, count, target, attPts, rhythmPts, streakPts,
            avgGap, favDay, streak, best, series}. */
function _periodConsistency(name, days){
  const allSess=allBookings.filter(b=>b.contact_name===name&&b.booking_status==='Booked');
  const periodSess=filterByPeriod(allSess, days);
  const dates=periodSess.map(b=>new Date(b.event_date)).filter(d=>!isNaN(d)).sort((a,b)=>a-b);
  const count=dates.length;

  // full weekly series + streaks (all-time, for the chain component + drill-down)
  const allRows=allSess.map(b=>({dt:new Date(b.event_date)})).filter(r=>!isNaN(r.dt)).sort((a,b)=>a.dt-b.dt);
  const series=_weeklySeries(allRows);
  const streak=calcStreak(name);
  const best=_longestStreak(allRows);

  if(!count){
    return {pct:0,state:_consistencyState(0),count:0,target:0,
            attPts:0,rhythmPts:0,streakPts:0,avgGap:0,favDay:'—',
            streak,best,series};
  }

  // ══ Consistency model (D) ══════════════════════════════════════════════
  // The number IS the dots: each week is graded on the same rule the meter shows
  //   2+ classes = 100 · 1 class = 82 · none = 0
  // then three layers give it depth, each one readable off the card:
  //   · recency weight  — newest week counts 1.0, oldest in the window 0.6
  //   · rhythm bonus    — 2+/wk: days spread apart · 1/wk: steady interval + same weekday
  //   · streak bonus    — consecutive green weeks (the run of dots you can see)
  // A 1-class-per-week member lands 82–88; 100 stays reserved for hitting 2/week.
  const DAY=86400000;
  const _wk=d=>{const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x.getTime();};
  const nowWk=_wk(new Date());
  const nWk=days?Math.max(1,Math.ceil(days/7)):Math.min(52,Math.max(4,Math.ceil(((nowWk-_wk(dates[0]))/DAY+7)/7)));
  // per-week class dates, oldest → newest
  const buckets=Array.from({length:nWk},()=>[]);
  dates.forEach(d=>{const back=Math.round((nowWk-_wk(d))/(7*DAY));if(back>=0&&back<nWk)buckets[nWk-1-back].push(d);});
  const target=days===7?CONSISTENCY_TARGET_PER_WEEK:CONSISTENCY_TARGET_PER_WEEK*nWk;
  // keep the headline count on the SAME window the score grades (all-time = last 52 weeks)
  const scoredCount=buckets.reduce((s,b)=>s+b.length,0);

  // ── layer 1 · weekly grade × recency weight ──
  // Mondays the studio is closed, so an unfinished week is judged only on the days that
  // were actually open — a fresh week can't drag the score down before it has a chance.
  const _dowIdx=(new Date().getDay()+6)%7;               // 0=Mon … 6=Sun
  const openElapsed=Math.max(0,Math.min(6,_dowIdx));      // Mon→0, Tue→1 … Sun→6
  const progress=openElapsed/6;
  const GRADE=n=>n>=2?100:n===1?74:0;
  let wSum=0,gSum=0;
  buckets.forEach((b,i)=>{
    let w=nWk===1?1:0.6+0.4*(i/(nWk-1));    // oldest 0.6 → newest 1.0
    const isCurrent=i===nWk-1;
    if(isCurrent&&!b.length) w*=progress;   // empty in-progress week fades in as the week runs
    wSum+=w; gSum+=GRADE(b.length)*w;
  });
  const base=wSum?gSum/wSum:0;

  // ── layer 2 · rhythm bonus (0–6) ──
  // 2+/wk weeks score on in-week spread; 1/wk weeks on interval steadiness + weekday habit
  let rhySum=0,rhyN=0;
  buckets.forEach(b=>{
    if(b.length>=2){
      const g=b.slice(1).map((d,i)=>(d-b[i])/DAY);
      const best=g.reduce((m,x)=>Math.max(m,Math.min(1,x/2)),0);   // ≥2 days apart = full
      rhySum+=best; rhyN++;
    }
  });
  const singleIdx=buckets.map((b,i)=>b.length===1?i:-1).filter(i=>i>=0);
  const single=singleIdx.map(i=>buckets[i][0]);
  if(single.length>=2){
    // adjacent single weeks only — a skipped week is already penalised in the base
    const gaps=[];
    for(let k=1;k<single.length;k++){
      if(singleIdx[k]-singleIdx[k-1]===1) gaps.push((single[k]-single[k-1])/DAY);
    }
    if(!gaps.length) gaps.push(7);
    const mean=gaps.reduce((a,b)=>a+b,0)/gaps.length;
    const sd=Math.sqrt(gaps.reduce((a,g)=>a+(g-mean)*(g-mean),0)/gaps.length);
    const steady=Math.max(0,1-sd/4);                               // sd 0d = full, 4d+ = none
    const dow={}; single.forEach(d=>{dow[d.getDay()]=(dow[d.getDay()]||0)+1;});
    const habit=Math.max(...Object.values(dow))/single.length;     // same weekday share
    rhySum+=(steady*0.65+habit*0.35)*single.length; rhyN+=single.length;
  }
  const rhythmF=rhyN?(rhySum/rhyN):0;

  // ── layer 3 · streak bonus (0–5) — the visible run of green dots ──
  let runW=0;
  for(let i=buckets.length-1;i>=0;i--){ if(buckets[i].length) runW++; else break; }
  const streakF=Math.min(runW/12,1);

  // Bonuses fill the headroom between the weekly base and this period's ceiling, so the
  // 1-class-per-week member genuinely travels 74 → 88 instead of pinning at the cap.
  const oneOnly=buckets.some(b=>b.length)&&buckets.every(b=>b.length<=1);
  const cap=oneOnly?88:100;
  const head=Math.max(0,cap-base);
  const bonus=head*(rhythmF*0.55+streakF*0.45);
  const rhythmBonus=head*rhythmF*0.55, streakBonus=head*streakF*0.45;
  const pct=Math.max(0,Math.min(cap,Math.round(base+bonus)));
  const attPts=base*0.6, rhythmPts=rhythmF*25, streakPts=streakF*15;  // legacy shape for the drill-down copy


  // ── extras for the drill-down (avg gap, favourite weekday) ──
  const day=86400000; let gapSum=0,gapN=0;
  for(let i=1;i<dates.length;i++){const g=(dates[i]-dates[i-1])/day;if(g>=0){gapSum+=g;gapN++;}}
  const avgGap=gapN?gapSum/gapN:0;
  const dowCount=[0,0,0,0,0,0,0];
  dates.forEach(d=>dowCount[d.getDay()]++);
  const dowNamesTH=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];
  const favDay=dowNamesTH[dowCount.indexOf(Math.max(...dowCount))];

  return {pct,state:_consistencyState(pct),count:scoredCount,target,
          attPts,rhythmPts,streakPts,avgGap,favDay,streak,best,series};
}


/* Consistency sparkline — thin monotone curve of the last 12 weeks' class counts,
   with a soft gradient fill + an accent dot on the latest week. Pure periwinkle,
   no axes — a calm "rhythm" glance that lives inside the hero. */
function _consistencySpark(series, w, h){
  const wks=(series||[]).slice(-12).map(x=>x.count);
  if(wks.length<2) return '';
  const max=Math.max(2,...wks), n=wks.length;
  const pts=wks.map((v,i)=>[(i/(n-1))*w, h-3-(v/max)*(h-8)]);
  let path=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],mx=((a[0]+b[0])/2).toFixed(1);
    path+=` C${mx},${a[1].toFixed(1)} ${mx},${b[1].toFixed(1)} ${b[0].toFixed(1)},${b[1].toFixed(1)}`;}
  const last=pts[n-1];
  const fid='csf'+Math.random().toString(36).slice(2,7);   // area fill (horiz, clear→tint)
  const lid='csl'+Math.random().toString(36).slice(2,7);   // line (horiz, faint→solid)
  const pathLen=Math.round(w*1.4);
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;overflow:visible">
    <defs>
      <linearGradient id="${fid}" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="var(--ah-accent)" stop-opacity="0"/>
        <stop offset="0.5" stop-color="var(--ah-accent)" stop-opacity="0.05"/>
        <stop offset="1" stop-color="var(--ah-accent)" stop-opacity="0.16"/></linearGradient>
      <linearGradient id="${lid}" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#8B9BFF" stop-opacity="0.18"/>
        <stop offset="0.55" stop-color="#6B7FF0" stop-opacity="0.7"/>
        <stop offset="1" stop-color="#4C5FD6" stop-opacity="1"/></linearGradient>
    </defs>
    <path d="${path} L${w},${h} L0,${h} Z" fill="url(#${fid})" class="ah-con-fill"/>
    <path d="${path}" fill="none" stroke="url(#${lid})" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
      class="ah-con-line" style="stroke-dasharray:${pathLen};stroke-dashoffset:${pathLen}"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.4" fill="#6B7FF0" class="ah-con-live-halo"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="#4C5FD6"/>
  </svg>`;
}

/* Hero card tint: 0% = grey-black, 80%+ = full green (ref card) */
const _tintGens={};
function _tintSched(p,getEl,key){
  key=key||'dash';
  const gen=_tintGens[key]=(_tintGens[key]||0)+1; // a newer call for the same slot kills this one — no fighting schedulers
  let n=0;
  const tick=()=>{if(_tintGens[key]!==gen)return false;const el=getEl();if(el&&el.dataset.tintPct!==String(p)){el.dataset.tintPct=String(p);_tintEase(el,p,key);}return true;};
  tick();
  // one timer (was a timer AND a per-frame rAF loop running for 8s after every render)
  const iv=setInterval(()=>{if(!tick()||++n>16)clearInterval(iv);},100);
}
/* ease the glass from its CURRENT tint to the new score, in step with the numeral count-up */
const _tintCur={};  // survives card re-renders (keyed per slot, not per node)
function _tintEase(el,p,key){
  key=key||'dash';
  if(!(p>0)){delete _tintCur[key];_heroTint(0,el);return;}
  const from=_tintCur[key]||1;  // start from the color on screen, not the olive floor
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){_tintCur[key]=p;_heroTint(p,el);return;}
  const D=1100,t0=performance.now(),ease=x=>1-Math.pow(1-x,3);
  const tag=el.dataset.tintPct;
  (function f(){
    if(!el.isConnected||el.dataset.tintPct!==tag)return;
    const k=Math.min(1,(performance.now()-t0)/D);
    const v=from+(p-from)*ease(k);
    _tintCur[key]=v;
    _heroTint(v,el);
    if(k<1)requestAnimationFrame(f);
  })();
  setTimeout(()=>{if(el.isConnected&&el.dataset.tintPct===tag){_tintCur[key]=p;_heroTint(p,el);}},D+150); // hidden-tab fallback: final state guaranteed
}
function _heroTint(pct,elOpt){
  // Neutral slate glass (20b): clear any inline tint so the CSS dusk gradient shows through.
  const host=document.getElementById('ahHeroBody');
  const card=elOpt||(host&&host.closest('.ah-card'));
  if(!card)return;
  card.style.background='';card.style.boxShadow='';
  card.style.backdropFilter='';card.style.webkitBackdropFilter='';
  const w=card.parentElement,a=w&&w.querySelector(':scope > .hero-aura');if(a)a.remove();
}
/* Compute + render the hero body for a given member & period key */
function _heroBody(name,rangeKey){

  const _con=_periodConsistency(name, range.days);
  _tintSched(_con.count?_con.pct:0,()=>{const h=document.getElementById('ahHeroBody');const c=h&&h.closest('.ah-card');return (c&&h.innerHTML)?c:null;});

  if(!_con.count && !range.days){
    return `<div class="ah-hero">
      <div class="ah-say ah-say-c" style="padding:16px 0">No classes in the last ${range.label} — try a longer range</div>

       <span class="ah-hero-num" data-count="${_con.pct}" style="font-size:30px;font-weight:600;color:var(--ah-ink);letter-spacing:-0.03em;line-height:1">${_con.pct}</span>
       <span style="font-size:15px;font-weight:500;color:var(--ah-grey-2);margin-left:1px">%</span>

  // "feel it" sub-line: state + how close to full this period


  // weekly heatmap, bottom-right: 24 wks · 12×2 grid. Threshold fill = the "full" feel:
  // ≥2/wk = solid white (100%), 1 = 75%, 0 = faint 15%. Current week ringed.
  // hero meter (21b) — ALWAYS one row of tick cells with labels underneath
  const _dots=(()=>{
    const NEON='rgba(163,255,88,0.95)',SOFT='rgba(163,255,88,0.42)';

    if(range.days===7){

  })();
  return `<div class="ah-hero-glass" style="display:flex;flex-direction:column;min-height:118px">
    <div style="flex:1;min-height:26px"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:14px">

        <span style="font-size:14px;font-weight:500;color:var(--ah-grey-2);margin-left:4px">%</span>
      </span>
      <span style="flex-shrink:0">${_dots}</span>
    </div>
  </div>`;
}

/* segmented ring — 5 arcs, one per consecutive week; fills clockwise */
function ahSegRing(filled,size,stroke,color,gap){
  const r=(size-stroke)/2-1.5, cx=size/2, cy=size/2;   // -1.5 keeps round caps inside the box
  const segs=5; gap=gap||20; const total=360/segs-gap, start=-90+gap/2;
  const p2=(a,rad)=>({x:cx+rad*Math.cos(a*Math.PI/180),y:cy+rad*Math.sin(a*Math.PI/180)});
  let paths='';
  for(let i=0;i<segs;i++){
    const s0=start+i*(360/segs), s1=s0+total;
    const a=p2(s0,r), b=p2(s1,r);
    const on=i<filled;
    const L=(2*Math.PI*r*(total/360)).toFixed(1);
    const dly=(0.1+i*0.11).toFixed(2);
    const anim=on
      ? `--L:${L}px;animation:ahSegDraw .5s cubic-bezier(.32,.72,0,1) ${dly}s both${i===Math.min(filled,segs)-1?`,ahSegGlow 1.2s ease-out ${(+dly+0.45).toFixed(2)}s 1`:''};`
      : `--L:${L}px;animation:ahSegDraw .45s ease ${dly}s both;`;
    paths+=`<path class="ah-seg-arc" d="M${a.x.toFixed(2)},${a.y.toFixed(2)} A${r},${r} 0 0,1 ${b.x.toFixed(2)},${b.y.toFixed(2)}" fill="none" stroke="${on?color:'var(--ah-ring-off,rgba(120,120,128,0.22))'}" stroke-width="${stroke}" stroke-linecap="round" style="${anim}"/>`;
  }
  return `<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block;overflow:visible">${paths}</svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
      <span class="ah-seg-num" style="font-size:15px;font-weight:700;color:var(--ah-ink);letter-spacing:-0.02em;animation:ahSegNum .45s cubic-bezier(.34,1.42,.64,1) ${(0.1+Math.min(filled,segs)*0.11+0.1).toFixed(2)}s both">${filled}</span>
    </div>
  </div>`;
}

/* Consistency — 12-week class-count discipline bars (Apple Health style)
   series: [{wk, count}] ascending.
   • each bar = classes that week (amber, gradient + gloss for depth)
   • a missed week (0) renders as a dashed "ghost slot" so a gap in discipline is visible
   • current week carries a small dot on its crown
   • dashed average line + label sits across the plot */
function ahWeeklyLine(series){
  const wks=(series||[]).slice(-12);
  if(wks.length<2) return '';
  const n=wks.length;
  const total=wks.reduce((a,w)=>a+w.count,0);
  const avgPerWk=total/n;
  const max=Math.max(1,...wks.map(w=>w.count));
  const thisWeek=wks[n-1].count;

  // geometry
  const W=300, H=128, padT=16, padB=22, padL=22, padR=10;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const slot=plotW/n, bw=Math.min(16,slot*0.5), gap=(slot-bw)/2;
  const y0=padT+plotH;
  const yFor=v=>padT+plotH*(1-v/max);
  const thisKey=String(_weekKey(new Date()));

  // Y gridlines: 0, mid, max — labelled with class counts
  const ticks=[0,Math.round(max/2),max].filter((v,i,a)=>a.indexOf(v)===i);
  let grid='';
  ticks.forEach(t=>{
    const y=yFor(t);
    grid+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--ah-hair-2)" stroke-width="0.5"/>`;
    grid+=`<text x="${(padL-5).toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8" fill="var(--ah-grey-2)">${t}</text>`;
  });

  let defs='', bars='';
  wks.forEach((w,i)=>{
    const x=padL+i*slot+gap;
    const isNow=String(w.wk)===thisKey;
    const cx=x+bw/2;
    if(w.count===0){
      // ghost slot — a small dashed outline marks a missed week
      const gh=plotH*0.20;
      bars+=`<rect x="${x.toFixed(1)}" y="${(y0-gh).toFixed(1)}" width="${bw.toFixed(1)}" height="${gh.toFixed(1)}" rx="4" fill="none" stroke="var(--ah-grey-2)" stroke-width="1" stroke-dasharray="2 2" opacity="0.55"/>`;
    }else{
      const h=Math.max(4,plotH*(w.count/max)), y=y0-h;
      const gid='cwb'+i;
      const top=isNow?'#FFB340':'#FFB85A', bot=isNow?'#F59500':'#FFC877';
      defs+=`<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient>`;
      // baseline glow — anchors the bar, subtle depth
      bars+=`<ellipse cx="${cx.toFixed(1)}" cy="${(y0+2).toFixed(1)}" rx="${(bw*0.55).toFixed(1)}" ry="2.5" fill="var(--ah-c-streak)" opacity="${isNow?0.20:0.09}"/>`;
      // body
      bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="url(#${gid})"/>`;
      // top gloss — light catches the crown (kept gentle: 0.30 so it never shouts)
      bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.min(h*0.5,9).toFixed(1)}" rx="4" fill="rgba(255,255,255,0.30)"/>`;
    }
    // X labels every other week + always the last; current week reads "now" in accent
    if(isNow){
      bars+=`<text x="${cx.toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="8" font-weight="700" fill="var(--ah-c-streak)">now</text>`;
    }else if(i%2===0||i===n-1){
      const d=new Date(parseInt(w.wk));
      bars+=`<text x="${cx.toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="8" fill="var(--ah-grey-2)">${d.getDate()}/${d.getMonth()+1}</text>`;
    }
  });

  // average line + label (white pill behind so it never collides with a bar)
  const ay=yFor(avgPerWk);
  const avgStr=avgPerWk>=10?Math.round(avgPerWk):avgPerWk.toFixed(1);
  const avgLine=`<line x1="${padL}" y1="${ay.toFixed(1)}" x2="${W-padR}" y2="${ay.toFixed(1)}" stroke="var(--ah-grey-2)" stroke-width="1" stroke-dasharray="3 3" opacity="0.65"/>`;
  const avgLbl=`<g><rect x="${(W-padR-44).toFixed(1)}" y="${(ay-9).toFixed(1)}" width="44" height="13" rx="3" fill="var(--ah-surface)"/><text x="${(W-padR).toFixed(1)}" y="${(ay+1).toFixed(1)}" text-anchor="end" font-size="8.5" font-weight="600" fill="var(--ah-ink-2)">avg ${avgStr}</text></g>`;

  // summary header — mirrors "Today / Average" of the reference
  const header=`<div style="display:flex;gap:28px;margin-bottom:12px">
    <div>
      <div style="font-size:11px;color:var(--ah-grey);margin-bottom:2px">This week</div>
      <div style="display:flex;align-items:baseline;gap:5px">
        <span style="width:7px;height:7px;border-radius:50%;background:var(--ah-c-streak);display:inline-block"></span>
        <span style="font-size:20px;font-weight:700;color:var(--ah-ink);letter-spacing:-0.02em">${thisWeek}</span>
        <span style="font-size:11px;color:var(--ah-grey)">class${thisWeek!==1?'es':''}</span>
      </div>
    </div>
    <div>
      <div style="font-size:11px;color:var(--ah-grey);margin-bottom:2px">Average / week</div>
      <div style="display:flex;align-items:baseline;gap:5px">
        <span style="width:7px;height:7px;border-radius:50%;background:var(--ah-grey-2);display:inline-block"></span>
        <span style="font-size:20px;font-weight:700;color:var(--ah-ink);letter-spacing:-0.02em">${avgStr}</span>
        <span style="font-size:11px;color:var(--ah-grey)">/ wk</span>
      </div>
    </div>
  </div>`;

  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible"><defs>${defs}</defs>${grid}${avgLine}${bars}${avgLbl}</svg>`;
  return header+svg;
}

/* CARD: Prime time — 2D signature: weekday × hour of your training life */
/* mini rail (13b): 6A–10P in 8 two-hour buckets, flex-spaced so beads never overlap */
function _primeMiniRail(timed,wide){
  const buckets=new Array(8).fill(0);
  timed.forEach(r=>{const h=r.dt.getHours();if(h>=6&&h<22)buckets[Math.floor((h-6)/2)]++;});
  const mx=Math.max(...buckets);
  if(!mx)return '';
  const beads=buckets.map(n=>{
    if(!n)return '<span style="width:4.5px;height:4.5px;border-radius:50%;background:var(--ah-rail-off,rgba(23,24,28,0.1));border:1px solid var(--ah-rail-hi,rgba(255,255,255,0.55));box-sizing:border-box;flex-shrink:0"></span>';
    const k=n/mx, peak=n===mx, d=peak?13:(6.5+Math.round(k*3));
    const fill=(0.5+k*0.16).toFixed(2);
    // A2: the peak bead carries a soft white halo, so it reads without colour
    const halo=peak?',0 0 0 3px var(--ah-rail-halo,rgba(255,255,255,0.6)),0 4px 12px -3px rgba(40,40,50,0.3)':'';
    return `<span style="width:${d}px;height:${d}px;border-radius:50%;flex-shrink:0;box-sizing:border-box;background:radial-gradient(70% 70% at 32% 26%,rgba(255,255,255,0.99),rgba(255,255,255,${fill}) 62%,rgba(255,255,255,${(fill*0.78).toFixed(2)}) 100%);border:1px solid var(--ah-rail-rim,rgba(255,255,255,0.9));box-shadow:inset 0 1px 0 rgba(255,255,255,0.95),0 2px 6px -2px rgba(40,40,50,0.18)${halo}"></span>`;
  }).join('');
  return `<div style="${wide?'width:100%;':'flex-shrink:0;width:88px;'}display:flex;align-items:center;justify-content:space-between;gap:3px;height:22px;padding:0 8px;box-sizing:border-box;border-radius:999px;background:var(--ah-rail-bg,rgba(23,24,28,0.05));box-shadow:inset 0 1px 0 var(--ah-rail-hi,rgba(255,255,255,0.6))">${beads}</div>`;
}
function _pillPrime(name,rows){
  const timed=rows.filter(r=>r.dt.getHours()!==0||r.dt.getMinutes()!==0);
  if(timed.length<5) return '';
  // 2D mode: most common (weekday, hour) cell
  const cell={}; timed.forEach(r=>{const k=r.dt.getDay()+'-'+r.dt.getHours();cell[k]=(cell[k]||0)+1;});
  const topCell=Object.entries(cell).sort((a,b)=>b[1]-a[1])[0];
  const [dow,hr]=topCell[0].split('-').map(Number);
  const dows=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const hrStr=h=>{const ap=h>=12?'PM':'AM';const hh=h%12||12;return hh+' '+ap;};
  const share=Math.round(topCell[1]/timed.length*100);
  // evening share for meta
  const evening=timed.filter(r=>r.dt.getHours()>=17).length;
  const evPct=Math.round(evening/timed.length*100);
  // dynamic icon by signature hour: morning→sunrise, midday→sun, evening→sunset, night→moon
  const primeIcon = hr<11 ? AH_ICON.sunrise
    : hr<16 ? AH_ICON.sun
    : hr<20 ? AH_ICON.sunset
    : AH_ICON.moon;
  return `<section style="--cat:var(--ah-c-time);--cat-soft:var(--ah-c-time-soft)">
    <div class="ah-sq" onclick="ahOpenSheet('prime')">
      <div class="ah-chrome" style="gap:11px">

        <div style="font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ah-grey-2)">Signature slot</div>
        <div class="ah-sq-line" style="white-space:nowrap;margin-top:5px">${dows[dow].slice(0,3)} · ${hrStr(hr)}</div>

        </div>
      </div>
    </div>
  </section>`;
}

/* CARD: Streak — compact long pill, 5-segment ring right */
function _pillStreak(name,rows){
  const streak=calcStreak(name);
  const longest=_longestStreak(rows);
  // narrative adapts to state — emotion first, number second
  const narrative = streak === 0 ? 'No run yet'
    : (streak >= longest && streak >= 3) ? 'Personal best'
    : 'On a run';
  const toGo = (longest>0 && streak<longest) ? `Best ${longest}` : '';
  const streakIcon = AH_ICON.calcheck;
  // segmented streak ring — same language as the drill-down sheet (5 arcs, one per week)
  const bars=(()=>{
    const size=50,stroke=4.5,segs=5,gap=16;
    const r=(size-stroke)/2,cx=size/2,cy=size/2,arc=360/segs-gap,start=-90+gap/2;
    const p2=(a)=>({x:cx+r*Math.cos(a*Math.PI/180),y:cy+r*Math.sin(a*Math.PI/180)});
    const on=Math.min(streak,segs);
    let paths='';
    for(let i=0;i<segs;i++){
      const s0=start+i*(360/segs),s1=s0+arc,a=p2(s0),b=p2(s1);
      const L=(2*Math.PI*r*(arc/360)).toFixed(1);
      const dly=(0.1+i*0.11).toFixed(2);
      const anim='--L:'+L+'px;animation:ahSegDraw '+(i<on?'.5s cubic-bezier(.32,.72,0,1) ':'.45s ease ')+dly+'s both'
        +((i<on&&i===on-1)?',ahSegGlow 1.2s ease-out '+(+dly+0.45).toFixed(2)+'s 1':'')+';';
      paths+='<path class="ah-seg-arc" style="'+anim+'" d="M'+a.x.toFixed(2)+','+a.y.toFixed(2)+' A'+r+','+r+' 0 0,1 '+b.x.toFixed(2)+','+b.y.toFixed(2)+'" fill="none" stroke="'+(i<on?'rgba(163,255,88,0.95)':'var(--ah-ring-off,rgba(23,24,28,0.14))')+'" stroke-width="'+stroke+'" stroke-linecap="round"/>';
    }
    return '<div style="position:relative;width:'+size+'px;height:'+size+'px;flex-shrink:0">'
      +'<svg width="'+size+'" height="'+size+'" style="display:block">'+paths+'</svg>'
      +'<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0">'
      +'<span class="ah-seg-num" style="font-size:17px;font-weight:500;letter-spacing:-0.03em;line-height:1;color:var(--ah-ink);animation:ahSegNum .45s cubic-bezier(.34,1.42,.64,1) '+(0.1+on*0.11+0.1).toFixed(2)+'s both">'+streak+'</span>'
      +'<span style="font-size:7.5px;font-weight:600;letter-spacing:0.06em;color:var(--ah-grey-2);margin-top:1px">wks</span></div></div>';
  })();
  return `<section style="--cat:var(--ah-c-streak);--cat-soft:var(--ah-c-streak-soft)">
    <div class="ah-sq ah-sq-dusk" onclick="ahOpenSheet('streak')">
      <div class="ah-chrome">
        <div class="ah-chrome-tile">${streakIcon}</div>
        <span class="ah-chrome-name">Weekly Streak</span>
        <span class="ah-chrome-meta"></span>
      </div>
      <div class="ah-sq-body" style="justify-content:flex-end">
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px">
          <div class="ah-sq-sub" style="flex:1;min-width:0;line-height:1.45;overflow:visible;display:block">${narrative}${toGo?' · <span style="opacity:0.7">'+toGo+'</span>':''}</div>
          ${bars}
        </div>
      </div>
    </div>
  </section>`;
}

/* Bind the dropdown after the dashboard feed renders */
function _bindHeroRange(name){
  const row=document.getElementById('ahRangeRow');
  if(row){
    row.querySelectorAll('.ah-range-tab').forEach(tab=>{
      tab.onclick=(e)=>{
        e.stopPropagation();
        if(_ahHeroRange===tab.getAttribute('data-range'))return;
        _ahHeroRange=tab.getAttribute('data-range');
        row.querySelectorAll('.ah-range-tab').forEach(t=>t.classList.toggle('on',t===tab));
        const body=document.getElementById('ahHeroBody');
        if(!body)return;
        const EASE='cubic-bezier(.32,.72,0,1)';
        const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const h0=body.getBoundingClientRect().height;
        body.innerHTML=_heroBody(name,_ahHeroRange);
        if(reduce)return;
        const h1=body.getBoundingClientRect().height;
        if(Math.abs(h1-h0)>1){
          body.style.transition='none';body.style.height=h0+'px';body.style.overflow='hidden';
          void body.getBoundingClientRect();
          body.style.transition='height .62s '+EASE;body.style.height=h1+'px';
          setTimeout(()=>{body.style.transition='';body.style.height='';body.style.overflow='';},680);
        }
        // content settles in: soft blur + rise, meter a touch later than the numeral
        const kids=[...body.children];
        kids.forEach((el,i)=>{
          el.style.transition='none';el.style.opacity='0';el.style.filter='blur(6px)';el.style.transform='translateY(4px)';
          void el.getBoundingClientRect();
          requestAnimationFrame(()=>{
            const d=(0.05+i*0.05).toFixed(2)+'s';
            el.style.transition='opacity .42s ease '+d+',filter .55s '+EASE+' '+d+',transform .55s '+EASE+' '+d;
            el.style.opacity='';el.style.filter='';el.style.transform='';
            setTimeout(()=>{el.style.transition='';},760);
          });
        });
      };
    });
  }
  const btn=document.getElementById('ahRangeBtn');
  const menu=document.getElementById('ahRangeMenu');
  if(!btn||!menu) return;
  btn.onclick=(e)=>{
    e.stopPropagation();
    const opening=!menu.classList.contains('open');
    menu.classList.toggle('open');
    if(opening){
      setTimeout(()=>{
        document.addEventListener('click',function closeM(){menu.classList.remove('open');document.removeEventListener('click',closeM);});
      },0);
    }
  };
  menu.querySelectorAll('.ah-range-opt').forEach(opt=>{
    opt.onclick=(e)=>{
      e.stopPropagation();
      _ahHeroRange=opt.getAttribute('data-range');
      const body=document.getElementById('ahHeroBody');
      const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      // capture current displayed ring/number BEFORE swapping
      const prevArc=body?body.querySelector('.ah-ring-fill[data-ring="hero"]'):null;
      const prevNum=body?body.querySelector('.ah-hero-num'):null;
      const fromPct=prevArc?parseFloat(prevArc.getAttribute('data-target-pct'))||0:0;
      const fromVal=prevNum?parseFloat(prevNum.textContent)||0:0;
      const apply=()=>{
        if(body){
          body.innerHTML=_heroBody(name,_ahHeroRange);
          const arc=body.querySelector('.ah-ring-fill[data-ring="hero"]');
          const num=body.querySelector('.ah-hero-num');
          const toPct=arc?parseFloat(arc.getAttribute('data-target-pct'))||0:0;
          const toVal=num?parseFloat(num.getAttribute('data-count')||num.textContent)||0:0;
          if(!reduce){
            body.classList.remove('ah-switching');
            // tween ring + number from the previous range's values → new values
            ahDriveRing(arc,num,fromPct,toPct,{fromVal:fromVal,toVal:toVal,dur:900});
          }
          // range control now lives inside ahHeroBody → rebind the fresh button + menu
          _bindHeroRange(name);
        }
      };
      menu.classList.remove('open');
      if(body&&!reduce){
        body.classList.add('ah-switching');
        setTimeout(apply,180);
      } else { apply(); }
    };
  });
}
