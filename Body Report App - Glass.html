/* ── Period selector ── */
function getPeriodDateLabel(period){
  const now=new Date();
  const fmt=(d)=>d.toLocaleDateString('th-TH',{day:'numeric',month:'short'});
  const dayTh=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
  const dow=(now.getDay()+6)%7; // Mon=0
  if(period==='thisWeek'){
    const start=new Date(now);start.setDate(now.getDate()-dow);start.setHours(0,0,0,0);
    return `${dayTh[start.getDay()]} ${fmt(start)} – ${dayTh[now.getDay()]} ${fmt(now)}`;
  }
  if(period==='lastWeek'){
    const end=new Date(now);end.setDate(now.getDate()-dow-1);end.setHours(23,59,59,0); // last Sunday
    const start=new Date(end);start.setDate(end.getDate()-6);start.setHours(0,0,0,0); // last Monday
    return `${dayTh[start.getDay()]} ${fmt(start)} – ${dayTh[end.getDay()]} ${fmt(end)}`;
  }
  if(period===30){
    const start=new Date(now);start.setDate(now.getDate()-30);
    return `${fmt(start)} – ${fmt(now)}`;
  }
  return '';
}

/* LINE button: outside the LINE app liff was never init'd, so a bare liff.login()
   threw and the click did nothing. Init on demand and surface any failure. */
async function loginWithLine(btn){
  const label=btn?btn.lastChild:null;
  const say=t=>{const e=document.getElementById('emailError');if(e){e.textContent=t;e.style.display='block';}};
  if(typeof liff==='undefined'){say('LINE login unavailable — please use your email.');return;}
  if(btn){btn.disabled=true;btn.style.opacity='0.6';}
  try{
    if(!liff.id) await liff.init({liffId:LIFF_ID});
    if(liff.isLoggedIn()){ await initLiff(); return; }
    liff.login();
  }catch(err){
    console.error('LINE login error:',err);
    say('Could not open LINE login — please use your email.');
  }finally{
    if(btn){btn.disabled=false;btn.style.opacity='';}
  }
}

/* Pause animation loops on cards that are off-screen. Re-scans as the feed re-renders. */
(function(){
  if(!('IntersectionObserver' in window))return;
  const SEL='.ah-card,.ah-sq,.ah-hl,.psh,.wr-track,.ah-sheet-hero';
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>e.target.classList.toggle('anim-idle',!e.isIntersecting));
  },{rootMargin:'120px 0px'});
  const seen=new WeakSet();
  const scan=()=>document.querySelectorAll(SEL).forEach(el=>{
    if(seen.has(el))return; seen.add(el); io.observe(el);
  });
  let t=0;
  // never let a full-document scan land on the frames a sheet is sliding
  const busy=()=>{const s=document.getElementById('ahSheet');return !!(s&&s.classList.contains('open')&&s.dataset.settled!=='1');};
  const kick=()=>{clearTimeout(t);t=setTimeout(()=>{ if(busy()){kick();return;} scan(); },320);};
  document.addEventListener('DOMContentLoaded',scan);
  new MutationObserver(kick).observe(document.documentElement,{childList:true,subtree:true});
  scan();
})();

/* One ingest-time repair pass so no card has to guess about the source data. */
function _normalizeBookings(rows){
  if(!Array.isArray(rows)) return [];
  // numeric d/m/y (or m/d/y) with optional time — ISO strings are left alone
  const NUM=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[ T](\d{1,2}):(\d{2}))?/;
  // Read the whole column first: any first component > 12 proves the column is day-first.
  // (Falling back to day-first matches every Thai studio export we've seen.)
  let dayFirst=true;
  for(const b of rows){
    for(const key of ['event_date','booking_date']){
      const s=b&&b[key]!=null?String(b[key]).trim():'';
      const m=s&&s.match(NUM);
      if(!m) continue;
      if(+m[1]>12){dayFirst=true;break;}
      if(+m[2]>12){dayFirst=false;}
    }
  }
  const fixDate=v=>{
    if(v==null) return v;
    const s=String(v).trim();
    if(!s||/^\d{4}-\d{2}-\d{2}/.test(s)) return s;      // already ISO
    const m=s.match(NUM);
    if(!m) return s;
    let[,a,b2,y,hh,mi]=m;
    let d=dayFirst?a:b2, mo=dayFirst?b2:a;
    if(+mo>12&&+d<=12){const t=d;d=mo;mo=t;}              // per-row sanity swap
    y=+y; if(y<100) y+=2000; if(y>2400) y-=543;           // พ.ศ. → ค.ศ.
    const p=n=>String(n).padStart(2,'0');
    return y+'-'+p(mo)+'-'+p(d)+'T'+p(hh||0)+':'+p(mi||0)+':00';
  };
  const BOOKED=/^(booked|attended|checked[\s-]?in|complete[d]?|present|show(ed)?[\s-]?up|มา|เข้าเรียน)$/i;
  return rows.map(b=>{
    const o=Object.assign({},b);
    if(o.contact_name!=null) o.contact_name=String(o.contact_name).replace(/\s+/g,' ').trim();
    const raw=String(o.booking_status==null?'':o.booking_status).trim();
    if(BOOKED.test(raw)) o.booking_status='Booked';
    // keep any other status verbatim (cancelled, no-show, waitlist …) so it stays excluded
    o.event_date=fixDate(o.event_date);
    if(o.booking_date!=null) o.booking_date=fixDate(o.booking_date);
    return o;
  });
}

/* ── LIFF Init ── */
async function initLiff(){
  try{
    const ua=navigator.userAgent||'';
    const isLineApp=ua.includes('Line/');

    if(!isLineApp){
      // Browser / dev mode
      showEmailScreen();
      return;
    }

    // Inside LINE app — init LIFF
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){
      liff.login();
      return;
    }

    const profile=await liff.getProfile();
    currentLineId=profile.userId;

    // Check if already mapped (เคยใส่อีเมลแล้ว)
    const saved=localStorage.getItem('pilar_email_'+currentLineId);
    if(saved){
      await loadByEmail(saved,currentLineId);
    } else {
      // ครั้งแรก — ถามอีเมล Pilar เสมอ ไม่ดึงจาก LINE
      showEmailScreen();
    }
  }catch(err){
    console.error('LIFF init error:',err);
    showEmailScreen();
  }
}

function showEmailScreen(){
  document.getElementById('liffLoading').style.display='none';
  document.getElementById('emailScreen').style.display='block';
}

/* ── Email submit ── */
async function submitEmail(){
  const email=document.getElementById('emailInput').value.toLowerCase().trim();
  const errEl=document.getElementById('emailError');
  errEl.style.display='none';

  if(!email||!email.includes('@')){
    errEl.textContent='กรุณาใส่อีเมลให้ถูกต้องครับ';
    errEl.style.display='block';
    return;
  }

  const btn=document.querySelector('#emailScreen button');
  btn.textContent='กำลังค้นหา...';
  btn.disabled=true;

  // Save mapping + go straight to loadByEmail (1 call only)
  if(currentLineId) localStorage.setItem('pilar_email_'+currentLineId,email);
  try{
    await loadByEmail(email,currentLineId);
  }catch(err){
    console.error('email sign-in failed:',err);
    // loadByEmail() hid the form and showed the spinner — restore both, or the message
    // would be written into a display:none subtree and the spinner would spin forever
    document.getElementById('liffLoading').style.display='none';
    document.getElementById('emailScreen').style.display='block';
    errEl.textContent=_loadErrMsg(err);
    errEl.style.display='block';
    btn.textContent='SEE MY PROGRESS';
    btn.disabled=false;
  }
}

/* Turn a load failure into the reason a member can act on. Used by BOTH sign-in paths. */
function _loadErrMsg(err){
  const m=String(err&&(err.message||err))||'';
  if(/abort/i.test(m))                            return 'ระบบตอบกลับช้ากว่าปกติ — กดลองใหม่อีกครั้ง';
  if(/http 5|non-json/i.test(m))                  return 'เซิร์ฟเวอร์ไม่พร้อมชั่วคราว — ลองใหม่อีกครั้ง';
  if(/network|fetch|load failed|timeout/i.test(m)) return 'เชื่อมต่อไม่ได้ — ตรวจสัญญาณแล้วลองใหม่';
  if(/liff|init|id token|access token/i.test(m))   return 'เปิดผ่านแอป LINE ไม่สำเร็จ — ลองใช้อีเมลด้านล่าง';
  if(/json|parse|unexpected/i.test(m))            return 'ข้อมูลจากระบบไม่สมบูรณ์ — แจ้งสตูดิโอได้เลย';
  return 'เกิดข้อผิดพลาด กรุณาลองใหม่';
}

/* ── Load bookings by email ── */
async function loadByEmail(email,lineId){
  currentUserEmail=email;
  document.getElementById('liffLoading').style.display='flex';
  document.getElementById('liffLoading').style.justifyContent='center';
  document.getElementById('emailScreen').style.display='none';

  try{
    const _url=`${API_URL}?action=getBookings&email=${encodeURIComponent(email)}&lineId=${encodeURIComponent(lineId)}`;
    const _get=async(ms)=>{
      const ac=('AbortController' in window)?new AbortController():null;
      const t=setTimeout(()=>ac&&ac.abort(),ms);
      try{
        const r=await fetch(_url,ac?{signal:ac.signal}:undefined);
        if(!r.ok) throw new Error('HTTP '+r.status);
        const txt=await r.text();
        if(!txt||/^\s*</.test(txt)) throw new Error('non-JSON response');   // HTML error/timeout page
        return JSON.parse(txt);
      } finally { clearTimeout(t); }
    };
    let data;
    try{
      data=await _get(15000);
    }catch(e1){
      console.warn('getBookings retry after:',e1&&e1.message);
      const st=document.getElementById('liffLoadStatus');
      if(st) st.textContent='กำลังลองอีกครั้ง…';
      data=await _get(25000);                                              // one retry, longer budget
    }

    // Email not in system at all
    if(data.found===false){
      document.getElementById('liffLoading').style.display='none';
      document.getElementById('emailScreen').style.display='block';
      const errEl=document.getElementById('emailError');
      errEl.textContent='ไม่พบอีเมลนี้ในระบบ กรุณาติดต่อ Pilar Studio ครับ';
      errEl.style.display='block';
      const btn=document.querySelector('#emailScreen button');
      btn.textContent='SEE MY PROGRESS';
      btn.disabled=false;
      if(currentLineId) localStorage.removeItem('pilar_email_'+currentLineId);
      return;
    }

    if(!data.bookings||!data.bookings.length){
      document.getElementById('liffLoading').innerHTML=`
        <div style="text-align:center;padding:40px 0">
          <div style="margin-bottom:12px"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto;display:block"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-3H5a2 2 0 0 0-2 2Z"/></svg></div>
          <div style="color:#fff;font-size:15px;font-weight:700;margin-bottom:8px">ยังไม่มีข้อมูล</div>
          <div style="color:rgba(255,255,255,0.4);font-size:12px">ยังไม่มี booking ในระบบสำหรับอีเมลนี้</div>
          <button onclick="localStorage.removeItem('pilar_email_${lineId}');showEmailScreen()"
            style="margin-top:24px;background:rgba(255,255,255,0.1);border:none;border-radius:8px;padding:8px 20px;color:#fff;font-size:13px;cursor:pointer">
            ใช้อีเมลอื่น
          </button>
        </div>`;
      return;
    }

    allBookings=_normalizeBookings(data.bookings);
    // studio-wide aggregates for Wrapped comparison slides (names stripped, privacy-safe)
    window._studioStats=data.studioStats||null;
    window._wrStudioCache=null;

    // Staff check — show member list
    if(STAFF_EMAILS.includes(email)){
      // multiple names under one email → treat the dominant spelling as the member
      allCustomers=[...new Set(allBookings.map(b=>b.contact_name).filter(Boolean))].sort();
    }

    // Member — go directly to their dashboard.
    // The email already decided WHOSE bookings these are; the name is only how the UI slices
    // them (every card filters contact_name===currentName). If the studio spelled the name
    // differently across bookings, that filter would throw most of their history away — so
    // pick the dominant spelling and stamp it on every row.
    if(!allBookings.length){
      document.getElementById('liffLoading').innerHTML=`
        <div style="text-align:center;padding:40px 0">
          <div style="color:var(--ah-ink,#17181C);font-size:14px;font-weight:600">ไม่พบประวัติการจอง</div>
          <div style="color:var(--ah-grey,#6b6b70);font-size:12px;margin-top:6px">อีเมลนี้ยังไม่มีคลาสในระบบ</div>
        </div>`;
      return;
    }
    const _tally={};
    allBookings.forEach(b=>{const n=(b.contact_name||'').trim();if(n)_tally[n]=(_tally[n]||0)+1;});
    const name=Object.keys(_tally).sort((a,b)=>_tally[b]-_tally[a])[0]||allBookings[0].contact_name;
    allBookings.forEach(b=>{b.contact_name=name;});
    selC(name);

  }catch(err){
    console.error('LIFF init failed:',err);
    const _msg=_loadErrMsg(err);
    document.getElementById('liffLoading').innerHTML=`
      <div style="text-align:center;padding:36px 20px">
        <div style="width:40px;height:40px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:rgba(255,69,58,0.1)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D9382E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 8v4.5M12 16h.01"/></svg>
        </div>
        <div style="color:var(--ah-ink,#17181C);font-size:14px;font-weight:600;letter-spacing:-0.01em">เข้าสู่ระบบไม่สำเร็จ</div>
        <div style="color:var(--ah-grey,#6b6b70);font-size:12px;margin-top:6px;line-height:1.5">${_msg}</div>
        <button onclick="location.reload()"
          style="margin-top:18px;background:#17181C;border:none;border-radius:999px;corner-shape:squircle;padding:10px 22px;color:#fff;font-family:var(--ah-font);font-size:12.5px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent">
          ลองใหม่
        </button>
      </div>`;
  }
}
function renderCList(list){
  const el=document.getElementById('cList');
  if(!list.length){el.innerHTML='<div class="no-res">ไม่พบชื่อนี้</div>';return;}
  el.innerHTML=list.map(c=>{
    const cnt=allBookings.filter(b=>b.contact_name===c).length;
    return `<button class="citem" onclick="selC('${c.replace(/'/g,"\\'")}')">
      <span>${c}</span>
      <span class="cbadge">${cnt} sessions</span>
    </button>`;
  }).join('');
}
function filterC(){
  const q=document.getElementById('sInput').value.toLowerCase();
  renderCList(allCustomers.filter(c=>c.toLowerCase().includes(q)));
}
function selC(name){
  currentName=name;
  currentPeriod=0;
  showScr('sd');
  document.getElementById('sd').scrollTop=0;

    console.error(e);
  }
}

/* drag-to-dismiss: grab zone = grabber + header */
function _sheetDrag(sh){
  let y0=null,dy=0;
  const start=e=>{ y0=(e.touches?e.touches[0]:e).clientY; dy=0; sh.classList.add('dragging'); };
  const move=e=>{
    if(y0===null) return;
    dy=Math.max(0,((e.touches?e.touches[0]:e).clientY)-y0);
    sh.style.transform=`translateY(${dy}px)`;
    if(dy>0&&e.cancelable)e.preventDefault();
  };
  const end=()=>{
    if(y0===null) return;
    sh.classList.remove('dragging'); sh.style.transform='';
    if(dy>110) ahCloseSheet();
    y0=null;
  };
  const zone=[sh.querySelector('.ah-sheet-grab'),sh.querySelector('.ah-sheet-head')];
  zone.forEach(z=>{
    z.addEventListener('touchstart',start,{passive:true});
    z.addEventListener('mousedown',start);
  });
  sh.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mousemove',move);
  sh.addEventListener('touchend',end);
  window.addEventListener('mouseup',end);
}

/* Drill-down share button → opens the right sticker for the current sheet.
   streak/prime → their dedicated card sticker (4th tab). load → standard share. */
function _ahSheetShareGo(){
  const kind=AH_SHEET.kind;
  ahCloseSheet();
  setTimeout(()=>{
    if(kind==='consistency'){ _shareCardType=null;_shareHL=null;_shareLayout='A';openShareCamera(); }
    else if(kind==='load'){ shareCard('activity'); }
    else if(kind==='streak'){ _shareCardType=null;_shareHL=null;_shareLayout='B';openShareCamera(); }
    else if(kind==='prime'){ shareCard(kind); }
    else { _shareCardType=null;_shareHL=null;_shareLayout='A';openShareCamera(); }
  },420);
}

function ahStreakMode(m){
  if((AH_SHEET.streakMode||'current')===m)return;
  AH_SHEET.streakMode=m;AH_SHEET.streakFold=true;
  const EASE='cubic-bezier(.32,.72,0,1)';
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const body=document.getElementById('ahSheetBody');
  const h0=body?body.getBoundingClientRect().height:0;
  const segOld=body?body.querySelector('.ah-sheet-seg'):null;
  const sx0=segOld?(segOld.style.getPropertyValue('--sx')||segOld.dataset.i||'0'):null;
  _sheetRender();
  if(reduce||!body)return;
  const b2=document.getElementById('ahSheetBody');
  if(!b2)return;
  // the rebuilt seg is a fresh node → seed it with the old index, then slide to the new one
  const seg=b2.querySelector('.ah-sheet-seg');
  if(seg&&sx0!==null){
    const sx1=seg.style.getPropertyValue('--sx')||seg.dataset.i||'0';
    seg.style.transition='none';
    seg.style.setProperty('--sx',sx0);seg.dataset.i=sx0;
    void seg.getBoundingClientRect();
    requestAnimationFrame(()=>{
      seg.style.transition='';
      seg.style.setProperty('--sx',sx1);seg.dataset.i=sx1;
    });
  }
  const h1=b2.getBoundingClientRect().height;
  if(h0&&Math.abs(h1-h0)>1){
    b2.style.transition='none';b2.style.height=h0+'px';b2.style.overflow='hidden';
    void b2.getBoundingClientRect();
    b2.style.transition='height .62s '+EASE;b2.style.height=h1+'px';
    setTimeout(()=>{b2.style.transition='';b2.style.height='';b2.style.overflow='';},680);
  }
  // hero card + weekly history settle in as layers (segmented control stays put)
  const layers=[b2.querySelector('#ahSheetChart'),b2.querySelector('#ahSheetMeas')].filter(Boolean);
  layers.forEach((el,i)=>{
    el.style.transition='none';el.style.opacity='0';el.style.filter='blur(7px)';el.style.transform='translateY(5px)';
    void el.getBoundingClientRect();
    requestAnimationFrame(()=>{
      const d=(0.05+i*0.06).toFixed(2)+'s';
      el.style.transition='opacity .45s ease '+d+',filter .6s '+EASE+' '+d+',transform .6s '+EASE+' '+d;
      el.style.opacity='';el.style.filter='';el.style.transform='';
      setTimeout(()=>{el.style.transition='';},780);
    });
  });
}

  const _LEGEND=ink=>'<div style="margin-top:14px;padding-top:10px;border-top:1px solid '+(ink?'rgba(23,24,28,0.1)':'rgba(255,255,255,0.18)')+';display:flex;align-items:center;gap:12px;font-size:9.5px;color:'+(ink?'rgba(23,24,28,0.58)':'rgba(255,255,255,0.7)')+';flex-wrap:wrap">'

  // 7D / 30D → day-level detail: which days you actually came
  const heroDaily=(()=>{

    const head=t=>'<div style="font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.85)">'+t+'</div>';
    // selected-day panel (27b) — shared by 7D and 30D, lives inside the hero
    const buildDayPanel=()=>{

        +'<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">'
          +'<span style="font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.85)">'+ttl+'</span>'

  // 7D / 30D → day rows. Attended days get a full row; runs of rest days collapse

  const heroMonth=(()=>{

    const cnt={};rows.forEach(r=>{const k=r.dt.getFullYear()+'-'+r.dt.getMonth();cnt[k]=(cnt[k]||0)+1;});
    const now=new Date();const first=rows.reduce((mn,r)=>r.dt<mn?r.dt:mn,now);

/* Kick sheet ring from empty → target so it eases in on open / filter change.
   Double rAF guarantees the browser paints the empty state first, so the
   transition actually runs instead of snapping. */
function _kickSheetRing(){
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  requestAnimationFrame(()=>{
    const rings=document.querySelectorAll('.ah-sheet .ah-ring-fill');
    rings.forEach(r=>r.classList.remove('filled'));
    if(reduce){ rings.forEach(r=>r.classList.add('filled')); return; }
    requestAnimationFrame(()=>{ rings.forEach(r=>r.classList.add('filled')); });
  });
}

/* trend vs the previous window of equal length — the one sentence that answers
   "ช่วงนี้ฉันมาสม่ำเสมอแค่ไหน" */
function _sheetTrendSay(av){
  const d=SHEET_RANGES[AH_SHEET.range].days;
  if(!d){
    return `Since you joined, you've averaged <b>${av.toFixed(1)}</b> classes/week`;
  }
  const now=new Date();
  const cut=new Date(now); cut.setDate(now.getDate()-d);
  const cut2=new Date(now); cut2.setDate(now.getDate()-d*2);
  const prevRows=AH_SHEET.rows.filter(r=>r.dt>=cut2&&r.dt<cut);
  const pSeries=_weeklySeries(prevRows);
  const pAv=pSeries.length?pSeries.reduce((a,b)=>a+b.count,0)/pSeries.length:0;
  if(pAv<=0) return `You're averaging <b>${av.toFixed(1)}</b> classes/week this period`;
  const pct=Math.round((av-pAv)/pAv*100);
  if(pct>5)  return `Up <b>+${pct}%</b> on the period before`;
  if(pct<-5) return `Down <b>${pct}%</b> on the period before`;
  return `About the same as the period before`;
}
